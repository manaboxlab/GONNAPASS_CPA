, độ ẩm trong không khí", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2024 - Đề Chẵn"}, {"id": "2024-chan-vocab-4", "type": "fill_blank", "prompt": "The job is very ........................, but rewarding.", "answer": "CHALLENGING", "explanation": "(Công việc này rất thử thách, nhưng đáng làm.)\n- challenging = khó nhưng kích thích kỹ năng và tạo động lực phát triển", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2024 - Đề Chẵn"}, {"id": "2024-chan-vocab-5", "type": "fill_blank", "prompt": "She has a ........................ fear of the dark.", "answer": "CHILDISH", "explanation": "(Cô ấy có nỗi sợ bóng tối như trẻ con.)\n- Childish (adv.) = như trẻ con, hoặc không cần lý do/ logic như người trưởng thành.", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2024 - Đề Chẵn"}, {"id": "2024-chan-vocab-6", "type": "fill_blank", "prompt": "His bright red shoes have white ........................ across them.", "answer": "STRIPES", "explanation": "(Đôi giày đỏ rực của anh ấy có các sọc trắng ngang qua.)\n- stripes = sọc (thường dùng mô tả họa tiết)", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2024 - Đề Chẵn"}, {"id": "2024-chan-vocab-7", "type": "fill_blank", "prompt": "The construction of the new building is almost ........................ .", "answer": "FINISHED", "explanation": "(Việc xây dựng tòa nhà mới gần như đã hoàn tất.)\n- to be finished = đã hoàn thành", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2024 - Đề Chẵn"}, {"id": "2024-chan-vocab-8", "type": "fill_blank", "prompt": "The manager had the outdated files ........................ to make room for more important documents.", "answer": "REMOVED", "explanation": "(Người quản lý đã cho gỡ bỏ các tài liệu lỗi thời để dành chỗ cho tài liệu quan trọng hơn.)\n- to have something removed = cho loại bỏ/di dời vật gì", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2024 - Đề Chẵn"}, {"id": "2024-chan-vocab-9", "type": "fill_blank", "prompt": "The museum is ........................ a collection of ancient artifacts.", "answer": "EXHIBITING", "explanation": "(Bảo tàng đang trưng bày bộ sưu tập hiện vật cổ.)\n- to exhibit something = trưng bày vật gì (thường trong bảo tàng, triển lãm)", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2024 - Đề Chẵn"}, {"id": "2024-chan-vocab-10", "type": "fill_blank", "prompt": "His dedication to his craft demonstrates the ........................ required to succeed in the field.", "answer": "TALENT", "explanation": "(Sự tận tụy với nghề của anh ấy thể hiện tài năng cần thiết để thành công trong lĩnh vực này.)\n- talent (for something) = tài năng (cho việc gì)", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2024 - Đề Chẵn"}, {"id": "2024-chan-vocab-11", "type": "fill_blank", "prompt": "She is a ........................ skilled surgeon.", "answer": "HIGHLY", "explanation": "(Cô ấy là một bác sĩ phẫu thuật có tay nghề rất cao.)\n- highly skilled = có kỹ năng rất cao", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2024 - Đề Chẵn"}, {"id": "2024-chan-vocab-12", "type": "fill_blank", "prompt": "More ........................ anything else, he loves to play video games.", "answer": "THAN", "explanation": "(Hơn bất cứ điều gì, anh ấy thích chơi điện tử.)\n- more than anything else = hơn bất kỳ điều gì khác", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2024 - Đề Chẵn"}, {"id": "2024-chan-vocab-13", "type": "fill_blank", "prompt": "The doctor prescribed antibiotics to treat the bacterial ........................ .", "answer": "INFECTION", "explanation": "(Bác sĩ kê kháng sinh để điều trị nhiễm khuẩn.)\n- bacterial infection = bệnh nhiễm trùng do vi khuẩn gây ra", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2024 - Đề Chẵn"}, {"id": "2024-chan-vocab-14", "type": "fill_blank", "prompt": "It was pure ........................ that we ran into each other at the concert after years of no contact.", "answer": "COINCIDENCE", "explanation": "(Đó hoàn toàn là sự trùng hợp khi chúng tôi tình cờ gặp nhau ở buổi hòa nhạc sau nhiều năm không\nliên lạc.)\n- pure coincidence = sự trùng hợp hoàn toàn ngẫu nhiên", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2024 - Đề Chẵn"}, {"id": "2024-chan-vocab-15", "type": "fill_blank", "prompt": "He is a professional ........................ who spends all his time betting on sports.", "answer": "GAMBLER", "explanation": "(Anh ta là một con bạc chuyên nghiệp, dành hết thời gian để cá độ thể thao.)\n- gambler = người đánh bạc", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2024 - Đề Chẵn"}, {"id": "2024-chan-reading-open-1", "type": "open_short_answer", "passage": "Read the passage and answer the questions:\nThe Amazon rainforest, often called the \"lungs of the Earth,\" is a vital ecosystem. It helps regulate\nthe Earth's climate by absorbing vast amounts of carbon dioxide and producing a significant portion of\nthe world's oxygen. This forest is home to millions of plant and animal species, many of which are\nfound nowhere else in the world. However, deforestation, caused by activities like logging and\nagriculture, is threatening the Amazon's delicate balance. This has a negative impact on the\nenvironment, as it disrupts the habitat of countless species and contributes to climate change.", "prompt": "What is this passage mainly about?", "answer": "It zon's delicate balance. This has a negative impact on the\nenvironment, as it disrupts the habitat of countless species and contributes to climate change.", "prompt": "What does the Amazon Rainforest help regulate?", "answer": "It helps regulate the Earth’s climate. (Nó giúp điều hòa khí hậu của Trái Đất.) Thông tin câu: (2)", "explanation": "", "needs_review": false, "section": "reading-open", "section_label": "Đọc hiểu - Trả lời câu hỏi", "exam_label": "CPA 2024 - Đề Chẵn"}, {"id": "2024-chan-reading-open-4", "type": "open_short_answer", "passage": "Read the passage and answer the questions:\nThe Amazon rainforest, often called the \"lungs of the Earth,\" is a vital ecosystem. It helps regulate\nthe Earth's climate by absorbing vast amounts of carbon dioxide and producing a significant portion of\nthe world's oxygen. This forest is home to millions of plant and animal species, many of which are\nfound nowhere else in the world. However, deforestation, caused by activities like logging and\nagriculture, is threatening the Amazon's delicate balance. This has a negative impact on the\nenvironment, as it disrupts the habitat of countless species and contributes to climate change.", "prompt": "What is a major threat to the Amazon rainforest?", "answer": "Deforestation, caused by logging and agriculture, is a major threat. (Nạn phá rừng do khai thác gỗ và nông nghiệp là mối đe dọa chính.) Thông tin câu: (3)", "explanation": "", "needs_review": false, "section": "reading-open", "section_label": "Đọc hiểu - Trả lời câu hỏi", "exam_label": "CPA 2024 - Đề Chẵn"}, {"id": "2024-chan-reading-open-5", "type": "open_short_answer", "passage": "Read the passage and answer the questions:\nThe Amazon rainforest, often called the \"lungs of the Earth,\" is a vital ecosystem. It helps regulate\nthe Earth's climate by absorbing vast amounts of carbon dioxide and producing a significant portion of\nthe world's oxygen. This forest is home to millions of plant and animal species, many of  think fits best\nElectric cars have gained popularity in recent years due to concerns about air pollution and\nclimate change. These cars are powered by electricity rather than gasoline, making them more\nenvironmentally friendly. Electric cars have fewer moving parts than traditional gasoline-powered cars,\nwhich means they require less maintenance. They also produce no emissions, which helps reduce air\npollution. Many governments are now offering incentives to encourage people to buy electric cars, such\nas tax breaks and rebates. As technology improves, electric cars are becoming more affordable and\nefficient, and they are expected to become a major part of the global automobile market in the future.", "prompt": "What can be inferred from this passage?", "options": [{"label": "A", "text": "Electric cars are very expensive and hard to find."}, {"label": "B", "text": "Electric cars are becoming more affordable and efficient."}, {"label": "C", "text": "Electric cars are only used in some countries."}, {"label": "D", "text": "Electric cars are less popular than gasoline cars.\nGiải thích: Câu cuối cùng trong đoạn: “As technology improves, electric cars are becoming more\naffordable and efficient...” → Có thể suy ra rằng nhờ sự phát triển công nghệ, xe điện ngày càng hợp\ntúi tiền và hiệu quả."}], "answer": "D", "explanation": "Câu cuối cùng trong đoạn: “As technology improves, electric cars are becoming more\naffordable and efficient...” → Có thể suy ra rằng nhờ sự phát triển công nghệ, xe điện ngày càng hợp\ntúi tiền và hiệu quả.", "needs_review": false, "section": "reading-mcq", "section_label": "Đọc hiểu - Trắc nghiệm", "exam_label": "CPA 2024 - Đề Chẵn"}, {"id": "2024-chan-reading-mcq-5", "type": "mcq", "passage": "Read the passage carefully and choose ONE which you think fits best\nElectric cars have gained popularity in recent years due to concerns about air pollution and\nclimate change. These cars are powered by electricity rather than gasoline, making the rompt": "best / worked / the / as / team / together / the / team", "answer": "The team worked together as the best team.", "explanation": "– Cấu trúc: work together as… → làm việc cùng nhau như một…\n– Dịch: Nhóm đã làm việc cùng nhau như một đội xuất sắc nhất", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2024 - Đề Chẵn"}, {"id": "2024-chan-sentence-build-6", "type": "sentence_building", "prompt": "book / her / finished / reading / she", "answer": "She finished reading her book.", "explanation": "– Finish + V-ing → hoàn thành việc gì\n– Dịch: Cô ấy đã đọc xong cuốn sách của mình", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2024 - Đề Chẵn"}, {"id": "2024-chan-sentence-build-7", "type": "sentence_building", "prompt": "finished / we / restaurant / at / lunch / the", "answer": "We finished lunch at the restaurant.", "explanation": "– Dịch: Chúng tôi đã ăn xong bữa trưa ở nhà hàng", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2024 - Đề Chẵn"}, {"id": "2024-chan-sentence-build-8", "type": "sentence_building", "prompt": "hand / sister / birthday / the / wrapped / gift/ my / by", "answer": "The birthday gift was wrapped by my sister.", "explanation": "– Câu bị động: S + was/were + V3 + by + agent\n– Dịch: Món quà sinh nhật được chị tôi gói lại.", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2024 - Đề Chẵn"}, {"id": "2024-chan-sentence-build-9", "type": "sentence_building", "prompt": "train / arrived / early / the / station / the / at", "answer": "The train arrived early at the station.", "explanation": "– Trật tự đúng: S + V + adv + giới từ + nơi chốn\n– Dịch: Chuyến tàu đến ga sớm.", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2024 - Đề Chẵn"}, {"id": "2024-chan-sentence-build-10", "type": "sentence_building", "prompt": "to / rain / last / holiday / canceled / we / vacation / our / due / the", "answer": "We canceled our last holiday vacation due to the rain.", "explanation": "– Cấu trúc: due to + danh từ → bởi vì\n– Dịch: Chúng tôi đã hủy kỳ nghỉ lễ vừa rồi do trời mưa.", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2024 - Đề Chẵn"}, {"id": "2024-chan-transform-1", "type": "sentence_transformation", "prompt": "I regret not studying harder.", "answer": "I wish I had studied harder.", "explanation": "- Cấu trúc: I wish + S + had + V3 → dùng để diễn tả sự tiếc nuối về một hành động không xảy ra\ntrong quá khứ.\n- Dịch: Tôi ước gì mình đã học chăm hơn.", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2024 - Đề Chẵn"}, {"id": "2024-chan-transform-2", "type": "sentence_transformation", "prompt": "The weather was too bad for us to go out.", "answer": "The weather wasn't good enough for us to go out.", "explanation": "- Cấu trúc: too + adj + to V ⇄ not + adj + enough + to V\n- Dịch: Thời tiết không đủ tốt để chúng tôi ra ngoài.", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2024 - Đề Chẵn"}, {"id": "2024-chan-transform-3", "type": "sentence_transformation", "prompt": "He is so lazy that he never does any work.", "answer": "He is such a lazy person that he never does any work.", "explanation": "- Cấu trúc: so + adj + that... ⇄ such + (a/an) + adj + noun + that...\n- Dịch: Anh ta là một người lười đến mức chẳng bao giờ làm việc gì cả.", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2024 - Đề Chẵn"}, {"id": "2024-chan-transform-4", "type": "sentence_transformation", "prompt": "Jack will never get the job if he doesn't improve his resume.", "answer": "Unless Jack improves his resume, he will never get the job.", "explanation": "- Cấu trúc: Unless + S + V (hiện tại), S + will + V = If... not\n- Dịch: Trừ khi Jack cải thiện CV, anh ấy sẽ không bao giờ được nhận vào làm.", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2024 - Đề Chẵn"}, {"id": "2024-chan-transform-5", "type": "sentence_transformation", "prompt": "She didn't eat enough, so she felt weak.", "answer": "If she had eaten enough, she wouldn't have felt weak.", "explanation": "- Câu điều kiện loại 3: If + had + V3, would have + V3 → giả định trái với quá khứ.\n- Dịch: Nếu cô ấy ăn đủ, cô ấy đã không cảm thấy mệt.", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2024 - Đề Chẵn"}, {"id": "2024-chan-translate-en-vi-1", "type": "translation", "prompt": "Our main goal is to become a leading company in the industry.", "answer": "Mục tiêu chính của chúng tôi là trở thành một công ty hàng đầu trong ngành.", "explanation": "• to become a leading company = trở thành công ty hàng đầu", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2024 - Đề Chẵn"}, {"id": "2024-chan-translate-en-vi-2", "type": "translation", "prompt": "The company has invested heavily in research and development of new products.", "answer": "Công ty đã đầu tư mạnh vào nghiên cứu và phát triển các sản phẩm mới.", "explanation": "• invest heavily in... = đầu tư mạnh vào...", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2024 - Đề Chẵn"}, {"id": "2024-chan-translate-en-vi-3", "type": "translation", "prompt": "In addition to technical accounting and auditing skills, future auditors will need soft skills such as communication skills and adaptability to change.", "answer": "Bên cạnh các kỹ năng chuyên môn về kế toán và kiểm toán, các kiểm toán viên trong tương lai sẽ cần có kỹ năng mềm như kỹ năng giao tiếp và khả năng thích ứng với sự thay đổi.", "explanation": "• adaptability to change = khả năng thích nghi với sự thay đổi", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2024 - Đề Chẵn"}, {"id": "2024-chan-translate-en-vi-4", "type": "translation", "prompt": "The audit team must assess whether the internal controls of the company are sufficient to ensure accurate financial reporting.", "answer": "Nhóm kiểm toán phải đánh giá liệu hệ thống kiểm soát nội bộ của công ty có đủ để đảm bảo tính chính xác của báo cáo tài chính hay không.", "explanation": "• assess whether... = đánh giá liệu rằng...\n• sufficient to do sth = đủ để làm gì đó", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2024 - Đề Chẵn"}, {"id": "2024-chan-translate-en-vi-5", "type": "translation", "prompt": "The auditor must evaluate whether the financial statements reflect the true financial position of the company.", "answer": "Kiểm toán viên phải đánh giá liệu báo cáo tài chính có phản ánh đúng tình hình tài chính thực tế của công ty hay không.", "explanation": "• reflect the true financial position = phản ánh đúng tình hình tài chính thực tế", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2024 - Đề Chẵn"}, {"id": "2024-chan-translate-vi-en-1", "type": "translation", "prompt": "Chúng ta cần phải thích ứng với những thay đổi của thị trường.", "answer": "We need to adapt to the changes in the market.", "explanation": "• adapt to sth = thích ứng với điều gi", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2024 - Đề Chẵn"}, {"id": "2024-chan-translate-vi-en-2", "type": "translation", "prompt": "Chúng tôi cần phải cải thiện dịch vụ khách hàng của mình.", "answer": "We need to improve our customer service.", "explanation": "", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2024 - Đề Chẵn"}, {"id": "2024-chan-translate-vi-en-3", "type": "translation", "prompt": "Kiểm toán viên thực hiện các cuộc kiểm toán để xác minh rằng các báo cáo tài chính của công ty tuân thủ các nguyên tắc kế toán và các quy định pháp luật.", "answer": "Auditors conduct audits to verify that the company’s financial statements comply with accounting principles and legal regulations.", "explanation": "• verify that... = xác minh rằng...\n• comply with = tuân thủ", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2024 - Đề Chẵn"}, {"id": "2024-chan-translate-vi-en-4", "type": "translation", "prompt": "Việc kiểm toán giúp phát hiện và ngăn chặn các sai sót, gian lận và rủi ro tài chính.", "answer": "Auditing helps detect and prevent errors, fraud, and financial risks.", "explanation": "", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2024 - Đề Chẵn"}, {"id": "2024-chan-translate-vi-en-5", "type": "translation", "prompt": "Các kiểm toán viên thường phải đối mặt với nhiều thách thức như áp lực thời gian, rủi ro gian lận, và sự phát triển nhanh chóng của công nghệ.", "answer": "Auditors often face various challenges such as time pressure, fraud risks, and rapid development of technology.", "explanation": "", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2024 - Đề Chẵn"}]}, {"year": "2024", "version": "le", "items": [{"id": "2024-le-vocab-1", "type": "fill_blank", "prompt": "The restaurant offers a wide ........................ of dishes, from Italian to Thai cuisine.", "answer": "CHOICE", "explanation": "(Nhà hàng cung cấp nhiều món ăn khác nhau, từ ẩm thực Ý đến Thái)\n• to offer a wide choice (of something) = cung cấp nhiều sự lựa chọn (về...)", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-vocab-2", "type": "fill_blank", "prompt": "The museum has an amazing ........................ of ancient artifacts.", "answer": "COLLECTION", "explanation": "(Bảo tàng có một bộ sưu tập đáng kinh ngạc các hiện vật cổ)\n• a collection of something = bộ sưu tập về cái gì", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-vocab-3", "type": "fill_blank", "prompt": "Rather ........................ studying, Jane spent her time watching TV.", "answer": "THAN", "explanation": "(Thay vì học, Jane dành thời gian xem TV.)\n• rather than (doing something) = thay vì làm gì", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-vocab-4", "type": "fill_blank", "prompt": "The development of the new software was quite ........................ .", "answer": "CHALLENGING", "explanation": "(Việc phát triển phần mềm mới tương đối nhiều thử thách.)\nchallenging = mang tính thử thách", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-vocab-5", "type": "fill_blank", "prompt": "Their ........................ behavior at the party surprised everyone.", "answer": "CHILDISH", "explanation": "(Hành vi trẻ con của họ ở bữa tiệc khiến mọi người ngạc nhiên.)\nchildish behavior = hành vi ấu trĩ/trẻ con", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-vocab-6", "type": "fill_blank", "prompt": "The frog's natural camouflage allowed it to ........................ from view when predators were\nnear.", "answer": "DISAPPEAR", "explanation": "near.\n(Lớp ngụy trang tự nhiên giúp con ếch biến mất khỏi tầm nhìn khi có kẻ săn mồi đến gần.)\nto disappear from view = biến mất khỏi tầm nhìn", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-vocab-7", "type": "fill_blank", "prompt": "The tumor was ........................ successfully.", "answer": "REMOVED", "explanation": "(Khối u đã được loại bỏ thành công.)\nto be removed = được loại bỏ", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-vocab-8", "type": "fill_blank", "prompt": "His ........................ seemed furtive as they entered the store, but then she remembered their\nupcoming anniversary and the situation became almost predictable.", "answer": "BEHAVIOR", "explanation": "upcoming anniversary and the situation became almost predictable.\n(Hành vi của anh ấy có vẻ lén lút khi họ bước vào cửa hàng, nhưng rồi cô nhớ ra sắp đến\nngày kỷ niệm của họ và mọi chuyện trở nên dễ hiểu.)\nfurtive behavior = hành vi lén lút", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-vocab-9", "type": "fill_blank", "prompt": "The shirt has blue and white ........................ .", "answer": "STRIPES", "explanation": "(Chiếc áo có sọc xanh và trắng.)\nto have stripes = có họa tiết sọc", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-vocab-10", "type": "fill_blank", "prompt": "........................ in anticipation, she waited for the results of the exam.", "answer": "FROZEN", "explanation": "(Cô ấy đứng bất động vì hồi hộp khi chờ kết quả kỳ thi.)\n• to be frozen (in anticipation/fear) = đứng bất động vì hồi hộp/sợ hãi", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-vocab-11", "type": "fill_blank", "prompt": "The scientist was known for his groundbreaking ........................ in the field of genetics.", "answer": "TALENT", "explanation": "(Nhà khoa học được biết đến với tài năng đột phá trong lĩnh vực di truyền học.)\n• groundbreaking talent (in something) = tài năng đột phá trong lĩnh vực...", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-vocab-12", "type": "fill_blank", "prompt": "The new office layout was part of a larger ........................ to increase productivity.", "answer": "REORGANIZATION", "explanation": "(Cách bố trí văn phòng mới là một phần trong cuộc tái cơ cấu lớn hơn nhằm tăng năng suất.)\n• a reorganization (to do something) = sự tái tổ chức để đạt được điều gì đó", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-vocab-13", "type": "fill_blank", "prompt": "It is important to follow the doctor's advice to avoid an ........................ after surgery.", "answer": "INFECTION", "explanation": "(Điều quan trọng là làm theo lời khuyên của bác sĩ để tránh nhiễm trùng sau phẫu thuật.)\n• to avoid an infection = tránh bị nhiễm trùng", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-vocab-14", "type": "fill_blank", "prompt": "It was a strange ........................ that we met at the same time.", "answer": "COINCIDENCE", "explanation": "(Thật là một sự trùng hợp kỳ lạ khi chúng tôi gặp nhau cùng lúc.)\n• a strange coincidence = một sự trùng hợp lạ lùng", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-vocab-15", "type": "fill_blank", "prompt": "The ........................ lost all his money.\nPage 5 of 6", "answer": "GAMBLER", "explanation": "(Người đánh bạc đã mất hết tiền.)\n• gambler = người đánh bạc", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-reading-open-1", "type": "open_short_answer", "passage": "Read the passage and answer the questions\nClimate change is a global issue that has significant impacts on the Earth's environment.\nRising global temperatures are causing sea levels to rise, leading to coastal erosion and\nflooding. Extreme weather events, such as hurricanes, droughts, and heatwaves, are becoming\nmore frequent and intense. Ecosystems are being disrupted, leading to biodiversity loss and\nhabitat destruction. Human activities, such as the burning of fossil fuels, are the primary drivers\nof climate change. To mitigate the effects of climate change, it is essential to reduce greenhouse\ngas emissions by transitioning to cleaner energy sources.", "prompt": "What is this passage mainly about?", "answer": "It is mainly about the causes, effects, and solutions to climate change. (Đoạn văn trình bày tổng quan về nguyên nhân, hậu quả và giải pháp của biến đổi khí hậu) Thông tin câu: (1), (2), (3), (5), (6)", "explanation": "", "needs_review": false, "section": "reading-open", "section_label": "Đọc hiểu - Trả lời câu hỏi", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-reading-open-2", "type": "open_short_answer", "passage": "Read the passage and answer the questions\nClimate change is a global issue that has significant impacts on the Earth's environment.\nRising global temperatures are causing sea levels to rise, leading to coastal erosion and\nflooding. Extreme weather events, such as hurricanes, droughts, and heatwaves, are becoming\nmore frequent and intense. Ecosystems are being disrupted, leading to biodiversity loss and\nhabitat destruction. Human activities, such as the burning of fossil fuels, are the primary drivers\nof climate change. To mitigate the effects of climate change, it is essential to reduce greenhouse\ngas emissions by transitioning to cleaner energy sources.", "prompt": "What is the primary cause of climate change?", "answer": "The primary cause is human activities, such as the burning of fossil fuels. (Nguyên nhân chính là các hoạt động của con người, như việc đốt nhiên liệu hóa thạch) Thông tin câu (5)", "explanation": "", "needs_review": false, "section": "reading-open", "section_label": "Đọc hiểu - Trả lời câu hỏi", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-reading-open-3", "type": "open_short_answer", "passage": "Read the passage and answer the questions\nClimate change is a global issue that has significant impacts on the Earth's environment.\nRising global temperatures are causing sea levels to rise, leading to coastal erosion and\nflooding. Extreme weather events, such as hurricanes, droughts, and heatwaves, are becoming\nmore frequent and intense. Ecosystems are being disrupted, leading to biodiversity loss and\nhabitat destruction. Human activities, such as the burning of fossil fuels, are the primary drivers\nof climate change. To mitigate the effects of climate change, it is essential to reduce greenhouse\ngas emissions by transitioning to cleaner energy sources.", "prompt": "What are some of the effects of climate change?", "answer": "Sea level rise, coastal erosion, flooding, extreme weather events, biodiversity loss, and habitat destruction. (Mực nước biển dâng, xói mòn bờ biển, lũ lụt, thời tiết cực đoan, suy giảm đa dạng sinh học và phá hủy môi trường sống.) Thông tin câu (2), (3), (4)", "explanation": "", "needs_review": false, "section": "reading-open", "section_label": "Đọc hiểu - Trả lời câu hỏi", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-reading-open-4", "type": "open_short_answer", "passage": "Read the passage and answer the questions\nClimate change is a global issue that has significant impacts on the Earth's environment.\nRising global temperatures are causing sea levels to rise, leading to coastal erosion and\nflooding. Extreme weather events, such as hurricanes, droughts, and heatwaves, are becoming\nmore frequent and intense. Ecosystems are being disrupted, leading to biodiversity loss and\nhabitat destruction. Human activities, such as the burning of fossil fuels, are the primary drivers\nof climate change. To mitigate the effects of climate change, it is essential to reduce greenhouse\ngas emissions by transitioning to cleaner energy sources.", "prompt": "Is it true to say that climate change is caused solely by natural factors?", "answer": "No, it is not true. Human activities are the main cause of climate change. (Không, điều đó không đúng. Hoạt động của con người là nguyên nhân chính gây ra biến đổi khí hậu.) Thông tin câu (5)", "explanation": "", "needs_review": false, "section": "reading-open", "section_label": "Đọc hiểu - Trả lời câu hỏi", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-reading-open-5", "type": "open_short_answer", "passage": "Read the passage and answer the questions\nClimate change is a global issue that has significant impacts on the Earth's environment.\nRising global temperatures are causing sea levels to rise, leading to coastal erosion and\nflooding. Extreme weather events, such as hurricanes, droughts, and heatwaves, are becoming\nmore frequent and intense. Ecosystems are being disrupted, leading to biodiversity loss and\nhabitat destruction. Human activities, such as the burning of fossil fuels, are the primary drivers\nof climate change. To mitigate the effects of climate change, it is essential to reduce greenhouse\ngas emissions by transitioning to cleaner energy sources.", "prompt": "What is a potential solution to climate change?", "answer": "To reduce greenhouse gas emissions by transitioning to cleaner energy sources. (Giải pháp là giảm khí thải nhà kính bằng cách chuyển sang sử dụng các nguồn năng lượng sạch hơn.) Thông tin câu (6)", "explanation": "", "needs_review": false, "section": "reading-open", "section_label": "Đọc hiểu - Trả lời câu hỏi", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-reading-mcq-1", "type": "mcq", "passage": "Read the passage carefully and choose ONE which you think fits best\nThe concept of timekeeping has evolved significantly over the centuries. Ancient civilizations,\nsuch as the Egyptians and Sumerians, used basic methods to measure time, like the sundial and\nwater clocks. The ancient Egyptians were the first to divide the day into 24 hours, using their\nobservation of the sun's position. By the 14th century, mechanical clocks were invented in\nEurope, which marked a major advancement in timekeeping. These clocks helped to organize\ndaily life and were essential for navigation at sea. Today, digital clocks and atomic clocks\nprovide incredibly accurate measurements of time. Despite technological advancements, the\nneed for timekeeping has remained essential to human society.", "prompt": "What is this passage mainly about?", "options": [{"label": "A", "text": "The history of timekeeping"}, {"label": "B", "text": "The invention of mechanical clocks"}, {"label": "C", "text": "How the sundial works"}, {"label": "D", "text": "The importance of navigation\nGiải thích: Đoạn văn bắt đầu từ thời cổ đại (đồng hồ mặt trời, đồng hồ nước) → đến thế kỷ 14\n(đồng hồ cơ) → đến hiện đại"}], "answer": "D", "explanation": "Đoạn văn bắt đầu từ thời cổ đại (đồng hồ mặt trời, đồng hồ nước) → đến thế kỷ 14\n(đồng hồ cơ) → đến hiện đại (đồng hồ kỹ thuật số)", "needs_review": false, "section": "reading-mcq", "section_label": "Đọc hiểu - Trắc nghiệm", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-reading-mcq-2", "type": "mcq", "passage": "Read the passage carefully and choose ONE which you think fits best\nThe concept of timekeeping has evolved significantly over the centuries. Ancient civilizations,\nsuch as the Egyptians and Sumerians, used basic methods to measure time, like the sundial and\nwater clocks. The ancient Egyptians were the first to divide the day into 24 hours, using their\nobservation of the sun's position. By the 14th century, mechanical clocks were invented in\nEurope, which marked a major advancement in timekeeping. These clocks helped to organize\ndaily life and were essential for navigation at sea. Today, digital clocks and atomic clocks\nprovide incredibly accurate measurements of time. Despite technological advancements, the\nneed for timekeeping has remained essential to human society.", "prompt": "Which ancient civilization first divided the day into 24 hours?", "options": [{"label": "A", "text": "Sumerians"}, {"label": "B", "text": "Egyptians"}, {"label": "C", "text": "Romans"}, {"label": "D", "text": "Greeks\nGiải thích: Đoạn văn nói rõ: “The ancient Egyptians were the first to divide the day into 24\nhours."}], "answer": "D", "explanation": "Đoạn văn nói rõ: “The ancient Egyptians were the first to divide the day into 24\nhours. (Người Ai Cập cổ đại là người đầu tiên chia 1 ngày thành 24 giờ)", "needs_review": false, "section": "reading-mcq", "section_label": "Đọc hiểu - Trắc nghiệm", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-reading-mcq-3", "type": "mcq", "passage": "Read the passage carefully and choose ONE which you think fits best\nThe concept of timekeeping has evolved significantly over the centuries. Ancient civilizations,\nsuch as the Egyptians and Sumerians, used basic methods to measure time, like the sundial and\nwater clocks. The ancient Egyptians were the first to divide the day into 24 hours, using their\nobservation of the sun's position. By the 14th century, mechanical clocks were invented in\nEurope, which marked a major advancement in timekeeping. These clocks helped to organize\ndaily life and were essential for navigation at sea. Today, digital clocks and atomic clocks\nprovide incredibly accurate measurements of time. Despite technological advancements, the\nneed for timekeeping has remained essential to human society.", "prompt": "What was a major advancement in timekeeping during the 14th century?", "options": [{"label": "A", "text": "Water clocks"}, {"label": "B", "text": "Sundials"}, {"label": "C", "text": "Mechanical clocks"}, {"label": "D", "text": "Atomic clocks\nGiải thích: “By the 14th century, mechanical clocks were invented...” (Thế kỷ 14 là thời điểm\nđồng hồ cơ được phát minh) → là bước tiến quan trọng."}], "answer": "D", "explanation": "“By the 14th century, mechanical clocks were invented...” (Thế kỷ 14 là thời điểm\nđồng hồ cơ được phát minh) → là bước tiến quan trọng.", "needs_review": false, "section": "reading-mcq", "section_label": "Đọc hiểu - Trắc nghiệm", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-reading-mcq-4", "type": "mcq", "passage": "Read the passage carefully and choose ONE which you think fits best\nThe concept of timekeeping has evolved significantly over the centuries. Ancient civilizations,\nsuch as the Egyptians and Sumerians, used basic methods to measure time, like the sundial and\nwater clocks. The ancient Egyptians were the first to divide the day into 24 hours, using their\nobservation of the sun's position. By the 14th century, mechanical clocks were invented in\nEurope, which marked a major advancement in timekeeping. These clocks helped to organize\ndaily life and were essential for navigation at sea. Today, digital clocks and atomic clocks\nprovide incredibly accurate measurements of time. Despite technological advancements, the\nneed for timekeeping has remained essential to human society.", "prompt": "What can be inferred from this passage?", "options": [{"label": "A", "text": "People no longer need timekeeping tools."}, {"label": "B", "text": "Timekeeping has always been important for society."}, {"label": "C", "text": "Timekeeping started with digital clocks."}, {"label": "D", "text": "Timekeeping has only been used for navigation.\nGiải thích: Cả đoạn cho thấy: đo thời gian xuất hiện từ rất sớm, phục vụ cho tổ chức cuộc\nsống, đi biển, sản xuất,... và đến nay vẫn rất quan trọng."}], "answer": "D", "explanation": "Cả đoạn cho thấy: đo thời gian xuất hiện từ rất sớm, phục vụ cho tổ chức cuộc\nsống, đi biển, sản xuất,... và đến nay vẫn rất quan trọng.", "needs_review": false, "section": "reading-mcq", "section_label": "Đọc hiểu - Trắc nghiệm", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-reading-mcq-5", "type": "mcq", "passage": "Read the passage carefully and choose ONE which you think fits best\nThe concept of timekeeping has evolved significantly over the centuries. Ancient civilizations,\nsuch as the Egyptians and Sumerians, used basic methods to measure time, like the sundial and\nwater clocks. The ancient Egyptians were the first to divide the day into 24 hours, using their\nobservation of the sun's position. By the 14th century, mechanical clocks were invented in\nEurope, which marked a major advancement in timekeeping. These clocks helped to organize\ndaily life and were essential for navigation at sea. Today, digital clocks and atomic clocks\nprovide incredibly accurate measurements of time. Despite technological advancements, the\nneed for timekeeping has remained essential to human society.", "prompt": "Which can replace the word \"evolved\" in the paragraph?", "options": [{"label": "A", "text": "developed"}, {"label": "B", "text": "disappeared"}, {"label": "C", "text": "ignored"}, {"label": "D", "text": "stayed\nGiải thích: The concept of timekeeping has evolved significantly over the centuries.”"}], "answer": "D", "explanation": "The concept of timekeeping has evolved significantly over the centuries.” (Khái\nniệm đo thời gian đã thay đổi/tiến hóa/ phát triển rõ rệt qua các thế kỷ)", "needs_review": false, "section": "reading-mcq", "section_label": "Đọc hiểu - Trắc nghiệm", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-cloze-1", "type": "cloze", "passage": "Read the passage below and think of ONE word which best fits each space.\nThere is an example at the beginning (0).\nMany people think (0) ....that...... getting a good job depends on having a (1) _____ degree.\nHowever, (2) _____ people have found that experience is just as important. If you are good at\n(3 ooking for (6) _____ who can perform in real-world situations. In the future, it's likely that\ncompanies will focus more on (7) _____ skills and personal traits, (8) _____ as communication,\nproblem-solving, and the ability to work in a team. Having a degree may still help, but it's not\nthe only (9) _____ to success. In the end, your experience can (10) _____", "gap_number": 9, "answer": "path", "explanation": "path to success – đường dẫn đến thành công", "needs_review": false, "section": "cloze", "section_label": "Điền từ vào đoạn văn", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-cloze-10", "type": "cloze", "passage": "Read the passage below and think of ONE word which best fits each space.\nThere is an example at the beginning (0).\nMany people think (0) ....that...... getting a good job depends on having a (1) _____ degree.\nHowever, (2) _____ people have found that experience is just as important. If you are good at\n(3) _____ you do, your work will speak for itself. In some cases, having a portfolio can be (4) _____ important than a university degree. This is particularly true in areas like technology,\nwhere (5) _____ skills and hands-on knowledge are highly valued. Employers are often\nlooking for (6) _____ who can perform in real-world situations. In the future, it's likely that\ncompanies will focus more on (7) _____ skills and personal traits, (8) _____ as communication,\nproblem-solving, and the ability to work in a team. Having a degree may still help, but it's not\nthe only (9) _____ to success. In the end, your experience can (10) _____", "gap_number": 10, "answer": "make", "explanation": "make all the difference – tạo nên sự khác biệt lớn", "needs_review": false, "section": "cloze", "section_label": "Điền từ vào đoạn văn", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-wordform-1", "type": "fill_blank", "prompt": "She passed the test with excellent ....................... . (PREPARE)", "answer": "preparation (PREPARE)", "explanation": "Prepare ((v): Chuẩn bị\nPreparation (n) sự chuẩn bị\nDịch: Cô ấy đã vượt qua bài kiểm tra với sự chuẩn bị xuất sắc.", "needs_review": false, "section": "wordform", "section_label": "Từ loại (Word Formation)", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-wordform-2", "type": "fill_blank", "prompt": "The team showed great ....................... during the championship match. (DETERMINE)", "answer": "determination", "explanation": "Determine (v): quyết tâm, xác định\nDetermination (n): sự quyết tâm\nDịch: Đội đã thể hiện quyết tâm lớn trong trận chung kết.", "needs_review": false, "section": "wordform", "section_label": "Từ loại (Word Formation)", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-wordform-3", "type": "fill_blank", "prompt": "His ....................... attitude made him very popular at work. (FRIEND)", "answer": "friendly", "explanation": "Friend (n): bạn bè\nFriendly (adj) thân thiện\nDịch: Thái độ thân thiện của anh ấy khiến anh rất được yêu quý ở nơi làm việc", "needs_review": false, "section": "wordform", "section_label": "Từ loại (Word Formation)", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-wordform-4", "type": "fill_blank", "prompt": "We need to work on improving our customer ....................... . (SATISFY)", "answer": "satisfaction", "explanation": "Satisfy (v): làm hài lòng\nSatisfaction (n): sự hài lòng\nDịch: Chúng ta cần làm việc để cải thiện sự hài lòng của khách hàng", "needs_review": false, "section": "wordform", "section_label": "Từ loại (Word Formation)", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-wordform-5", "type": "fill_blank", "prompt": "Due to technical difficulties, the internet connection became………….. . (CONNECT)\nPage 5 of 6", "answer": "disconnected", "explanation": "Connect (v): kết nối\nDisconnected (adj): bị ngắt kết nối\nDịch: Do sự cố kỹ thuật, kết nối Internet đã bị ngắt.", "needs_review": false, "section": "wordform", "section_label": "Từ loại (Word Formation)", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-sentence-build-1", "type": "sentence_building", "prompt": "always / solving / a / very / problems / he / creative / approach / has / to", "answer": "He always has a very creative approach to solving problems.", "explanation": "– Cấu trúc: have an approach to + V-ing → có cách tiếp cận để làm gì đó\n– Dịch: Anh ấy luôn có cách tiếp cận rất sáng tạo để giải quyết vấn đề.", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-sentence-build-2", "type": "sentence_building", "prompt": "company / new / employees / the / meeting / for / held / the / a / meeting", "answer": "The company held a meeting for the new employees.", "explanation": "– Cấu trúc: hold a meeting → tổ chức cuộc họp\n– Dịch: Công ty đã tổ chức một cuộc họp cho các nhân viên mới.", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-sentence-build-3", "type": "sentence_building", "prompt": "the / moved / to / the / took / job / he / new / office / and", "answer": "He took the new job and moved to the office.", "explanation": "– Cấu trúc: take a job → nhận việc; move to → chuyển đến\n– Dịch: Anh ấy đã nhận công việc mới và chuyển đến văn phòng.", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-sentence-build-4", "type": "sentence_building", "prompt": "weather / very / unusual / this / is / year / the", "answer": "The weather this year is very unusual.", "explanation": "– Từ vựng: unusual → bất thường\n– Dịch: Thời tiết năm nay rất bất thường", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-sentence-build-5", "type": "sentence_building", "prompt": "increased / has / sales / significantly / the / company / this / year", "answer": "The company has significantly increased sales this year.", "explanation": "– Trạng từ: significantly → đáng kể\n– Dịch: Công ty đã tăng doanh số đáng kể trong năm nay.", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-sentence-build-6", "type": "sentence_building", "prompt": "he / his / very / looks / father / much / like", "answer": "He looks very much like his father.", "explanation": "– Cấu trúc: look like someone → trông giống ai đó\n– Dịch: Anh ấy trông rất giống bố mình.", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-sentence-build-7", "type": "sentence_building", "prompt": "working / has / been / she / hard / lately", "answer": "She has been working hard lately.", "explanation": "– Dịch: Gần đây cô ấy đã làm việc rất chăm chỉ.", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-sentence-build-8", "type": "sentence_building", "prompt": "finished / he / the / yet / report / hasn't", "answer": "He hasn't finished the report yet.", "explanation": "– Trạng từ: yet → dùng trong câu phủ định ở thì hiện tại hoàn thành\n– Dịch: Anh ấy vẫn chưa hoàn thành bản báo cáo.", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-sentence-build-9", "type": "sentence_building", "prompt": "is / good / usually / manager / a / team / at / working / good / a / with", "answer": "A good manager is usually good at working with a team.", "explanation": "– Cấu trúc: be good at + V-ing → giỏi việc gì\n– Dịch: Một nhà quản lý giỏi thường giỏi làm việc nhóm.", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-sentence-build-10", "type": "sentence_building", "prompt": "in / many / believe / luck / people", "answer": "Many people believe in luck.", "explanation": "– Cấu trúc: believe in + danh từ → tin vào điều gì\n– Dịch: Nhiều người tin vào may mắn", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-transform-1", "type": "sentence_transformation", "prompt": "\"I'll help you with your homework.\"", "answer": "Tom offers to help me with my homework.", "explanation": "- Cấu trúc: offer to V = ngỏ ý giúp làm việc gì\n- Dịch: Tom ngỏ ý giúp tôi làm bài tập về nhà.", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-transform-2", "type": "sentence_transformation", "prompt": "It's a ten-minute walk to the nearest shop.", "answer": "It takes ten minutes to walk to the nearest shop.", "explanation": "- Cấu trúc: It takes + time + to V = mất bao lâu để làm gì\n- Dịch: Mất 10 phút đi bộ đến cửa hàng gần nhất.", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-transform-3", "type": "sentence_transformation", "prompt": "The storm was so strong that we couldn't go sailing.", "answer": "The storm was too strong for us to go sailing.", "explanation": "- Cấu trúc: so + adj + that S + V ⇄ too + adj + for sb + to V\n- Dịch: Cơn bão quá mạnh khiến chúng tôi không thể đi chèo thuyền.", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-transform-4", "type": "sentence_transformation", "prompt": "If David doesn't stop smoking, he will harm his health.", "answer": "Unless David stops smoking, he will harm his health.", "explanation": "- Cấu trúc: Unless + S + V (hiện tại), S + will + V = trừ khi\n- Dịch: Trừ khi David bỏ thuốc, anh ấy sẽ làm hại sức khỏe của mình.", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-transform-5", "type": "sentence_transformation", "prompt": "It's a pity she didn't accept the job.", "answer": "I wish she had accepted the job.", "explanation": "- Cấu trúc: I wish + S + had + V3 = diễn tả tiếc nuối về điều đã không xảy ra trong quá\nkhứ\n- Dịch: Tôi ước gì cô ấy đã nhận công việc đó.", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-translate-en-vi-1", "type": "translation", "prompt": "Companies need to have an audit report on a regular basis.", "answer": "Dịch: Các công ty cần có báo cáo kiểm toán định kỳ.", "explanation": "• on a regular basis = thường xuyên, định kỳ → đồng nghĩa: regularly\n• audit report = báo cáo kiểm toán", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-translate-en-vi-2", "type": "translation", "prompt": "An Italian was very puzzled at Americans' use of the phrase \"Oh, really?\" in group conversations.", "answer": "Dịch: Một người Ý đã rất bối rối trước cách người Mỹ sử dụng cụm từ “Ồ, thật sao?” trong các cuộc trò chuyện nhóm.", "explanation": "• be puzzled at/by = bối rối, ngạc nhiên bởi điều gì đó", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-translate-en-vi-3", "type": "translation", "prompt": "The auditor must evaluate whether the financial statements reflect the true financial position of the company.", "answer": "Dịch: Kiểm toán viên phải đánh giá liệu báo cáo tài chính có phản ánh đúng tình hình tài chính thực tế của công ty hay không.", "explanation": "• reflect the true financial position = phản ánh đúng tình hình tài chính thực tế", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-translate-en-vi-4", "type": "translation", "prompt": "Auditors are required to assess the accuracy and completeness of the company's financial disclosures.", "answer": "Dịch: Kiểm toán viên được yêu cầu đánh giá độ chính xác và đầy đủ của các thông tin tài chính được công bố của công ty.", "explanation": "• be required to + V = được yêu cầu làm gì", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-translate-en-vi-5", "type": "translation", "prompt": "It is necessary for companies to disclose any potential risks that may affect their financial performance.", "answer": "Dịch: Các công ty cần thiết phải công bố bất kỳ rủi ro tiềm tàng nào có thể ảnh hưởng đến kết quả hoạt động tài chính của mình.", "explanation": "• It is necessary for sb to do sth = ai đó cần thiết phải làm gì", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-translate-vi-en-1", "type": "translation", "prompt": "Chúng ta cần phải cắt giảm chi phí để tăng lợi nhuận.", "answer": "We need to cut costs in order to increase profits.", "explanation": "• in order to + V = để làm gì", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-translate-vi-en-2", "type": "translation", "prompt": "Chúng tôi sẽ tăng cường hợp tác với các đối tác chiến lược.", "answer": "We will strengthen cooperation with strategic partners.", "explanation": "• strategic partners = các đối tác chiến lược", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-translate-vi-en-3", "type": "translation", "prompt": "Để trở thành một kiểm toán viên, thông thường bạn cần có bằng cấp về kế toán hoặc tài chính.", "answer": "To become an auditor, you typically need a degree in accounting or finance.", "explanation": "• to become + nghề nghiệp = để trở thành\n• a degree in + chuyên ngành = bằng cấp về lĩnh vực gì", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-translate-vi-en-4", "type": "translation", "prompt": "Công nghệ đang thay đổi cách thức làm việc của kiểm toán viên.", "answer": "Technology is changing the way auditors work.", "explanation": "• be changing = thì hiện tại tiếp diễn → đang thay đổi\n• the way + S + V = cách mà ai đó làm gì", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2024 - Đề Lẻ"}, {"id": "2024-le-translate-vi-en-5", "type": "translation", "prompt": "Các kiểm toán viên thường thực hiện các công việc như kiểm tra sổ sách kế toán, đánh giá hệ thống kiểm soát nội bộ, và đưa ra ý kiến chuyên môn về báo cáo tài chính.", "answer": "Auditors often perform tasks such as reviewing accounting records, assessing internal control systems, and providing professional opinions on financial statements.", "explanation": "• perform tasks = thực hiện công việc\n• review accounting records = kiểm tra sổ sách kế toán\n• assess internal control systems = đánh giá hệ thống kiểm soát nội bộ\nprovide professional opinions on... = đưa ra ý kiến chuyên môn về...", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2024 - Đề Lẻ"}]}, {"year": "2025", "version": "chan", "items": [{"id": "2025-chan-vocab-1", "type": "fill_blank", "prompt": "She is ___________ the marketing team and manages three assistants.", "answer": "in charge of", "explanation": "(Cô ấy phụ trách nhóm marketing và quản lý ba trợ lý.)\n- in charge of = phụ trách, chịu trách nhiệm về việc gì", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2025 - Đề Chẵn"}, {"id": "2025-chan-vocab-2", "type": "fill_blank", "prompt": "He didn't come to work yesterday ___________ he was sick.", "answer": "because", "explanation": "(Anh ấy đã không đi làm hôm qua vì bị ốm.)\n- because + mệnh đề = bởi vì (dùng trước một mệnh đề đầy đủ chủ ngữ - động từ)", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2025 - Đề Chẵn"}, {"id": "2025-chan-vocab-3", "type": "fill_blank", "prompt": "We must ___________ the customer's complaint carefully.", "answer": "deal with", "explanation": "(Chúng ta phải xử lý khiếu nại của khách hàng một cách cẩn thận.)\n- deal with = xử lý, giải quyết vấn đề gì", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2025 - Đề Chẵn"}, {"id": "2025-chan-vocab-4", "type": "fill_blank", "prompt": "The manager asked everyone to ___________ new ideas for the campaign.", "answer": "come up with", "explanation": "(Người quản lý yêu cầu mọi người đưa ra ý tưởng mới cho chiến dịch.)\n- come up with = nghĩ ra, đề xuất (ý tưởng, giải pháp)", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2025 - Đề Chẵn"}, {"id": "2025-chan-vocab-5", "type": "fill_blank", "prompt": "You should always ___________ that your report is clear before submitting it.", "answer": "make sure", "explanation": "(Bạn nên luôn đảm bảo rằng báo cáo của mình rõ ràng trước khi nộp.)\n- make sure that... = đảm bảo rằng...", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2025 - Đề Chẵn"}, {"id": "2025-chan-vocab-6", "type": "fill_blank", "prompt": "She's very ___________ at organizing her time.", "answer": "efficient", "explanation": "(Cô ấy sắp xếp thời gian của mình rất hiệu quả)\n- efficient (adj) = hiệu quả, làm việc có năng suất", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2025 - Đề Chẵn"}, {"id": "2025-chan-vocab-7", "type": "fill_blank", "prompt": "___________ the heavy rain, the concert was canceled.", "answer": "Due to", "explanation": "(Do trời mưa to, buổi hòa nhạc đã bị hủy.)\n- due to + danh từ = do, bởi vì (dùng trước cụm danh từ)", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2025 - Đề Chẵn"}, {"id": "2025-chan-vocab-8", "type": "fill_blank", "prompt": "He was too busy, so his assistant attended the meeting ___________.", "answer": "instead", "explanation": "(Anh ấy quá bận nên trợ lý của anh ấy đã tham dự cuộc họp thay thế.)\n- instead = thay vào đó, thay thế", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2025 - Đề Chẵn"}, {"id": "2025-chan-vocab-9", "type": "fill_blank", "prompt": "You should sleep for ___________ seven hours every night to stay healthy.", "answer": "at least", "explanation": "(Bạn nên ngủ ít nhất bảy tiếng mỗi đêm để giữ sức khỏe.)\n- at least = ít nhất", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2025 - Đề Chẵn"}, {"id": "2025-chan-vocab-10", "type": "fill_blank", "prompt": "The teacher gave us an ___________ to present our projects in class.", "answer": "opportunity", "explanation": "(Giáo viên đã cho chúng tôi cơ hội thuyết trình dự án trước lớp.)\n- opportunity (n) = cơ hội", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2025 - Đề Chẵn"}, {"id": "2025-chan-vocab-11", "type": "fill_blank", "prompt": "They arrived exactly ___________, not a minute late.", "answer": "on time", "explanation": "(Họ đến đúng giờ, không trễ một phút nào.)\n- on time = đúng giờ", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2025 - Đề Chẵn"}, {"id": "2025-chan-vocab-12", "type": "fill_blank", "prompt": "He doesn't ___________ his boss very well because they have different opinions.", "answer": "get along with", "explanation": "(Anh ấy không hòa hợp lắm với sếp vì họ có những quan điểm khác nhau.)\n- get along with somebody = hòa hợp, hòa thuận với ai", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2025 - Đề Chẵn"}, {"id": "2025-chan-vocab-13", "type": "fill_blank", "prompt": "The team is working hard to ___________ their performance this year.", "answer": "improve", "explanation": "(Đội ngũ đang làm việc chăm chỉ để cải thiện hiệu suất trong năm nay.)\n- improve (v) = cải thiện, nâng cao", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2025 - Đề Chẵn"}, {"id": "2025-chan-vocab-14", "type": "fill_blank", "prompt": "Everyone needs to ___________ their pets carefully.", "answer": "look after", "explanation": "(Mọi người cần chăm sóc thú cưng của mình cẩn thận.)\n- look after = chăm sóc, trông nom", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2025 - Đề Chẵn"}, {"id": "2025-chan-vocab-15", "type": "fill_blank", "prompt": "I'm ___________ doing the same routine every day; I need a change.", "answer": "tired of", "explanation": "(Tôi đã chán làm những việc lặp đi lặp lại mỗi ngày; tôi cần một sự thay đổi.)\n- be tired of + V-ing = chán, mệt mỏi với việc gì", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2025 - Đề Chẵn"}, {"id": "2025-chan-reading-open-1", "type": "open_short_answer", "passage": "Read the passage and answer the questions:\nSmall and medium-sized enterprises (SMEs) are vital to a country's economic growth. They create jobs, encourage innovation, and contribute significantly to national income. In developing countries, SMEs often make up the majority of businesses, providing employment opportunities for millions of people. However, they also face challenges such as limited access to finance, high competition, and lack of technology. Governments can support SMEs by offering low-interest loans, training programs, and better infrastructure. When supported effectively, small businesses can drive sustainable growth and strengthen local communities.", "prompt": "Why are small businesses important for a country's economy? (tại sao các doanh nghiệp nhỏ lại quan trọng đối với kinh tế của 1 đất nước)", "answer": "Because they create jobs, encourage innovation, and contribute significantly to national income. (Chúng quan trọng vì tạo việc làm, khuyến khích đổi mới sáng tạo và đóng góp đáng kể vào thu nhập quốc gia.) Thông tin câu: (2)", "explanation": "", "needs_review": false, "section": "reading-open", "section_label": "Đọc hiểu - Trả lời câu hỏi", "exam_label": "CPA 2025 - Đề Chẵn"}, {"id": "2025-chan-reading-open-2", "type": "open_short_answer", "passage": "Read the passage and answer the questions:\nSmall and medium-sized enterprises (SMEs) are vital to a country's economic growth. They create jobs, encourage innovation, and contribute significantly to national income. In developing countries, SMEs often make up the majority of businesses, providing employment opportunities for millions of people. However, they also face challenges such as limited access to finance, high competition, and lack of technology. Governments can support SMEs by offering low-interest loans, training programs, and better infrastructure. When supported effectively, small businesses can drive sustainable growth and strengthen local communities.", "prompt": "What are some challenges faced by SMEs? (những thách thức mà doanh nghiệp vừa mà nhỏ phải đối mặt là gì?)", "answer": "SMEs face challenges such as limited access to finance, high competition, and lack of technology. (SME gặp phải những khó khăn như hạn chế tiếp cận nguồn vốn, cạnh tranh cao và thiếu công nghệ.) Thông tin câu: (4)", "explanation": "", "needs_review": false, "section": "reading-open", "section_label": "Đọc hiểu - Trả lời câu hỏi", "exam_label": "CPA 2025 - Đề Chẵn"}, {"id": "2025-chan-reading-open-3", "type": "open_short_answer", "passage": "Read the passage and answer the questions:\nSmall and medium-sized enterprises (SMEs) are vital to a country's economic growth. They create jobs, encourage innovation, and contribute significantly to national income. In developing countries, SMEs often make up the majority of businesses, providing employment opportunities for millions of people. However, they also face challenges such as limited access to finance, high competition, and lack of technology. Governments can support SMEs by offering low-interest loans, training programs, and better infrastructure. When supported effectively, small businesses can drive sustainable growth and strengthen local communities.", "prompt": "How can governments help small businesses? (chính phủ có thể giúp đỡ các doanh nghiệp nhỏ như thế nào?)", "answer": "Governments can help by offering low-interest loans, training programs, and better infrastructure. (Chính phủ có thể hỗ trợ bằng cách cung cấp các khoản vay lãi suất thấp, chương trình đào tạo và cơ sở hạ tầng tốt hơn.) Thông tin câu: (5)", "explanation": "", "needs_review": false, "section": "reading-open", "section_label": "Đọc hiểu - Trả lời câu hỏi", "exam_label": "CPA 2025 - Đề Chẵn"}, {"id": "2025-chan-reading-open-4", "type": "open_short_answer", "passage": "Read the passage and answer the questions:\nSmall and medium-sized enterprises (SMEs) are vital to a country's economic growth. They create jobs, encourage innovation, and contribute significantly to national income. In developing countries, SMEs often make up the majority of businesses, providing employment opportunities for millions of people. However, they also face challenges such as limited access to finance, high competition, and lack of technology. Governments can support SMEs by offering low-interest loans, training programs, and better infrastructure. When supported effectively, small businesses can drive sustainable growth and strengthen local communities.", "prompt": "What role do SMEs play in developing countries? (các doanh nghiệp vừa và nhỏ đóng vai trò như thế nào đối với sự phát triển đất nước?)", "answer": "In developing countries, SMEs often make up the majority of businesses, providing employment opportunities for millions of people. (Ở các nước đang phát triển, SME thường chiếm phần lớn số doanh nghiệp, tạo cơ hội việc làm cho hàng triệu người.) Thông tin câu: (3)", "explanation": "", "needs_review": false, "section": "reading-open", "section_label": "Đọc hiểu - Trả lời câu hỏi", "exam_label": "CPA 2025 - Đề Chẵn"}, {"id": "2025-chan-reading-open-5", "type": "open_short_answer", "passage": "Read the passage and answer the questions:\nSmall and medium-sized enterprises (SMEs) are vital to a country's economic growth. They create jobs, encourage innovation, and contribute significantly to national income. In developing countries, SMEs often make up the majority of businesses, providing employment opportunities for millions of people. However, they also face challenges such as limited access to finance, high competition, and lack of technology. Governments can support SMEs by offering low-interest loans, training programs, and better infrastructure. When supported effectively, small businesses can drive sustainable growth and strengthen local communities.", "prompt": "What does the passage suggest about the relationship between SMEs and local communities? (Đoạn văn trên gợi ý gì về mối quan hệ giữa doanh nghiệp vừa và nhỏ với cộng đồng địa phương)", "answer": "It suggests that when supported effectively, small businesses can drive sustainable growth and strengthen local communities. (Đoạn văn cho thấy khi được hỗ trợ hiệu quả, doanh nghiệp nhỏ có thể thúc đẩy tăng trưởng bền vững và củng cố cộng đồng địa phương.) Thông tin câu: (6)", "explanation": "", "needs_review": false, "section": "reading-open", "section_label": "Đọc hiểu - Trả lời câu hỏi", "exam_label": "CPA 2025 - Đề Chẵn"}, {"id": "2025-chan-reading-mcq-1", "type": "mcq", "passage": "Read the passage carefully and choose ONE which you think fits best\nOver the past decade, cashless payment systems such as credit cards, mobile wallets, and online banking have become increasingly popular. These methods offer convenience, speed, and safety compared to carrying cash. Many people now pay their bills, shop, and even send money through their smartphones. However, the shift to digital payments also raises concerns about privacy and cybersecurity. Some worry that relying too much on technology might exclude the elderly or those without internet access. Despite these concerns, cashless systems continue to expand globally, reshaping how people manage their finances.", "prompt": "What is the main idea of the passage? (Ý chính của đoạn văn trên là gì)", "options": [{"label": "A", "text": "The decline of banking systems"}, {"label": "B", "text": "The rise and impact of cashless payments"}, {"label": "C", "text": "The disadvantages of using smartphones"}, {"label": "D", "text": "The importance of saving money (Vai trờ của tiết kiệm tiền)\nGiải thích: Toàn bộ đoạn văn nói về sự phát triển của thanh toán không tiền mặt và những tác động của nó đến đời sống (câu 1, 2, 6) → đáp án B."}], "answer": "B", "explanation": "Toàn bộ đoạn văn nói về sự phát triển của thanh toán không tiền mặt và những tác động của nó đến đời sống (câu 1, 2, 6) → đáp án B.", "needs_review": false, "section": "reading-mcq", "section_label": "Đọc hiểu - Trắc nghiệm", "exam_label": "CPA 2025 - Đề Chẵn"}, {"id": "2025-chan-reading-mcq-2", "type": "mcq", "passage": "Read the passage carefully and choose ONE which you think fits best\nOver the past decade, cashless payment systems such as credit cards, mobile wallets, and online banking have become increasingly popular. These methods offer convenience, speed, and safety compared to carrying cash. Many people now pay their bills, shop, and even send money through their smartphones. However, the shift to digital payments also raises concerns about privacy and cybersecurity. Some worry that relying too much on technology might exclude the elderly or those without internet access. Despite these concerns, cashless systems continue to expand globally, reshaping how people manage their finances.", "prompt": "Which of the following is NOT mentioned as an advantage of cashless payments?", "options": [{"label": "A", "text": "Convenience"}, {"label": "B", "text": "Speed"}, {"label": "C", "text": "Privacy"}, {"label": "D", "text": "Safety (An toàn)\nGiải thích: Câu 2 trong đoạn: \"These methods offer convenience, speed, and safety...\" chỉ liệt kê 3 lợi ích là convenience, speed, safety. \"Privacy\" (quyền riêng tư) không được nhắc đến như một lợi ích - thực tế câu 4 cho thấy đây lại là một mối lo ngại → đáp án C."}], "answer": "C", "explanation": "Câu 2 trong đoạn: \"These methods offer convenience, speed, and safety...\" chỉ liệt kê 3 lợi ích là convenience, speed, safety. \"Privacy\" (quyền riêng tư) không được nhắc đến như một lợi ích - thực tế câu 4 cho thấy đây lại là một mối lo ngại → đáp án C.", "needs_review": false, "section": "reading-mcq", "section_label": "Đọc hiểu - Trắc nghiệm", "exam_label": "CPA 2025 - Đề Chẵn"}, {"id": "2025-chan-reading-mcq-3", "type": "mcq", "passage": "Read the passage carefully and choose ONE which you think fits best\nOver the past decade, cashless payment systems such as credit cards, mobile wallets, and online banking have become increasingly popular. These methods offer convenience, speed, and safety compared to carrying cash. Many people now pay their bills, shop, and even send money through their smartphones. However, the shift to digital payments also raises concerns about privacy and cybersecurity. Some worry that relying too much on technology might exclude the elderly or those without internet access. Despite these concerns, cashless systems continue to expand globally, reshaping how people manage their finances.", "prompt": "What is one major concern about digital payments? (Lo ngại chính về thanh toán điện tử là gì)", "options": [{"label": "A", "text": "They are slower than cash transactions."}, {"label": "B", "text": "They may increase risks of privacy and security issues."}, {"label": "C", "text": "They are only used by young people."}, {"label": "D", "text": "They cannot be used internationally. (Chúng không thể sử dụng ở nước ngoài)\nGiải thích: Câu 4: \"the shift to digital payments also raises concerns about privacy and cybersecurity\" → thanh toán số làm dấy lên lo ngại về quyền riêng tư và an ninh mạng → đáp án B."}], "answer": "B", "explanation": "Câu 4: \"the shift to digital payments also raises concerns about privacy and cybersecurity\" → thanh toán số làm dấy lên lo ngại về quyền riêng tư và an ninh mạng → đáp án B.", "needs_review": false, "section": "reading-mcq", "section_label": "Đọc hiểu - Trắc nghiệm", "exam_label": "CPA 2025 - Đề Chẵn"}, {"id": "2025-chan-reading-mcq-4", "type": "mcq", "passage": "Read the passage carefully and choose ONE which you think fits best\nOver the past decade, cashless payment systems such as credit cards, mobile wallets, and online banking have become increasingly popular. These methods offer convenience, speed, and safety compared to carrying cash. Many people now pay their bills, shop, and even send money through their smartphones. However, the shift to digital payments also raises concerns about privacy and cybersecurity. Some worry that relying too much on technology might exclude the elderly or those without internet access. Despite these concerns, cashless systems continue to expand globally, reshaping how people manage their finances.", "prompt": "Who might find it difficult to use cashless systems according to the passage?", "options": [{"label": "A", "text": "Teenagers"}, {"label": "B", "text": "Business owners"}, {"label": "C", "text": "Elderly people"}, {"label": "D", "text": "Bank employees (nhân viên nhân hàng)\nGiải thích: Câu 5: \"...might exclude the elderly or those without internet access.\" → người lớn tuổi có thể gặp khó khăn khi sử dụng hệ thống không tiền mặt → đáp án C."}], "answer": "C", "explanation": "Câu 5: \"...might exclude the elderly or those without internet access.\" → người lớn tuổi có thể gặp khó khăn khi sử dụng hệ thống không tiền mặt → đáp án C.", "needs_review": false, "section": "reading-mcq", "section_label": "Đọc hiểu - Trắc nghiệm", "exam_label": "CPA 2025 - Đề Chẵn"}, {"id": "2025-chan-reading-mcq-5", "type": "mcq", "passage": "Read the passage carefully and choose ONE which you think fits best\nOver the past decade, cashless payment systems such as credit cards, mobile wallets, and online banking have become increasingly popular. These methods offer convenience, speed, and safety compared to carrying cash. Many people now pay their bills, shop, and even send money through their smartphones. However, the shift to digital payments also raises concerns about privacy and cybersecurity. Some worry that relying too much on technology might exclude the elderly or those without internet access. Despite these concerns, cashless systems continue to expand globally, reshaping how people manage their finances.", "prompt": "What does the author suggest about the future of cashless payments? (tác giả gợi ý gì về tương lai của thanh toán không dùng tiền mặt)", "options": [{"label": "A", "text": "They will continue to grow and change financial habits"}, {"label": "B", "text": "They will remain limited to developed countries."}, {"label": "C", "text": "They will probably disappear soon."}, {"label": "D", "text": "They will replace all traditional banks immediately. (Chúng sẽ thay thế ngay lập tức các ngân hàng truyền thống)\nGiải thích: Câu cuối: \"cashless systems continue to expand globally, reshaping how people manage their finances.\" → hệ thống không tiền mặt sẽ tiếp tục phát triển và thay đổi thó

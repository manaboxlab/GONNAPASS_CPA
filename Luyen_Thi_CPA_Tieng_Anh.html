e his books published (6) _____ first, but after his first book, Five Weeks in a\nBalloon, was published, it was (7) _____ a success that his publisher, Etzel, offered him a twenty-year\ncontract. After that he wrote two novels a year. In (8) _____ over forty years, he had written eighty novels. (9) _____ of his books, Around the World in Eighty Days, is a very clever (10) _____", "gap_number": 10, "answer": "story", "explanation": "", "needs_review": false, "section": "cloze", "section_label": "Điền từ vào đoạn văn", "exam_label": "CPA 2020 - Đề Chẵn"}, {"id": "2020-chan-wordform-1", "type": "fill_blank", "prompt": "Does it make any ....................... (DIFFER) to them if we pay by check?", "answer": "difference", "explanation": "Do/ Does + S + V + O + …. ( Câu nghi vấn)\nDiffer (v): khác\n➔ Difference (n): sự khác nhau\n➔ Make difference (v): tạo ra sự khác biệt", "needs_review": false, "section": "wordform", "section_label": "Từ loại (Word Formation)", "exam_label": "CPA 2020 - Đề Chẵn"}, {"id": "2020-chan-wordform-2", "type": "fill_blank", "prompt": "The two boys should receive a just punishment. Their ....................... (BEHAVE) at the\ninaugration ceremony was really outrageous.", "answer": "behavior", "explanation": "really outrageous.\nBehave (v): hành xử\n➔ Behavior (n): hành vi", "needs_review": false, "section": "wordform", "section_label": "Từ loại (Word Formation)", "exam_label": "CPA 2020 - Đề Chẵn"}, {"id": "2020-chan-wordform-3", "type": "fill_blank", "prompt": "The main cause of the current crisis in the party seems to be the deep ....................... (DIVIDE)\nbetween its members.", "answer": "division", "explanation": "Divide (v): chia\n➔ Division (n): sự chia rẽ", "needs_review": false, "section": "wordform", "section_label": "Từ loại (Word Formation)", "exam_label": "CPA 2020 - Đề Chẵn"}, {"id": "2020-chan-wordform-4", "type": "fill_blank", "prompt": "It's most ....................... (FASHION) among youths these days to spend their free time in the\ncinema.", "answer": "fashionable", "explanation": "It’s + adj + to + V\nFashion (n): thời trang\n➔ Fashionable (adj): hợp thời trang", "needs_review": false, "section": "wordform", "section_label": "Từ loại (Word Formation)", "exam_label": "CPA 2020 - Đề Chẵn"}, {"id": "2020-chan-wordform-5", "type": "fill_blank", "prompt": "Tom has lost his ....................... (CONFIDE) in conventional medicine after many years of\nunsuccessful treatment and has opted for acupuncture.", "answer": "confidence", "explanation": "Tính từ sở hữu + N\nof unsuccessful treatment and has opted for acupuncture.\nConfide (v): tin cậy\n➔ Confidence (n): Lòng tin", "needs_review": false, "section": "wordform", "section_label": "Từ loại (Word Formation)", "exam_label": "CPA 2020 - Đề Chẵn"}, {"id": "2020-chan-sentence-build-1", "type": "sentence_building", "prompt": "If/ I / you / I / learn harder.", "answer": "If I were you, I would learn harder", "explanation": "➔ Câu điều kiện loại 2: If + S + Ved/V2, S + would + V-inf ( Dùng để diễn tả một hành động, sự việc có\nthể sẽ không thể xảy ra trong tương lai.)", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2020 - Đề Chẵn"}, {"id": "2020-chan-sentence-build-2", "type": "sentence_building", "prompt": "I/ feel / hopeful / that / we / find / suitable house / very soon.", "answer": "I feel hopeful that we will find a suitable house very soon.", "explanation": "➔ Cấu trúc hope thì hiện tại đơn : S + hope(that) + S+ will + V", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2020 - Đề Chẵn"}, {"id": "2020-chan-sentence-build-3", "type": "sentence_building", "prompt": "She / not / play / piano / well / as / her sister.", "answer": "She doesn’t play piano as well as her sister.", "explanation": "➔ As well as: tốt như là…", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2020 - Đề Chẵn"}, {"id": "2020-chan-sentence-build-4", "type": "sentence_building", "prompt": "I wish / could / give you / all the expensive things / life.", "answer": "I wish I could give you all the expensive things in life", "explanation": "", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2020 - Đề Chẵn"}, {"id": "2020-chan-sentence-build-5", "type": "sentence_building", "prompt": "You / hear / Maria / since / you / leave school?", "answer": "Have you heard from Maria since you left school?", "explanation": "", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2020 - Đề Chẵn"}, {"id": "2020-chan-sentence-build-6", "type": "sentence_building", "prompt": "The people / live / next door to us/ keep / have / all night parties.", "answer": "The people living next door to us keep having all night parties.", "explanation": "", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2020 - Đề Chẵn"}, {"id": "2020-chan-sentence-build-7", "type": "sentence_building", "prompt": "Our school / going / hold / English-speaking contest / celebrate / Teacher's Day.", "answer": "Our school is going to hold an English-speaking contest to celebrate the Teacher’s day.", "explanation": "", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2020 - Đề Chẵn"}, {"id": "2020-chan-sentence-build-8", "type": "sentence_building", "prompt": "If/ I/ meet/ alien/ outer space/ I/ invite/ home/ talk.", "answer": "If I met an alien from the outer space, I would invite him to my home to talk.", "explanation": "", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2020 - Đề Chẵn"}, {"id": "2020-chan-sentence-build-9", "type": "sentence_building", "prompt": "The students/ study/ for/ exam/ now.", "answer": "The students are studying for the exam now.", "explanation": "", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2020 - Đề Chẵn"}, {"id": "2020-chan-sentence-build-10", "type": "sentence_building", "prompt": "It/ increase/ student's participation/ classroom activities/ when/ they/ allowed/ use/ own devices/ learning.", "answer": "It increases student’s participation into classroom activities when they are allowed to use their own devices", "explanation": "", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2020 - Đề Chẵn"}, {"id": "2020-chan-transform-1", "type": "sentence_transformation", "prompt": "My cousin often visited me when he lived in Hanoi.", "answer": "My cousin used to visit me when he lived in Hanoi.", "explanation": "➔ Cấu trúc: S+used to +V: Đã từng ( Chỉ một thói quen, một hành động thường xuyên xảy ra trong quá\nkhứ và bây giờ không còn nữa.)", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2020 - Đề Chẵn"}, {"id": "2020-chan-transform-2", "type": "sentence_transformation", "prompt": "I would like you to help me put the chairs away.", "answer": "Do you mind helping me to put the chairs away?", "explanation": "➔ Do you mind + V-ing …: Bạn có phiền làm gì đó hay không?", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2020 - Đề Chẵn"}, {"id": "2020-chan-transform-3", "type": "sentence_transformation", "prompt": "I last saw him when I was a student.", "answer": "I haven't seen him since I was a student.", "explanation": "➔ Cấu trúc since thì hiện tại hoàn thành: S + have/has + V (PII) + since + mốc thời gian", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2020 - Đề Chẵn"}, {"id": "2020-chan-transform-4", "type": "sentence_transformation", "prompt": "\"Don't forget to bring your passports with you when you go abroad.\"", "answer": "She reminded me of bringing my pasports with me when I went abroad", "explanation": "➔ Cấu trúc : S + Remind + someone of + N/ Ving…( để nói về việc khiến người nói/ người nghe hồi tưởng\nlại chuyện xảy ra dưới quá khứ hoặc nhớ lại về các điều vô tình lãng quên dưới hiện tại.)\n(Đừng quên mang theo hộ chiếu khi bạn ra nước ngoài.\nCô ấy nhắc tôi nhớ mang theo hộ chiếu khi tôi ra nước ngoài.)", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2020 - Đề Chẵn"}, {"id": "2020-chan-transform-5", "type": "sentence_transformation", "prompt": "Immediately after his arrival, things went wrong.", "answer": "No sooner had he arrived than things went wrong.", "explanation": "➔ Cấu trúc No sooner thì quá khứ: vừa mới thì….\nNo sooner + had +S + PII + Than + S + Ved/PII", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2020 - Đề Chẵn"}, {"id": "2020-chan-translate-en-vi-1", "type": "translation", "prompt": "All payments and transfer transactions related to providing audit service across the border must be carried out by bank transfer via an authorised credit institution according to Vietnamese regulations on foreign exchange management.", "answer": "Mọi giao dịch thanh toán và chuyển tiền liên quan đến cung cấp dịch vụ kiểm toán qua biên giới phải thực hiện bằng hình thức chuyển khoản thông qua tổ chức tín dụng được phép theo quy định của pháp luật về quản lý ngoại hối của Việt Nam.", "explanation": "", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2020 - Đề Chẵn"}, {"id": "2020-chan-translate-en-vi-2", "type": "translation", "prompt": "Other enterprises and organisations are subject to compulsory auditing according to the relevant regulations.", "answer": "Các doanh nghiệp, tổ chức khác bắt buộc phải kiểm toán theo quy định của pháp luật có liên quan.", "explanation": "", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2020 - Đề Chẵn"}, {"id": "2020-chan-translate-en-vi-3", "type": "translation", "prompt": "The audit contract, the partnership contract, audit dossiers and audit reports must be made in both Vietnamese and English.", "answer": "Hợp đồng kiểm toán, hợp đồng liên danh, hồ sơ kiểm toán và báo cáo kiểm toán cần phải được lập bằng cả tiếng Việt và tiếng Anh.", "explanation": "", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2020 - Đề Chẵn"}, {"id": "2020-chan-translate-en-vi-4", "type": "translation", "prompt": "To refuse to carry out an audit if the client or the entity requesting an audit has made a request that is contrary to professional ethical standards and the requirements of professional skill or otherwise contrary to the provisions of law.", "answer": "Từ chối thực hiện kiểm toán nếu khách hàng hoặc đơn vị yêu cầu kiểm toán đưa ra yêu cầu trái với chuẩn mực đạo đức nghề nghiệp, yêu cầu về kỹ năng nghề nghiệp hoặc trái với quy định của pháp luật.", "explanation": "", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2020 - Đề Chẵn"}, {"id": "2020-chan-translate-en-vi-5", "type": "translation", "prompt": "When providing audit services across the border in Vietnam they must comply with Vietnamese audit standards.", "answer": "Khi cung cấp các dịch vụ kiểm toán qua biên giới tại Việt Nam, họ phải tuân thủ theo các chuẩn mực kiểm toán của Việt Nam.", "explanation": "", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2020 - Đề Chẵn"}, {"id": "2020-chan-translate-vi-en-1", "type": "translation", "prompt": "Kế toán viên, kiểm toán viên chuyên nghiệp có thể gặp phải xung đột về lợi ích trong khi thực hiện hoat động chuyên môn.", "answer": "Professional accountants and auditors may encounter conflicts of interest while performing their professional activities.", "explanation": "", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2020 - Đề Chẵn"}, {"id": "2020-chan-translate-vi-en-2", "type": "translation", "prompt": "Quỹ Tiền tệ Liên Hiệp quốc (IMF) dã dự doán tăng trưởng GDP cho Viêt Nam là 1,6% cho năm nay, mức tăng trưởng sẽ khiến Việt Nam trở thành nền kinh tế lớn thứ tư của khu vực Ðông Nam Á.", "answer": "The International Monetary Fund (IMF) has forecasted Vietnam’s GDP will grow at 1,6% this year, which makes Vietnam the fourth largest economy in Southeast Asia.", "explanation": "", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2020 - Đề Chẵn"}, {"id": "2020-chan-translate-vi-en-3", "type": "translation", "prompt": "Khi kế toán viên, kiểm toán viên chuyên nghiệp nhận thấy họ đang bị gắn tên với các thông tin này, họ phải tiến hành các buớc cần thiết để chấm dứt việc bị gắn tên với các thông tin đó.", "answer": "When professional accountants and auditors become aware that they are being associated with this information, they must take the necessary steps to be disassociated from that information.", "explanation": "", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2020 - Đề Chẵn"}, {"id": "2020-chan-translate-vi-en-4", "type": "translation", "prompt": "Xung đột về lợi ích có thể làm phát sinh nguy cơ ảnh hưởng đến tính khách quan và các nguyên tắc đạo đức cơ bản khác.", "answer": "The conflicts of interest can create threats to objectivity and other fundamental ethical principles.", "explanation": "", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2020 - Đề Chẵn"}, {"id": "2020-chan-translate-vi-en-5", "type": "translation", "prompt": "Thực hiện có hiệu quả việc cô n (v): tham dự/ liên quan", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2020 - Đề Lẻ"}, {"id": "2020-le-vocab-6", "type": "fill_blank", "prompt": "I wish you'd tell me what I ....................... do in this difficult situation.", "answer": "should", "explanation": "", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2020 - Đề Lẻ"}, {"id": "2020-le-vocab-7", "type": "fill_blank", "prompt": "Hotel rooms must be ....................... by noon, but luggage may be left with the porter.", "answer": "vacated", "explanation": "", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2020 - Đề Lẻ"}, {"id": "2020-le-vocab-8", "type": "fill_blank", "prompt": "It won't ....................... matter if you arrive a few minutes late.", "answer": "greatly", "explanation": "➔ It won't greatly matter if…: nó không phải là vấn đề gì lớn nếu", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2020 - Đề Lẻ"}, {"id": "2020-le-vocab-9", "type": "fill_blank", "prompt": "The overcrowded living conditions ....................... a heavy strain on the family.", "answer": "put", "explanation": "➔ Put a heavy strain on (v): gây căng thẳng/ nặng nề với…", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2020 - Đề Lẻ"}, {"id": "2020-le-vocab-10", "type": "fill_blank", "prompt": "....................... I am aware, there were no problems during the first six months", "answer": "As far as", "explanation": "➔ As far as I am aware : theo như tôi được biết", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2020 - Đề Lẻ"}, {"id": "2020-le-vocab-11", "type": "fill_blank", "prompt": "The man was very conscious ....................... his bald head", "answer": "of", "explanati ooking their midday meals (2). Thousands of stoves were overturned as soon as the earth began to shake (3). As\na result, small fires broke out everywhere and quickly spread(4). The fire engines were prevented from going to\nhelp because many of the roads had cracked open (5). It was impossible to use firefighting equipment as most of\nthe water pipes had burst(6). Consequently, over ninety percent of the damage caused by fire(7) rather than by\nthe collapse of the buildings.", "prompt": "How many people were killed in the earthquake in Tokyo in 1923?", "answer": "Almost a hundred thousand people were killed in the earthquake in Tokyo in 1923 (1)", "explanation": "", "needs_review": false, "section": "reading-open", "section_label": "Đọc hiểu - Trả lời câu hỏi", "exam_label": "CPA 2020 - Đề Lẻ"}, {"id": "2020-le-reading-open-2", "type": "open_short_answer", "passage": "Read the passage and answer the questions.\nAlmost a hundred thousand people were killed and half a million homes destroyed as a result of an earthquake\nin Tokyo in 1923 (1). The earthquake began a minute before the noon when the inhabitants of Tokyo were\ncooking their midday meals (2). Thousands of stoves were overturned as soon as the earth began to shake (3). As\na result, small fires broke out everywhere and quickly spread(4). The fire engines were prevented from going to\nhelp because many of the roads had cracked open (5). It was impossible to use firefighting equipment as most of\nthe water pipes had burst(6). Consequently, over ninety percent of the damage caused by fire(7) rather than by\nthe collapse of the buildings.", "prompt": "When did the earthquake begin?", "answer": "The earthquake began a minute before the noon when the inhabitants of Tokyo were cooking their midday meals (2)", "explanation": "", "needs_review": false, "section": "reading-open", "section_label": "Đọc hiểu - Trả lời câu hỏi", "exam_label": "CPA 2020 - Đề Lẻ"}, {"id": "2020-le-reading-open-3", "type": "open_short_ans "answer": "Kiểm toán là việc xem xét và đánh giá một cách khách quan các báo cáo tài chính của một công ty - thường được thực hiện bởi một bên thứ ba.", "explanation": "", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2020 - Đề Lẻ"}, {"id": "2020-le-translate-en-vi-2", "type": "translation", "prompt": "Accounting is not limited to the private sector, with many accounting graduates being employed by governmental and non-governmental organizations.", "answer": "Kế toán không chỉ giới hạn ở khu vực tư nhân, với nhiều sinh viên kế toán tốt nghiệp được làm việc trong các tổ chức chính phủ và phi chính phủ.", "explanation": "", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2020 - Đề Lẻ"}, {"id": "2020-le-translate-en-vi-3", "type": "translation", "prompt": "The government are talking about increasing the value added tax rate next year, which means the cost of consumer goods will rise.", "answer": "Chính phủ đang bàn về việc tăng thuế suất thuế giá trị gia tăng vào năm tới, điều này có nghĩa là chi phí hàng tiêu dùng sẽ tăng lên.", "explanation": "", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2020 - Đề Lẻ"}, {"id": "2020-le-translate-en-vi-4", "type": "translation", "prompt": "To refuse to carry out an audit for a client or an entity requesting an audit if there is reason to believe that they cannot guarantee the independence of the auditor, or the auditor does not have sufficient qualifications or has not fulfilled all the required conditions in accordance with regulations of law.", "answer": "Từ chối thực hiện kiểm toán cho khách hàng hoặc đơn vị yêu cầu kiểm toán nếu có lý do cho rằng họ không thể đảm bảo tính độc lập của kiểm toán viên hoặc kiểm toán viên không có đủ năng lực hoặc chưa đáp ứng đầy đủ các điều kiện theo quy định của pháp luật.", "explanation": "", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2020 - Đề Lẻ"}, {"id": "2020-le-translate-en-vi-5", "type": "translation", "prompt": "Other cases in accordance with provisions of professional ethics standards of accounting and auditing and provisions of the law.", "answer": "Các trường hợp khác theo quy định của chuẩn mực đạo đức nghề nghiệp kế toán, kiểm toán và quy định của pháp luật.", "explanation": "", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2020 - Đề Lẻ"}, {"id": "2020-le-translate-vi-en-1", "type": "translation", "prompt": "Kế toán viên, kiểm toán viên chuyên nghiệp phải duy trì sự bảo mật thông tin có được từ khách hàng tiềm năng hoặc đơn vị nơi họ có khả năng được tuyển dụng trong tương lai.", "answer": "Professional accountants and auditors must maintain confidentiality of information obtained from potential clients or organizations where they are likely to be employed in the future.", "explanation": "", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2020 - Đề Lẻ"}, {"id": "2020-le-translate-vi-en-2", "type": "translation", "prompt": "Ðể cung cấp dịch vụ chuyên môn đạt chất lượng, kế toán viên, kiểm toán viên chuyên nghiệp phải thực hiện các xét đoán hợp lý khi áp dụng kiến thức và kỹ năng chuyên môn trong việc thực hiện dịch vụ đó.", "answer": "In order to provide competent professional services, professional accountants and auditors must exercise reasonable judgment in applying professional knowledge and skills in the performance of such service..", "explanation": "", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2020 - Đề Lẻ"}, {"id": "2020-le-translate-vi-en-3", "type": "translation", "prompt": "Bằng cách nghiên cứu sổ sách kế toán của năm trước và cân nhắc bất kỳ sự thay đổi trên thị trường, chúng ta có thể dự báo được tình hình tài chính của công ty trước 12 tháng.", "answer": "By studying previous year's accounting books and considering any changes in the market, we can forecast the financial position of the company 12 months in advance.", "explanation": "", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2020 - Đề Lẻ"}, {"id": "2020-le-translate-vi-en-4", "type": "translation", "prompt": "Ban hành lộ trình áp dụng chuẩn mực báo cáo tài chính quốc tế (IFRS) để góp phần nâng cao tính minh bạch và tăng hiệu quả trong việc cung cấp thông tin.", "answer": "Issuing a roadmap to apply international financial reporting standards (IFRS) to contribute to improving transparency and increasing efficiency in providing information. Vị trí mà cá nhân đó từng nắm giữ trong khách hàng sử dụng dịch vụ đảm bảo. The position the individual once held at the assurance client.", "explanation": "", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2020 - Đề Lẻ"}]}, {"year": "2022", "version": "chan", "items": [{"id": "2022-chan-vocab-1", "type": "fill_blank", "prompt": "_____ for gold and salt is hard!", "answer": "Mining", "explanation": "(Khai thác vàng và muối rất khó)\n➔ Mining (n) khai thác", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2022 - Đề Chẵn"}, {"id": "2022-chan-vocab-2", "type": "fill_blank", "prompt": "Colors can _____ the way we think and feel.", "answer": "affect", "explanation": "S + can + V\n( Màu sắc có thể ảnh hưởng đến cách chúng ta nghĩ và cảm nhận)\n➔ affect (v) ảnh hưởng / effect (n) sự ảnh hưởng", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2022 - Đề Chẵn"}, {"id": "2022-chan-vocab-3", "type": "fill_blank", "prompt": "It is not good to get _____ on your cell phone.", "answer": "moisture", "explanation": "to V + N\n(Không tốt nếu điện thoại bạn bị review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2022 - Đề Chẵn"}, {"id": "2022-chan-vocab-15", "type": "fill_blank", "prompt": "The director made many films _____ his long career.", "answer": "in", "explanation": "(Đạo diễn đã làm nhiều bộ phim trong sự nhiệp lâu dài của mình)\n➔ in", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2022 - Đề Chẵn"}, {"id": "2022-chan-reading-open-1", "type": "open_short_answer", "passage": "Read the passage and answer the questions:\nSalt is a type of mineral(1). Not only does salt improve our diets, it is essential for our health(2).\nOur muscles need it to move(3). Our hearts need it to beat(4). Even the brain and nerves need salt to\ncommunicate and function properly(5). If we do not get enough salt, the systems in our bodies do\nnot work well(6). We might get tired, and our thinking might slow down(7).\nHowever, just as too much salt can ruin the flavor of food, it can also harm our bodies(8). Scientists\nsay that too much salt can cause high blood pressure(9). This is dangerous because it can lead to\nheart problems(10).", "prompt": "What is this passage mainly about?", "answer": "This passage is mainly about the benefits and notes when using salt. (Đoạn văn chủ yếu về lợi ích và những lưu ý khi sử dụng muối)", "explanation": "", "needs_review": false, "section": "reading-open", "section_label": "Đọc hiểu - Trả lời câu hỏi", "exam_label": "CPA 2022 - Đề Chẵn"}, {"id": "2022-chan-reading-open-2", "type": "open_short_answer", "passage": "Read the passage and answer the questions:\nSalt is a type of mineral(1). Not only does salt improve our diets, it is essential for our health(2).\nOur muscles need it to move(3). Our hearts need it to beat(4). Even the brain and nerves need salt to\ncommunicate and function properly(5). If we do not get enough salt, the systems in our bodies do\nnot work well(6). We might get tired, and our t ver, just as too much salt can ruin the flavor of food, it can also harm our bodies(8). Scientists\nsay that too much salt can cause high blood pressure(9). This is dangerous because it can lead to\nheart problems(10).", "prompt": "What happens when we eat too much salt?", "answer": "It can ruin the flavor of food, it can also harm our bodies(8).", "explanation": "", "needs_review": false, "section": "reading-open", "section_label": "Đọc hiểu - Trả lời câu hỏi", "exam_label": "CPA 2022 - Đề Chẵn"}, {"id": "2022-chan-reading-open-5", "type": "open_short_answer", "passage": "Read the passage and answer the questions:\nSalt is a type of mineral(1). Not only does salt improve our diets, it is essential for our health(2).\nOur muscles need it to move(3). Our hearts need it to beat(4). Even the brain and nerves need salt to\ncommunicate and function properly(5). If we do not get enough salt, the systems in our bodies do\nnot work well(6). We might get tired, and our thinking might slow down(7).\nHowever, just as too much salt can ruin the flavor of food, it can also harm our bodies(8). Scientists\nsay that too much salt can cause high blood pressure(9). This is dangerous because it can lead to\nheart problems(10).", "prompt": "Why is high blood pressure dangerous?", "answer": "Because it can lead to heart problems(10).", "explanation": "", "needs_review": false, "section": "reading-open", "section_label": "Đọc hiểu - Trả lời câu hỏi", "exam_label": "CPA 2022 - Đề Chẵn"}, {"id": "2022-chan-reading-mcq-1", "type": "mcq", "passage": "Read the passage carefully and choose ONE which you think fits best\nWhen you put money in a savings account, the bank pays you some extra money each month(1).\nThe money you put in is called a deposit(2). The money the bank pays you for your deposit is\nthe interest(3).\nWhy would banks protect your money and still pay you interest(4)? The reason is that banks take\nyour deposit and lend it to other people(5). When people borrow from banks, thi  b. a deposit(2) c. the interest d. a loan", "needs_review": false, "section": "reading-mcq", "section_label": "Đọc hiểu - Trắc nghiệm", "exam_label": "CPA 2022 - Đề Chẵn"}, {"id": "2022-chan-reading-mcq-3", "type": "mcq", "passage": "Read the passage carefully and choose ONE which you think fits best\nWhen you put money in a savings account, the bank pays you some extra money each month(1).\nThe money you put in is called a deposit(2). The money the bank pays you for your deposit is\nthe interest(3).\nWhy would banks protect your money and still pay you interest(4)? The reason is that banks take\nyour deposit and lend it to other people(5). When people borrow from banks, this money is\ncalled a loan(6). They have to pay interest(7). This interest is much higher than the interest\nbanks pay for deposits(8). The bank needs deposits so that it can make money by lending\nmoney(9).", "prompt": "How do banks make money from loans?", "options": [{"label": "A", "text": "They charge interest on them(6,7)."}, {"label": "B", "text": "They use it to start businesses."}, {"label": "C", "text": "They sell things like houses or cars."}, {"label": "D", "text": "They charge people to make deposits"}], "answer": null, "explanation": "How do banks make money from loans?\na. They charge interest on them(6,7).\nb. They use it to start businesses.\nc. They sell things like houses or cars.\nd. They charge people to make deposits", "needs_review": true, "section": "reading-mcq", "section_label": "Đọc hiểu - Trắc nghiệm", "exam_label": "CPA 2022 - Đề Chẵn"}, {"id": "2022-chan-reading-mcq-4", "type": "mcq", "passage": "Read the passage carefully and choose ONE which you think fits best\nWhen you put money in a savings account, the bank pays you some extra money each month(1).\nThe money you put in is called a deposit(2). The money the bank pays you for your deposit is\nthe interest(3).\nWhy would banks protect your money and still pay you interest(4)? The reason is that banks take\nyour deposit and lend it to other people(5). When people borrow from banks, this money is\ncalled a loan(6). They have to pay interest(7). This interest is much higher than the interest\nbanks pay for deposits(8). The bank needs deposits so that it can make money by lending\nmoney(9).", "prompt": "Which is TRUE according to this passage?", "options": [{"label": "A", "text": "The average interest rate is 2% a year."}, {"label": "B", "text": "People can only borrow money if they have a savings account."}, {"label": "C", "text": "Your money will grow faster if you take it out of a savings account."}, {"label": "D", "text": "Savings account interest rates are lower than loan interest rates"}], "answer": "D", "explanation": "Which is TRUE according to this passage?\na. The average interest rate is 2% a year.\nb. People can only borrow money if they have a savings account.\nc. Your money will grow faster if you take it out of a savings account.\nd. Savings account interest rates are lower than loan interest rates(8).", "needs_review": false, "section": "reading-mcq", "section_label": "Đọc hiểu - Trắc nghiệm", "exam_label": "CPA 2022 - Đề Chẵn"}, {"id": "2022-chan-reading-mcq-5", "type": "mcq", "passage": "Read the passage carefully and choose ONE which you think fits best\nWhen you put money in a savings account, the bank pays you some extra money each month(1).\nThe money you put in is called a deposit(2). The money the bank pays you for your deposit is\nthe interest(3).\nWhy would banks protect your money and still pay you interest(4)? The reason is that banks take\nyour deposit and lend it to other people(5). When people borrow from banks, this money is\ncalled a loan(6). They have to pay interest(7). This interest is much higher than the interest\nbanks pay for deposits(8). The bank needs deposits so that it can make money by lending\nmoney(9).", "prompt": "Why do banks encourage people to keep their money in the bank?", "options": [{"label": "A", "text": "They take your depo r": "à Ngoài thông tin tài chính, kiểm toán viên có thể được yêu cầu chứng thực chất lượng trình bày của các thông tin phi tài chính như công bố chú thích cuối trang và báo cáo của giám đốc. attest (v) chứng thực footnote (n) chú thích cuối trang", "explanation": "", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2022 - Đề Chẵn"}, {"id": "2022-chan-translate-en-vi-3", "type": "translation", "prompt": "A large part of their work consists of operational audits.", "answer": "à Một phần lớn công việc của họ bao gồm kiểm toán hoạt động consist of something (v) bao gồm một thứ gì đó operational audit (n) kiểu toán độc lập", "explanation": "", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2022 - Đề Chẵn"}, {"id": "2022-chan-translate-en-vi-4", "type": "translation", "prompt": "In many countries, internal auditors are heavily involved in financial audits.", "answer": "à Ở nhiều quốc gia, kiểm toán viên nội bộ tham gia rất nhiều vào kiểm toán tài chính. involve (v) liên quan, tham gia vào", "explanation": "", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2022 - Đề Chẵn"}, {"id": "2022-chan-translate-en-vi-5", "type": "translation", "prompt": "The internal audit department reports directly to the president or board of directors.", "answer": "à Bộ phận kiểm toán nội bộ báo cáo trực tiếp với chủ tịch hoặc hội đồng quản trị.", "explanation": "", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2022 - Đề Chẵn"}, {"id": "2022-chan-translate-vi-en-1", "type": "translation", "prompt": "Kiểm soát chất lượng áp dụng cho nguồn nhân lực bao gồm các yêu cầu về đạo đức. à Quality control applied to human resources includes ethical requirements. nguồn nhân lực (n) human resources yêu cầu về đạo đức: ethical requirement Cấu trúc mệnh đề quan hệ rút gọn bằng V_ed: applied à bổ sung nghĩa cho quality control Động từ ở dạng bị động (kiểm soát chất lượng được áp dụng ) à lược bỏ đại từ quan hệ (which) và chuyển thành applied", "answer": "", "explanation": "", "needs_review": true, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2022 - Đề Chẵn"}, {"id": "2022-chan-translate-vi-en-2", "type": "translation", "prompt": "Các chính sách và thủ tục kiểm soát chất lượng phải được lập thành văn bản và được truyền đạt tới nhân sự của công ty. à Quality control policies and procedures must be documented and communicated to the", "answer": "company’s personnel. chính sách (n) policy thủ tục (n) procedure tạo thành văn bản (v) document truyền đạt/ phổ biến: communicate", "explanation": "", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2022 - Đề Chẵn"}, {"id": "2022-chan-translate-vi-en-3", "type": "translation", "prompt": "Bằng quy trình kiểm toán, kiểm toán viên nâng cao tính hữu ích và giá trị của các báo cáo tài chính, nhưng cũng làm tăng độ tin cậy của các thông tin chưa được kiểm toán khác do ban quản lý công bố. à Through audit process, the auditor improves the usefulness and value of the financial", "answer": "statements, but also increases the reliability of other unaudited information disclosed by management. độ tin cậy (n) reliability chưa được kiểm toán: unaudited công bố: disclose", "explanation": "", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2022 - Đề Chẵn"}, {"id": "2022-chan-translate-vi-en-4", "type": "translation", "prompt": "Nhiều công ty và tổ chức lớn duy trì đội ngũ nhân viên kiểm toán nội bộ. à Many big companies and organizations maintain internal audit staff. duy trì (v) maintain", "answer": "", "explanation": "", "needs_review": true, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2022 - Đề Chẵn"}, {"id": "2022-chan-translate-vi-en-5", "type": "translation", "prompt": "Kiểm toán viên nội bộ được các công ty tuyển dụng để điều tra và đánh giá hiệu quả của các hoạt động của công ty để quản lý. à Internal auditors are employed by companies to investigate and evaluate the effectiveness of the", "answer": "company's activities for management. điều tra (v) investigate đánh giá (v) evaluate Cấu trúc bị động: S + be + V + (by O) à kiểm toán viên nội bộ được các công ty tuyển dụng II", "explanation": "", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2022 - Đề Chẵn"}]}, {"year": "2022", "version": "le", "items": [{"id": "2022-le-vocab-1", "type": "fill_blank", "prompt": "In the future the public will have a wider _____ of television programs.", "answer": "choice", "explanation": "(Trong tương lai, công chúng sẽ có nhiều lựa chọn hơn về chương trình truyền hình)\n➔ choice (n): lựa chọn", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2022 - Đề Lẻ"}, {"id": "2022-le-vocab-2", "type": "fill_blank", "prompt": "Without his teacher’s _____ he would have given up long ago.", "answer": "Encouragement", "explanation": "(Nếu không có sự động viên của giáo viên thì anh ấy sẽ bỏ cuộc từ lâu)\n➔ Encouragement (n): sự động viên", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2022 - Đề Lẻ"}, {"id": "2022-le-vocab-3", "type": "fill_blank", "prompt": "Jane’s party was more of an endurance test _____ anything else.", "answer": "than anything else", "explanation": "(Bữa tiệc của Jane giống như một bài kiểm tra sức chịu đựng hơn bất cứ thứ gì khác)\n➔ than anything else: hơn bất cứ thứ gì khác", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2022 - Đề Lẻ"}, {"id": "2022-le-vocab-4", "type": "fill_blank", "prompt": "A full-scale _____ of our company is urgently needed.", "answer": "reorganization", "explanation": "(Việc tái cơ cấu toàn bộ công ty chúng tôi là rất cần thiết)\n➔ reorganization (n): tái cơ cấu", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2022 - Đề Lẻ"}, {"id": "2022-le-vocab-5", "type": "fill_blank", "prompt": "I need a _____ to put the leftovers in.", "answer": "container", "explanation": "(Tôi cần một hộp để bỏ thức ăn thừa vào)\n➔ container (n) hộp, thùng chứa", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2022 - Đề Lẻ"}, {"id": "2022-le-vocab-6", "type": "fill_blank", "prompt": "He was so embarrassed that he wanted to _____", "answer": "disappear", "explanation": "S + want to + V: muốn làm gì đó\n(Anh ấy xấu hổ đến mức anh ấy muốn biến mất)\n➔ disappear (v) biến mất", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2022 - Đề Lẻ"}, {"id": "2022-le-vocab-7", "type": "fill_blank", "prompt": "I _____ the food from the fridge because it smelled bad.", "answer": "Removed", "explanation": "(Tôi bỏ đi đồ ăn từ tủ lạnh vì nó có mùi khó chịu)\nto remove something from something: loại bỏ cái gì từ một cái gì đó\n➔ Removed (Ved): loại bỏ", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2022 - Đề Lẻ"}, {"id": "2022-le-vocab-8", "type": "fill_blank", "prompt": "The artist hoped to _____ her paintings in galleries worldwide.", "answer": "exhibit", "explanation": "S + hope to + V: ai đó hy vọng điều gì đó có thể xảy ra\n(Người nghệ sỹ đã hy vọng có thể trưng bày những bức tranh của mình ở các phòng trưng bày\ntrên toàn thế giới)\n➔ exhibit (v) trưng bày, triển lãm", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2022 - Đề Lẻ"}, {"id": "2022-le-vocab-9", "type": "fill_blank", "prompt": "There are a lot of _____ in Africa.", "answer": "nations", "explanation": "(Có rất nhiều quốc gia ở Châu Phi)\n➔ nations (n) quốc gia", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2022 - Đề Lẻ"}, {"id": "2022-le-vocab-10", "type": "fill_blank", "prompt": "His little sister got in trouble for her bad _____", "answer": "behavior", "explanation": "(Em gái của anh ấy gặp rắc rối vì hành vi xấu của mình)\n➔ behavior (n) hành vi", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2022 - Đề Lẻ"}, {"id": "2022-le-vocab-11", "type": "fill_blank", "prompt": "My dad got a new tie with red and blue _____ on it.", "answer": "stripes", "explanation": "(Bố tôi đã có một chiếc cà vạt mới với những sọc đỏ, xanh)\n➔ stripes (n) sọc", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2022 - Đề Lẻ"}, {"id": "2022-le-vocab-12", "type": "fill_blank", "prompt": "Clean your cut carefully so you don’t get a(n) _____", "answer": "infection", "explanation": "(Làm sạch vết cắt của bạn thật cẩn thận nếu bạn không muốn bị nhiễm trùng)\n➔ infection (n) sự nhiễm trùng", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2022 - Đề Lẻ"}, {"id": "2022-le-vocab-13", "type": "fill_blank", "prompt": "It was just a(n) _____ that we were both on the bus together.", "answer": "coincidence", "explanation": "(Thật là trùng hợp khi cả hai chúng tôi cùng đi xe buýt)\n➔ coincidence (n) sự trùng hợp ngẫu nhiên", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2022 - Đề Lẻ"}, {"id": "2022-le-vocab-14", "type": "fill_blank", "prompt": "He is a _____ - paid senior executive.", "answer": null, "explanation": "(Anh ấy là một giám đốc điều hành cấp cao có thu nhập cao)\nhighly – paid (adj) thu nhập cao\nhighly (adj): cao", "needs_review": true, "section": "vocab", "section_label": "Từ vựng - Collocati otter days (8). In winter, this part is tilted away from the sun (9) . This\nmeans that we get less sunlight and our days are colder(10)! Our seasons change because the earth\nmoves throughout the year(11).", "prompt": "What season does the northern part of the earth experience when it is tilted toward the sun?", "answer": "It’s summer when the northern part of the earth is tilted toward the sun(7)", "explanation": "", "needs_review": false, "section": "reading-open", "section_label": "Đọc hiểu - Trả lời câu hỏi", "exam_label": "CPA 2022 - Đề Lẻ"}, {"id": "2022-le-reading-open-5", "type": "open_short_answer", "passage": "Read the passage and answer the questions:\nSeasons are different because the earth travels around the sun(1). This is called the earth's orbit\n(2). As the earth orbits, it is also tilted (3). That means that the earth doesn't stand up straight (4). So\nwhen the earth moves, we get different amounts of sunlight (5).\nImagine we are in the northern part of the earth (6). In summer, this part is tilted toward the sun (7).\nSo we have more sunlight and hotter days (8). In winter, this part is tilted away from the sun (9) . This\nmeans that we get less sunlight and our days are colder(10)! Our seasons change because the earth\nmoves throughout the year(11).", "prompt": "What does it mean when we say the earth is tilted?", "answer": "That means that the earth doesn’t stand up straight(3),(4)", "explanation": "", "needs_review": false, "section": "reading-open", "section_label": "Đọc hiểu - Trả lời câu hỏi", "exam_label": "CPA 2022 - Đề Lẻ"}, {"id": "2022-le-reading-mcq-1", "type": "mcq", "passage": "Read the passage carefully and choose ONE which you think fits best\nSome of the earliest forms of metal coins appeared in China around 1000 B.C(1). Silver coins\nstarted to be made in Turkey around 600 B.C (2). Soon after, the techniques for making coins were\ncopied and improved by the Greek and Roman empires (3).\nLater, paper money was developed and used in China around A.D. 800(4). Coins were heavy\nand bulky, so carrying lots of money was not easy (5). Paper money solved this problem (6). Now\nmost countries use both paper and coin money(7). Furthermore, in this digital age, people can buy\nthings without paper money by using a credit card (8). In the future, it is likely that an even more\nadvanced form of money will be used (9).", "prompt": "What is this passage mainly about?", "options": [{"label": "A", "text": "why paper money is better than coins"}, {"label": "B", "text": "how the barter system caused problems"}, {"label": "C", "text": "how money was first created and developed"}, {"label": "D", "text": "how trade was developed between countries"}], "answer": null, "explanation": "What is this passage mainly about?\na. why paper money is better than coins\nb. how the barter system caused problems\nc. how money was first created and developed\nd. how trade was developed between countries", "needs_review": true, "section": "reading-mcq", "section_label": "Đọc hiểu - Trắc nghiệm", "exam_label": "CPA 2022 - Đề Lẻ"}, {"id": "2022-le-reading-mcq-2", "type": "mcq", "passage": "Read the passage carefully and choose ONE which you think fits best\nSome of the earliest forms of metal coins appeared in China around 1000 B.C(1). Silver coins\nstarted to be made in Turkey around 600 B.C (2). Soon after, the techniques for making coins were\ncopied and improved by the Greek and Roman empires (3).\nLater, paper money was developed and used in China around A.D. 800(4). Coins were heavy\nand bulky, so carrying lots of money was not easy (5). Paper money solved this problem (6). Now\nmost countries use both paper and coin money(7). Furthermore, in this digital age, people can buy\nthings without paper money by using a credit card (8). In the future, it is likely that an even more\nadvanced form of money will be used (9).", "prompt": "What country is mentioned as having used the first metal coins?", "options": [{"label": "A", "text": "Turkey"}, {"label": "B", "text": "China"}, {"label": "C", "text": "Greece"}, {"label": "D", "text": "Rome"}], "answer": "B", "explanation": "What country is mentioned as having used the first metal coins?\na. Turkey b. China(1) c. Greece d. Rome", "needs_review": false, "section": "reading-mcq", "section_label": "Đọc hiểu - Trắc nghiệm", "exam_label": "CPA 2022 - Đề Lẻ"}, {"id": "2022-le-reading-mcq-3", "type": "mcq", "passage": "Read the passage carefully and choose ONE which you think fits best\nSome of the earliest forms of metal coins appeared in China around 1000 B.C(1). Silver coins\nstarted to be made in Turkey around 600 B.C (2). Soon after, the techniques for making coins were\ncopied and improved by the Greek and Roman empires (3).\nLater, paper money was developed and used in China around A.D. 800(4). Coins were heavy\nand bulky, so carrying lots of money was not easy (5). Paper money solved this problem (6). Now\nmost countries use both paper and coin money(7). Furthermore, in this digital age, people can buy\nthings without paper money by using a credit card (8). In the future, it is likely that an even more\nadvanced form of money will be used (9).", "prompt": "What is NOT true about paper money?", "options": [{"label": "A", "text": "It was created after the invention of coins."}, {"label": "B", "text": "It was first made in Turkey and improved in Greece (2,3 – it’s about sliver coins, not paper\nmoney)."}, {"label": "C", "text": "It made it possible for people to carry lots of money(5,6)."}, {"label": "D", "text": "Before the Tang Dynasty, people did not use paper money. (4)\n(đề bài không nhắc đến thời nhà Đường, tuy nhiên khoảng thời gian 800 trước công nguyên khi tiền\ngiấy được bắt đầu được sử dụng là ở thời nhà Đường, do đó đáp án này là đáp án đúng)."}], "answer": null, "explanation": "What is NOT true about paper money?\na. It was created after the invention of coins. (3)\nb. It was first made in Turkey and improved in Greece (2,3 – it’s about sliver coins, not paper\nmoney).\nc. It made it possible for people to carry lots of money(5,6).\nd. Before the Tang Dynasty, people did not use paper money. (4)\n(đề bài không nhắc đến thời nhà Đường, tuy nhiên khoảng thời gian 800 trước công nguyên khi tiền\ngiấy được bắt đầu được sử dụng là ở thời nhà Đường, do đó đáp án này là đáp án đúng).", "needs_review": true, "section": "reading-mcq", "section_label": "Đọc hiểu - Trắc nghiệm", "exam_label": "CPA 2022 - Đề Lẻ"}, {"id": "2022-le-reading-mcq-4", "type": "mcq", "passage": "Read the passage carefully and choose ONE which you think fits best\nSome of the earliest forms of metal coins appeared in China around 1000 B.C(1). Silver coins\nstarted to be made in Turkey around 600 B.C (2). Soon after, the techniques for making coins were\ncopied and improved by the Greek and Roman empires (3).\nLater, paper money was developed and used in China around A.D. 800(4). Coins were heavy\nand bulky, so carrying lots of money was not easy (5). Paper money solved this problem (6). Now\nmost countries use both paper and coin money(7). Furthermore, in this digital age, people can buy\nthings without paper money by using a credit card (8). In the future, it is likely that an even more\nadvanced form of money will be used (9).", "prompt": "What can be inferred from this passage?", "options": [{"label": "A", "text": "Coins will be made of plastic in the future."}, {"label": "B", "text": "Money will continue to develop and change"}, {"label": "C", "text": "People usually traded animals in the barter system."}, {"label": "D", "text": "The idea of credit cards was first developed in Greece."}], "answer": "B", "explanation": "What can be inferred from this passage?\na. Coins will be made of plastic in the future.\nb. Money will continue to develop and change (9).\nc. People usually traded animals in the barter system.\nd. The idea of credit cards was first developed in Greece.", "needs_review": false, "section": "reading-mcq", "s 22 - Đề Lẻ"}, {"id": "2022-le-translate-en-vi-2", "type": "translation", "prompt": "Auditors have the responsibility of considering certain financial statement disclosures connected with the financial statements.", "answer": "Kiểm toán viên có trách nhiệm xem xét thuyết minh liên quan đến một số chỉ tiêu nhất định trên BCTC.", "explanation": "", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2022 - Đề Lẻ"}, {"id": "2022-le-translate-en-vi-3", "type": "translation", "prompt": "The law requires that each annual report of a company contain an internal control report.", "answer": "Luật yêu cầu mỗi báo cáo thường niên của công ty phải bao gồm một báo cáo kiểm soát nội bộ. annual report (n) báo cáo thường niên internal control report (n) báo cáo kiểm soát nội bộ", "explanation": "", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2022 - Đề Lẻ"}, {"id": "2022-le-translate-en-vi-4", "type": "translation", "prompt": "Each public accounting firm that prepares the audit report according to Audit Standard #2 must report on the assessment made by the management.", "answer": "Mỗi công ty kiểm toán lập báo cáo kiểm toán theo Chuẩn mực kiểm toán số 2 phải báo cáo về đánh giá của ban giám đốc.", "explanation": "", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2022 - Đề Lẻ"}, {"id": "2022-le-translate-en-vi-5", "type": "translation", "prompt": "Companies must disclose all off-balance sheet transactions.", "answer": "Doanh nghiệp phải công bố tất cả các giao dịch ngoài bảng cân đối kế toán. disclose (v) công bố, công khai off-balance sheet (n) ngoài bảng cân đối kế toán", "explanation": "", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2022 - Đề Lẻ"}, {"id": "2022-le-translate-vi-en-1", "type": "translation", "prompt": "Ở một số quốc gia, chẳng hạn như Đức, hội đồng quản trị nhận được một báo cáo đặc biệt dài hơn và chi tiết hơn nhiều so với ý kiến kiểm toán.", "answer": "In some countries, such as Germany, the board of director receives a special report that is much longer and more detailed than the audit opinion./ hội đồng quản trị(n) Board of Management, board of director, Administrative Council", "explanation": "", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2022 - Đề Lẻ"}, {"id": "2022-le-translate-vi-en-2", "type": "translation", "prompt": "Ngân hàng phải tự bảo vệ mình trước những rủi ro này.", "answer": "Banks must protect themselves against/from these risks Protect against/from (v) bảo vệ, giúp né tránh khỏi một vật, tác nhân nào đó", "explanation": "", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2022 - Đề Lẻ"}, {"id": "2022-le-translate-vi-en-3", "type": "translation", "prompt": "Một ví dụ nổi tiếng là rủi ro tín dụng, tức là rủi ro con nợ không trả nợ.", "answer": "A well-known example is credit risk, i.e. the risk of default by a debtor. nổi tiếng: well-known sự vỡ nợ (n): default", "explanation": "", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2022 - Đề Lẻ"}, {"id": "2022-le-translate-vi-en-4", "type": "translation", "prompt": "Đây là một bài học quan trọng cho các doanh nghiệp.", "answer": "This is an important lesson for businesses.", "explanation": "", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2022 - Đề Lẻ"}, {"id": "2022-le-translate-vi-en-5", "type": "translation", "prompt": "Công ty định kỳ cần phải có báo cáo kiểm toán.", "answer": "The company needs to have an audit report periodically. định kỳ (adj): perodically", "explanation": "", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2022 - Đề Lẻ"}]}, {"year": "2023", "version": "chan", "items": [{"id": "2023-chan-vocab-1", "type": "fill_blank", "prompt": "My friend was lucky to survive the plane _____.", "answer": "crash", "explanation": "(Bạn tôi đã may mắn sống sót sau vụ tai nạn máy bay.)\n➔ Survive a crash (v): sống sót sau một vụ tai nạn", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2023 - Đề Chẵn"}, {"id": "2023-chan-vocab-2", "type": "fill_blank", "prompt": "The _____ on insects help them touch and smell things.", "answer": "antennae", "explanation": "(Râu của côn trùng giúp chúng chạm vào và ngửi thấy mọi thứ.)\n➔ Antennae (n): râu của côn trùng/ ăng-ten (ti-vi)", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2023 - Đề Chẵn"}, {"id": "2023-chan-vocab-3", "type": "fill_blank", "prompt": "World War I began because of the _____ of Franz Ferdinand.", "answer": "assassination", "explanation": "Thế chiến thứ nhất bắt đầu vì vụ ám sát Franz Ferdinand.\n➔ Assassination (n): vụ ám sát", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2023 - Đề Chẵn"}, {"id": "2023-chan-vocab-4", "type": "fill_blank", "prompt": "It was a cloudy day until the sun _____ from behind the clouds.", "answer": "emerged", "explanation": "(Đó là một ngày nhiều mây cho đến khi mặt trời ló dạng sau những đám mây.)\n➔ Emerge (v): xuất hiện/ ló dạng (mặt trời)", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2023 - Đề Chẵn"}, {"id": "2023-chan-vocab-5", "type": "fill_blank", "prompt": "Mountain climbers need to bring lots of _____ so they can climb well.", "answer": "equipment", "explanation": "(Những người leo núi cần mang theo nhiều thiết bị để họ có thể leo trèo tốt.)\n➔ equipment (n): thiết bị ( không đếm được)", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2023 - Đề Chẵn"}, {"id": "2023-chan-vocab-6", "type": "fill_blank", "prompt": "The new skyscraper they are building is _____!", "answer": "enormous", "explanation": "(Tòa nhà chọc trời mới mà họ đang xây dựng to khổng lồ!)\n➔ Enormous (v): khổng lồ", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2023 - Đề Chẵn"}, {"id": "2023-chan-vocab-7", "type": "fill_blank", "prompt": "The ice _____ a lot faster that winter than anyone expected.", "answer": "froze", "explanation": "(Mùa đông năm đó nước đóng băng nhanh hơn rất nhiều so với dự đoán của mọi người.\n➔ Froze (v) đóng băng ( quá khứ của freeze)", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2023 - Đề Chẵn"}, {"id": "2023-chan-vocab-8", "type": "fill_blank", "prompt": "Many animals have to _____ as their environments change.", "answer": "adapt", "explanation": "(Nhiều loài động vật phải thích nghi khi môi trường sống của chúng thay đổi.)\n➔ Adapt (v): thích nghi (với môi trường/ hoàn cảnh)\n➔ Have to + V (v): phải làm gì", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2023 - Đề Chẵn"}, {"id": "2023-chan-vocab-9", "type": "fill_blank", "prompt": "We need to _____ some new workers for the project.", "answer": "hire", "explanation": "(Chúng ta cần thuê một số công nhân mới cho dự án.)\n➔ Hire (v): thuê/ tuyển dụng (người)\n➔ Need to + V (v): cần làm gì", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2023 - Đề Chẵn"}, {"id": "2023-chan-vocab-10", "type": "fill_blank", "prompt": "He doesn't snore as _____ as you do.", "answer": "loudly", "explanation": "(Anh ấy không ngáy to như bạn.)\n➔ snore loudly(v): ngáy to", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2023 - Đề Chẵn"}, {"id": "2023-chan-vocab-11", "t pt": "wanted/there grew,/their wastes/a more advanced/people/to get rid of/system/as/the cities", "answer": "As the cities there grew, people wanted a more advanced system to get rid of their wastes.", "explanation": "➔ To get rid of + N: thoát khỏi/ xử lý cái gì", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2023 - Đề Chẵn"}, {"id": "2023-chan-sentence-build-10", "type": "sentence_building", "prompt": "special treatment/again/it/usable/clean and/to make/needs/the wastewater", "answer": "The wastewater needs the special treatment to make it clean and usable again.", "explanation": "➔ Cấu trúc với need: S + need + O + to V: cần cái gì để làm cái gì", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2023 - Đề Chẵn"}, {"id": "2023-chan-transform-1", "type": "sentence_transformation", "prompt": "\"Why don't you put a better lock on the door, John?” said Mary.", "answer": "Mary suggested that John (should) put a better lock on the door.", "explanation": "➔ Cấu trúc viết lại câu gợi ý:\nShall we + V\nLet’s + V\nHow/What about + V_ing\nWhy don’t we + V\nS + suggest + that + S + V or S + suggest + V_ing\nIn my opinion, S + V", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2023 - Đề Chẵn"}, {"id": "2023-chan-transform-2", "type": "sentence_transformation", "prompt": "In the end, I couldn't make it to the party because I was busy.", "answer": "In the end, I wasn't able to go / (to make it) to the party because I was busy.", "explanation": "➔ Could + V = to be able to do + V: có thể làm gì\n➔ Could not + V = to be unable/ to be not able + to do + V: không thể làm gì", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2023 - Đề Chẵn"}, {"id": "2023-chan-transform-3", "type": "sentence_transformation", "prompt": "At school, she was the fastest runner in her class.", "answer": "At school, she could run faster than anyone else in her class.", "explanation": "➔ Cấu trúc viết lại câu từ so sánh nhất thành so sánh hơn:\nS + to be + the + (most + adj)/adj-est + N.\nS + V + (more + adj)/adj-er + than + any + N.", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2023 - Đề Chẵn"}, {"id": "2023-chan-transform-4", "type": "sentence_transformation", "prompt": "It wasn't necessary for us to attend all the classes.", "answer": "We didn't have to attend all the classes.", "explanation": "➔ Cấu trúc: It + to be + necessary for + N + to + V\nS+ don’t/ doesn’t/ didn’t have to/ need to + V", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2023 - Đề Chẵn"}, {"id": "2023-chan-transform-5", "type": "sentence_transformation", "prompt": "I took a lot of suntan oil with me, which I didn't use.", "answer": "I needn't have taken so much suntan oil with me.", "explanation": "➔ Cấu trúc: S + needn’t have + V3/ Ved +…: đáng lẽ không phải làm gì (hối tiếc về 1 sự việc đã xảy\nra trong quá khứ.)", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2023 - Đề Chẵn"}, {"id": "2023-chan-translate-en-vi-1", "type": "translation", "prompt": "To practice auditing, auditors must have an auditor certificate according to Vietnamese law.", "answer": "Để hành nghề kiểm toán, các kiểm toán viên phải có chứng chỉ kiểm toán viên theo quy định pháp luật Việt Nam.", "explanation": "", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2023 - Đề Chẵn"}, {"id": "2023-chan-translate-en-vi-2", "type": "translation", "prompt": "Auditors must pass an exam on Vietnamese law.", "answer": "Các kiểm toán viên phải vượt qua một bài kiểm tra về pháp luật Việt Nam.", "explanation": "", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2023 - Đề Chẵn"}, {"id": "2023-chan-translate-en-vi-3", "type": "translation", "prompt": "Which auditing company is reputable today in Vietnam?", "answer": "Công ty kiểm toán nào có uy tín ở Việt Nam hiện nay?", "explanation": "", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2023 - Đề Chẵn"}, {"id": "2023-chan-translate-en-vi-4", "type": "translation", "prompt": "An audit plan is a list of the audit procedures that auditors need to perform to gather sufficient appropriate evidence on which to base their opinion on the financial statements.", "answer": "Kế hoạch kiểm toán là một danh sách các thủ tục kiểm toán mà kiểm toán viên cần thực hiện để thu thập đầy đủ bằng chứng thích hợp để làm cơ sở cho ý kiến của mình về báo cáo tài chính.", "explanation": "", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2023 - Đề Chẵn"}, {"id": "2023-chan-translate-en-vi-5", "type": "translation", "prompt": "We began a new audit program focused on ensuring electricity providers are complying with the law.", "answer": "Chúng tôi đã bắt đầu một chương trình kiểm toán mới tập trung vào việc đảm bảo các nhà cung cấp điện tuân thủ pháp luật.", "explanation": "", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2023 - Đề Chẵn"}, {"id": "2023-chan-translate-vi-en-1", "type": "translation", "prompt": "Chuẩn mực kiểm toán là những nguyên tắc để các thành viên tuân theo và làm cơ sở đánh giá chất lượng công việc.", "answer": "Auditing standards are principles for members to follow and serve as a basis for evaluating the work quality.", "explanation": "", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2023 - Đề Chẵn"}, {"id": "2023-chan-translate-vi-en-2", "type": "translation", "prompt": "Kiểm toán nội bộ được áp dụng trong nội bộ công ty, người thực hiện kiểm toán là nhân viên trong công ty và làm việc dưới sự chỉ đạo của cấp trên.", "answer": "Internal audit is applied within the company, and the auditor is an employee of the company who works under the direction of superiors.", "explanation": "", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2023 - Đề Chẵn"}, {"id": "2023-chan-translate-vi-en-3", "type": "translation", "prompt": "Kiểm toán độc lập được thực hiện bởi các công ty độc lập chuyên cung cấp dịch vụ kiểm toán.", "answer": "Independent audit is conducted by independent companies specializing in providing auditing services.", "explanation": "", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2023 - Đề Chẵn"}, {"id": "2023-chan-translate-vi-en-4", "type": "translation", "prompt": "Nhiệm vụ chính của các kiểm toán viên là kiểm toán những báo cáo tài chính.", "answer": "The main task of auditors is to audit financial statements.", "explanation": "", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2023 - Đề Chẵn"}, {"id": "2023-chan-translate-vi-en-5", "type": "translation", "prompt": "Các công ty kiểm toán độc lập thường nhận được sự tin cậy của bên thứ ba hoặc nhà đầu tư.", "answer": "The independent auditing companies often receive the trust of third parties or investors.", "explanation": "", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2023 - Đề Chẵn"}]}, {"year": "2023", "version": "le", "items": [{"id": "2023-le-vocab-1", "type": "fill_blank", "prompt": "He had to _____ all the papers and give them to the teacher.", "answer": "collect", "explanation": "(Anh ấy phải thu thập tất cả các bài tập và nộp cho giáo viên.)\n➔ Collect (v) : thu thập", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2023 - Đề Lẻ"}, {"id": "2023-le-vocab-2", "type": "fill_blank", "prompt": "Dinosaurs _____ from the earth millions of years ago.", "answer": "disappeared", "explanation": "(Khủng long đã biến mất khỏi trái đất/ tuyệt chủng hàng triệu năm trước.)\n➔ Disappear from (v) : biến mất khỏi", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2023 - Đề Lẻ"}, {"id": "2023-le-vocab-3", "type": "fill_blank", "prompt": "They have plenty of _____ in their living room.", "answer": "space", "explanation": "(Họ có nhiều không gian trong phòng khách.)\n➔ Plenty of : nhiều", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2023 - Đề Lẻ"}, {"id": "2023-le-vocab-4", "type": "fill_blank", "prompt": "Mark had a sore throat, a runny nose, and a _____.", "answer": "cough", "explanation": "(Mark bị đau họng, sổ mũi và ho.)\n➔ Have a cough (v) : bị ho", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2023 - Đề Lẻ"}, {"id": "2023-le-vocab-5", "type": "fill_blank", "prompt": "She needed to wash off her shoes because they were muddy.", "answer": null, "explanation": "(Cô ấy cần phải rửa giày vì chúng bị lấm bùn.)\n➔ Wash off (v) : rửa", "needs_review": true, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2023 - Đề Lẻ"}, {"id": "2023-le-vocab-6", "type": "fill_blank", "prompt": "He was a great hero in _____ history.", "answer": "ancient", "explanation": "(Anh ấy là một anh hùng vĩ đại trong lịch sử cổ đại.)\n➔ Ancient (adj) : cổ xưa/ cổ đại/ cổ kính", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2023 - Đề Lẻ"}, {"id": "2023-le-vocab-7", "type": "fill_blank", "prompt": "The students did some _____ in the science lab.", "answer": "experiments", "explanation": "(Các học sinh đã làm một số thí nghiệm trong phòng thí nghiệm khoa học.)\n➔ Do experiment (v) : làm thí nghiệm", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2023 - Đề Lẻ"}, {"id": "2023-le-vocab-8", "type": "fill_blank", "prompt": "When it rained, water started to _____ from the ceiling.", "answer": "drip", "explanation": "(Khi trời mưa, nước bắt đầu nhỏ giọt từ trần nhà.)\n➔ Start to + V (v) : bắt đầu làm gì đó", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2023 - Đề Lẻ"}, {"id": "2023-le-vocab-9", "type": "fill_blank", "prompt": "I stretched out my arm to _____ the book on the shelf.", "answer": "reach", "explanation": "(Tôi duỗi tay ra để với lấy cuốn sách trên kệ.)\n➔ stretch out + O + to V : vươn/ duỗi … để làm gì đó", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2023 - Đề Lẻ"}, {"id": "2023-le-vocab-10", "type": "fill_blank", "prompt": "It is _____ to finish all of this homework by tomorrow morning.", "answer": "impossible", "explanation": "(Không thể hoàn thành hết bài tập về nhà này trước sáng mai.)\n➔ It is impossible (for somebody) to do something: Ai đó không thể làm gì", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2023 - Đề Lẻ"}, {"id": "2023-le-vocab-11", "type": "fill_blank", "prompt": "They spoke very highly of him.", "answer": null, "explanation": "(Họ nói rất tốt về anh ấy.)\n➔ Speak highly of somebody (v) : nói tốt về ai đó", "needs_review": true, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2023 - Đề Lẻ"}, {"id": "2023-le-vocab-12", "type": "fill_blank", "prompt": "She was very much impressed _____ their good manners.", "answer": "by", "explanation": "(Cô ấy rất ấn tượng với cách cư xử tốt của họ.)\n➔ Be impressed by (v) : bị ấn tượng về…", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2023 - Đề Lẻ"}, { explanation": "S + V + adv + mệnh đề\n➔ Loud (adj): lớn ( chỉ âm thanh)\n➔ Loudly (adv): một cách lớn", "needs_review": true, "section": "wordform", "section_label": "Từ loại (Word Formation)", "exam_label": "CPA 2023 - Đề Lẻ"}, {"id": "2023-le-wordform-4", "type": "fill_blank", "prompt": "She works 60 hours a week so, needless to say, she is often tired. (NEED)", "answer": null, "explanation": "➔ Needless to say: rõ ràng/ hiển nhiên là", "needs_review": true, "section": "wordform", "section_label": "Từ loại (Word Formation)", "exam_label": "CPA 2023 - Đề Lẻ"}, {"id": "2023-le-wordform-5", "type": "fill_blank", "prompt": "Before you begin, be sure the lamp is disconnected from the wall plug. (CONNECT)", "answer": null, "explanation": "➔ Disconnect + N+ from + N: ngắt kết nối cái gì khỏi cái gì", "needs_review": true, "section": "wordform", "section_label": "Từ loại (Word Formation)", "exam_label": "CPA 2023 - Đề Lẻ"}, {"id": "2023-le-sentence-build-1", "type": "sentence_building", "prompt": "the diets/are/ animals/also/ part of/an important/of other/insects", "answer": "Insects are also an important part of the diets of other animals.", "explanation": "➔ To be/ play an important part of …. (v) : đóng vai trò quan trọng trong…", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2023 - Đề Lẻ"}, {"id": "2023-le-sentence-build-2", "type": "sentence_building", "prompt": "nine billion by /estimated that/the year 2050/the earth's population/will reach/it is", "answer": "It is estimated that the earth's population will reach nine billion by the year 2050.", "explanation": "➔ It is estimated that + (mệnh đề) : Nó được ước tính rằng….", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2023 - Đề Lẻ"}, {"id": "2023-le-sentence-build-3", "type": "sentence_building", "prompt": "a pile/cover/your body /a blanket,/of leaves/if/don't have/instead/with/you", "answer": "If you don't have a blanket, cover your body with a pile of leaves instead.", "explanation": "➔ If + S + V, (S) + V….: nếu… thì….( trong trường hợp này chủ ngữ đã được rút gọn).4.\nadvantages of/some/here are/having two eyes\nHere are some advantages of having two eyes.\n➔ Advantage of + V-ing: lợi ích của việc…", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2023 - Đề Lẻ"}, {"id": "2023-le-sentence-build-4", "type": "sentence_building", "prompt": "see/in slow motion/can/they/most movements", "answer": "They can see most movements in slow motion.", "explanation": "➔ Most movements: hầu hết các hành động.\n➔ Slow motion: chuyển động chậm", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2023 - Đề Lẻ"}, {"id": "2023-le-sentence-build-5", "type": "sentence_building", "prompt": "very cold/water/turns into ice/ when it becomes", "answer": "Water turns into ice when it becomes very cold.", "explanation": "➔ Turn into (v): chuyển thành/ hóa thành", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2023 - Đề Lẻ"}, {"id": "2023-le-sentence-build-6", "type": "sentence_building", "prompt": "area/glacier is/a/of ice/a massive", "answer": "A glacier is a massive area of ice.", "explanation": "➔ Massive area (n) : vùng rộng lớn", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2023 - Đề Lẻ"}, {"id": "2023-le-sentence-build-7", "type": "sentence_building", "prompt": "she/and feeds it/care of/takes/the baby", "answer": "She takes care of the baby and feeds it.", "explanation": "➔ Take care of (v) : chăm sóc\n➔ Feed (v): cho ăn", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2023 - Đề Lẻ"}, {"id": "2023-le-sentence-build-8", "type": "sentence_building", "prompt": "to dive/wanted/deep into/the ocean/Tom Hanson", "answer": "Tom Hanson wanted to dive deep into the ocean.", "explanation": "➔ Dive deep into the ocean (v) : lặn sâu xuống biển", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2023 - Đề Lẻ"}, {"id": "2023-le-sentence-build-9", "type": "sentence_building", "prompt": "the movement/pushed/into the organ/of the sea/air", "answer": "The movement of the sea pushed air into the organ.", "explanation": "➔ The movement of (n) : sự chuyển động của…\n➔ Push something into something (v): đẩy cái gì vào cái gì….", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2023 - Đề Lẻ"}, {"id": "2023-le-transform-1", "type": "sentence_transformation", "prompt": "Her grandparents raised her as her parents died when she was four.", "answer": "She was brought up by her grandparents as her parents died when she was four.", "explanation": "➔ To be raised by = to be brought up by (v) : được nuôi lớn bởi…", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2023 - Đề Lẻ"}, {"id": "2023-le-transform-2", "type": "sentence_transformation", "prompt": "If you don't stop misbehaving, I'll have to ask you to leave the room.", "answer": "If you carry on misbehaving, I'll have to ask you to leave the room.", "explanation": "➔ Not stop = Carry on + V-ing (v) : Tiếp tục làm gì đó", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2023 - Đề Lẻ"}, {"id": "2023-le-transform-3", "type": "sentence_transformation", "prompt": "We didn't go to bed early because we were chatting.", "answer": "We stayed up late, because we were chatting.", "explanation": "➔ Mệnh đề 1 + because + mệnh đề 2 (n) : … vì….", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2023 - Đề Lẻ"}, {"id": "2023-le-transform-4", "type": "sentence_transformation", "prompt": "I was late because of the heavy traffic.", "answer": "I was held up by the heavy traffic.", "explanation": "➔ To be held up by (v) : bị giữ chân bởi…", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2023 - Đề Lẻ"}, {"id": "2023-le-transform-5", "type": "sentence_transformation", "prompt": "The performance has been cancelled.", "answer": "They've called off the performance.", "explanation": "➔ Cancel = call off (v) : hủy bỏ", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2023 - Đề Lẻ"}, {"id": "2023-le-translate-en-vi-1", "type": "translation", "prompt": "To practice auditing, auditors must have an auditor certificate recognized by the Ministry of Finance.", "answer": "Để hành nghề kiểm toán, kiểm toán viên phải có chứng chỉ kiểm toán viên được công nhận bởi Bộ Tài Chính.", "explanation": "", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2023 - Đề Lẻ"}, {"id": "2023-le-translate-en-vi-2", "type": "translation", "prompt": "Independent auditing companies provide a number of financial and economic services, depending on the customer's requirements.", "answer": "Các công ty kiểm toán độc lập cung cấp một số dịch vụ về tài chính và kinh tế, tùy thuộc theo các yêu cầu của khách hàng.", "explanation": "", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2023 - Đề Lẻ"}, {"id": "2023-le-translate-en-vi-3", "type": "translation", "prompt": "Audit results have a great influence on business entities and investors who are interested in the financial situation.", "answer": "Kết quả kiểm toán có sức ảnh hưởng lớn đến doanh nghiệp và các nhà đầu tư đang quan tâm đến tình hình tài chính.", "explanation": "", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2023 - Đề Lẻ"}, {"id": "2023-le-translate-en-vi-4", "type": "translation", "prompt": "State Audit is performed by the State audit agency.", "answer": "Kiểm toán Nhà nước được thực hiện bởi cơ quan kiểm toán Nhà nước.", "explanation": "", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2023 - Đề Lẻ"}, {"id": "2023-le-translate-en-vi-5", "type": "translation", "prompt": "Internal audit is conducted by internal auditors at the request of the Board of Directors.", "answer": "Kiểm toán nội bộ được thực hiện bởi các kiểm toán viên nội bộ theo yêu cầu của ban Giám đốc.", "explanation": "", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2023 - Đề Lẻ"}, {"id": "2023-le-translate-vi-en-1", "type": "translation", "prompt": "Kiểm toán là hoạt động kiểm tra, xác minh tính trung thực, chính xác cúa báo cáo tài chính.", "answer": "Auditing is the activity of checking and verifying the truthfulness and accuracy of financial statements.", "explanation": "", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2023 - Đề Lẻ"}, {"id": "2023-le-translate-vi-en-2", "type": "translation", "prompt": "Báo cáo tài chính bao gồm bảng cân đối kế toán, báo cáo thu nhập, báo cáo thay đổi vốn chủ sở hữu, báo cáo lưu chuyển tiền tệ, và các thuyết minh khác.", "answer": "Financial statements include the balance sheet, income statement, statement of changes in equity, statement of cash flows, and other notes/disclosures.", "explanation": "", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2023 - Đề Lẻ"}, {"id": "2023-le-translate-vi-en-3", "type": "translation", "prompt": "Có 3 loại kiểm toán phổ biến là: Kiểm toán Nhà nước, Kiểm toán độc lập, và Kiểm toán nội bộ.", "answer": "There are 3 common types of audits: State Audit, Independent audit, and Internal audit.

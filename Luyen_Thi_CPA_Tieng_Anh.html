PA 2017 - Đề Lẻ"}, {"id": "2017-le-translate-en-vi-8", "type": "translation", "prompt": "Thị trường chứng khoán rất rủi ro, không dành cho những quyết định bất cẩn", "answer": "The stock market is very risky, so it is not for the careless decisions.", "explanation": "", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2017 - Đề Lẻ"}, {"id": "2017-le-translate-en-vi-9", "type": "translation", "prompt": "Hoạt động của một doanh nghiệp phụ thuộc vào nhu cầu của thị trường đối với hàng hoá của doanh nghiệp đó và các điều kiện của nền kinh tế.", "answer": "The operation of a business depends on the market demand for its goods and on the conditions of the economy.", "explanation": "", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2017 - Đề Lẻ"}, {"id": "2017-le-translate-en-vi-10", "type": "translation", "prompt": "Năm qua, thị trường tài chính có sự chuyển biến tích cực như bớt phụ thuộc vào hệ thống tổ chức tín dụng, vai trò của thị trường vốn gia tăng trong việc huy động vốn cho nên kinh tế.", "answer": "Last year, the financial market had a positive change such as less relying on credit institutions, increasing the role of the capital market in raising capital for the economy. rely on (v) phụ thuộc vào", "explanation": "", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2017 - Đề Lẻ"}]}, {"year": "2018", "version": "chan", "items": [{"id": "2018-chan-vocab-1", "type": "fill_blank", "prompt": "Employees work harder when they feel valued ....................... the company they work for", "answer": "by", "explanation": "(Nhân viên làm việc chăm chỉ hơn khi họ thấy được đánh giá cao bởi công ty mà họ làm việc)\n➔ Feel valued by someone: cảm thấy được đánh giá cao/ có giá trị bởi ai đó", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2018 - Đề Chẵn"}, {"id": "2018-chan-vocab-2", "type": "fill_blank", "prompt": "How important is it to ....................... in local community projects?", "answer": "invest", "explanation": "(Việc đầu tư vào các dự án cộng đồng ở địa phương quan trọng như thế nào?)\n➔ to invest in projects (v) đầu tư vào dự án", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2018 - Đề Chẵn"}, {"id": "2018-chan-vocab-3", "type": "fill_blank", "prompt": "The tiger is one of many animals in ....................... of becoming extinct.", "answer": "danger", "explanation": "( Hổ là một trong nhiều loại động vật có nguy cơ tuyệt chủng)\n➔ in danger of: có nguy cơ, trong mối nguy hiểm", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2018 - Đề Chẵn"}, {"id": "2018-chan-vocab-4", "type": "fill_blank", "prompt": "Swimming is the best way to lose any weight you have ....................... on in the winter.", "answer": "gained", "explanation": "(Bơi lội là cách tốt nhất để giảm cân mà bạn đã tăng vào mùa đông)\n➔ gain weight (v) tăng cân", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2018 - Đề Chẵn"}, {"id": "2018-chan-vocab-5", "type": "fill_blank", "prompt": "Scientists are constantly making new ....................... about the universe.", "answer": "discoveries", "explanation": "(Các nhà khoa học không ngừng đưa ra những khám phá mới về vũ trụ)\n➔ make new discoveries: tạo ra những khám phá mới", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2018 - Đề Chẵn"}, {"id": "2018-chan-vocab-6", "type": "fill_blank", "prompt": "A weak economy has resulted in reduced ....................... for many.", "answer": "prosperity", "explanation": "(Một nền kinh tế yếu kém đã dẫn đến giảm sự phát đạt của nhiều người.)\n➔ to result in: kết quả, dẫn tới", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2018 - Đề Chẵn"}, {"id": "2018-chan-vocab-7", "type": "fill_blank", "prompt": "To ....................... you the truth, I’m just not interested in that kind of music.", "answer": "tell", "explanation": "(Nói thật với cậu, tôi không hứng thú với thể loại âm nhạc đó)\n➔ To tell you the truth: nói thật là….", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2018 - Đề Chẵn"}, {"id": "2018-chan-vocab-8", "type": "fill_blank", "prompt": "After you log ....................... to the system, you’ll be asked to create a password.", "answer": "in", "explanation": "(Sau khi bạn đăng nhập vào hệ thống, bạn sẽ được yêu cầu tạo một mật khẩu)\n➔ log in (v) đăng nhập >< log out (v) đăng xuất", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2018 - Đề Chẵn"}, {"id": "2018-chan-vocab-9", "type": "fill_blank", "prompt": "We didn’t believe that they had cooked the meal .......................", "answer": "themselves", "explanation": "(Chúng tôi không tin được rằng họ đã tự nấu ăn)\nThemselves (đại từ phản thân của they) : họ tự làm", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2018 - Đề Chẵn"}, {"id": "2018-chan-vocab-10", "type": "fill_blank", "prompt": "Have you made any ....................... for the reception yet?", "answer": "arrangement", "explanation": "(Bạn đã lập kế hoạch/ sắp xếp gì cho buổi tiệc chiêu đãi chưa?)\n➔ make arrangement for (v) lập kế hoạch, sắp xếp cho một sự kiện, sự việc nào đó", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2018 - Đề Chẵn"}, {"id": "2018-chan-vocab-11", "type": "fill_blank", "prompt": "We were given some really good ....................... on restaurants to try out.", "answer": "recommendations", "explanation": "(Chúng tôi đã nhận được một vài lời gợi ý rất tốt về các nhà hàng đáng để trải nghiệm)\n➔ be given some recommendations: được cho một vài sự gợi ý, giới thiệu", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2018 - Đề Chẵn"}, {"id": "2018-chan-vocab-12", "type": "fill_blank", "prompt": "Don’t ....................... his abilities – he’s a lot better than you think.", "answer": "underestimate", "explanation": "(Đừng đánh giá thấp khả năng của anh ấy – anh ấy giỏi hơn nhiều so với bạn nghĩ)\n➔ underestimate (v) đánh giá thấp", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2018 - Đề Chẵn"}, {"id": "2018-chan-vocab-13", "type": "fill_blank", "prompt": "The proposed plan was completely ....................... - it made no sense at all.", "answer": "illogical", "explanation": "(Kế hoạch được đề xuất hoàn toàn phi logic – nó không có ý nghĩa gì cả)\n➔ make no sense at all: không có ý nghĩa gì cả (bổ sung cho vế trước – illogical).", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2018 - Đề Chẵn"}, {"id": "2018-chan-vocab-14", "type": "fill_blank", "prompt": "....................... phone is this? Is it yours?", "answer": "Whose", "explanation": "(Đây là điện thoại của ai? Có phải của bạn không?)\n➔ Whose: từ để hỏi chỉ sở hữu của ai", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2018 - Đề Chẵn"}, {"id": "2018-chan-vocab-15", "type": "fill_blank", "prompt": "We were really ....................... about you. Where have you been?", "answer": "worried", "explanation": "(Chúng tôi đã thực sự lo lắng cho bạn. Bạn đã ở đâu)\n➔ be worried about: lo lắng về điều gì /cho ai đó", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2018 - Đề Chẵn"}, {"id": "2018-chan-reading-open-1", "type": "open_short_answer", "passage": "Read the pas -build-2", "type": "sentence_building", "prompt": "We/better/leave/now/if/not/want/miss/our train.", "answer": "We'd better leave now if we don't want to miss our train.", "explanation": "➔ S + had better + V: tốt hơn nên, đưa ra lời khuyên, bảo rằng người nào đó nên hoặc không nên\nlàm điều gì đó trong một tình huống nào đó.", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2018 - Đề Chẵn"}, {"id": "2018-chan-sentence-build-3", "type": "sentence_building", "prompt": "He/prefer/ski/swim.", "answer": "He prefers skiing to swimming", "explanation": "➔ S + prefer + Ving to Ving: thích thứ gì hơn thứ còn lại", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2018 - Đề Chẵn"}, {"id": "2018-chan-sentence-build-4", "type": "sentence_building", "prompt": "Would/you/mind/give/me/a hand/please?", "answer": "", "explanation": "➔ Would you mind +Ving: đưa ra yêu cầu hoặc hỏi ý kiến của người nghe về việc nào đó, mang\ný nghĩa “bạn có phiền nếu”", "needs_review": true, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2018 - Đề Chẵn"}, {"id": "2018-chan-sentence-build-5", "type": "sentence_building", "prompt": "She/suggests/he/go/France/instead/Italy/this summer.", "answer": "She suggests that he should go to France instead of Italy this summer.", "explanation": "➔ S +suggest + that + Mệnh đề: đưa ra đề xuất\nA instead of B: A thay vì B", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2018 - Đề Chẵn"}, {"id": "2018-chan-sentence-build-6", "type": "sentence_building", "prompt": "Dog/take/out/walk/twice/day", "answer": "Dog should be taken out for a walk twice a day.", "explanation": "➔ Take out for a walk (v): dắt đi dạo", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2018 - Đề Chẵn"}, {"id": "2018-chan-sentence-build-7", "type": "sentence_building", "prompt": "If/he/home/his coat/be/here.", "answer": "If he is at home, his coat will be here.", "explanation": "➔ Câu điều kiện loại 1: If + S +V(s,es), S + will/can/shall + V: dùng để nói về một sự việc có thể\nxảy ra ở hiện tại hoặc tương lai nếu có một điều kiện nào đó.", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2018 - Đề Chẵn"}, {"id": "2018-chan-sentence-build-8", "type": "sentence_building", "prompt": "By/this/time/next/month/I/graduate/university.", "answer": "By this time of next month, I will have graduated university.", "explanation": "➔ Thì tương lai hoàn thành: diễn tả một hành động sẽ hoàn thành vào một thời điểm biết trước ở\ntương lai, trước khi hành động, sự việc khác xảy ra.\nDấu hiệu: By then, By/By the end/By the time + Mốc thời gian\nS + will have + V\npp", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2018 - Đề Chẵn"}, {"id": "2018-chan-sentence-build-9", "type": "sentence_building", "prompt": "He/phone/me/soon/as/he/hear/the news.", "answer": "He will phone me as soon as he hears about the news.", "explanation": "➔ Cấu trúc As soon as: diễn tả 2 hành động nối tiếp nhau\nS1 + will + V + as soon as + S2 + V", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2018 - Đề Chẵn"}, {"id": "2018-chan-sentence-build-10", "type": "sentence_building", "prompt": "He/could/not/help/notice/the/strange/smell/room.", "answer": "He could not help noticing the strange smell in his room.", "explanation": "➔ couldn’t help + Ving: Không thể ngừng làm gì", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2018 - Đề Chẵn"}, {"id": "2018-chan-transform-1", "type": "sentence_transformation", "prompt": "She never remembered to pick me up from school ALWAYS", "answer": "She always forgot to pick me up from school.", "explanation": "➔ : S + always + Ved/PII ( trái nghĩa) + O", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2018 - Đề Chẵn"}, {"id": "2018-chan-transform-2", "type": "sentence_transformation", "prompt": "They are much better at basketball than me.NEARLY", "answer": "I'm not nearly as good as them at basketball", "explanation": "", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2018 - Đề Chẵn"}, {"id": "2018-chan-transform-3", "type": "sentence_transformation", "prompt": "“Can you meet me after work?” he asked me.IF", "answer": "He asked if I could meet him after work.", "explanation": "➔ Chuyển câu trực tiếp sang gián tiếp.\nThêm if/whether sau động từ tường thuật:\nS + asked (someone)/wondered/wanted to know + if/whether + Mệnh đề", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2018 - Đề Chẵn"}, {"id": "2018-chan-transform-4", "type": "sentence_transformation", "prompt": "He didn't do very well at university and now he regrets it.WISHES", "answer": "He wishes he had done better at university.", "explanation": "- Wish ở quá khứ: tiếc nuối về một chuyện không có thật ở quá khứ hoặc giả định điều gì đó trái\nngược với quá khứ\nS + wish (es) + (that) + S + had + V\nPP", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2018 - Đề Chẵn"}, {"id": "2018-chan-transform-5", "type": "sentence_transformation", "prompt": "He waited for her and she arrived over an hour late. HAD", "answer": "He had been waiting for her over an hour when she arrived.", "explanation": "", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2018 - Đề Chẵn"}, {"id": "2018-chan-translate-en-vi-1", "type": "translation", "prompt": "The central bank announced tighter lending regulations in th as much as the total value of its GDP.", "answer": "Xuất khẩu của Việt Nam có gái trị ngang với tổng giá trị GDP.", "explanation": "➔ as much as: nhiều như, ngang như", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2018 - Đề Chẵn"}, {"id": "2018-chan-translate-vi-en-1", "type": "translation", "prompt": "Việc tăng lãi suất sẽ làm giảm tăng trưởng dài hạn", "answer": "Raising interest rates will slow down long¬term growth.", "explanation": "", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2018 - Đề Chẵn"}, {"id": "2018-chan-translate-vi-en-2", "type": "translation", "prompt": "Nếu bạn đến thăm Hà Nội, bạn phải ăn thử món bún chả", "answer": "If you visit Hanoi, you should try “Bun cha”.", "explanation": "", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2018 - Đề Chẵn"}, {"id": "2018-chan-translate-vi-en-3", "type": "translation", "prompt": "Đây là công việc thú vị nhất mà tôi từng làm.", "answer": "This is the most interesting job that i've ever had.", "explanation": "➔ Cấu trúc so sánh nhất: This is the most + adj + N that S + V", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2018 - Đề Chẵn"}, {"id": "2018-chan-translate-vi-en-4", "type": "translation", "prompt": "Sống trong một căn hộ chung cư hay nhà đất riêng thường phụ thuộc vào số tiền bạn có và sở thích cá nhân của mỗi người.", "answer": "Living in an apartment or a private house depends on how much money you have and your personal taste.", "explanation": "➔ S + depend on + What/where/when/how/whether...: phụ thuộc vào điều gì", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2018 - Đề Chẵn"}, {"id": "2018-chan-translate-vi-en-5", "type": "translation", "prompt": "Mặc dù tôi học tiếng Anh 5 năm rồi nhưng nói tiếng Anh vẫn là 1 điểm yếu của tôi.", "answer": "Although I've been learning English for 5 years, speaking is still a weakness of mine.", "explanation": "➔ Although + S + V, S + V: mặc cho, dù cho, liên kết hai vế của câu biểu thị hai hành động trái ngược nhau về mặt logic.", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2018 - Đề Chẵn"}]}, {"year": "2018", "version": "le", "items": [{"id": "2018-le-vocab-1", "type": "fill_blank", "prompt": "Fast food often has a lot of chemicals added to it, for ....................... , chemicals to make it\nsweeter.", "answer": "example", "explanation": "(Đồ ăn nhanh thường có nhiều đồ phụ gia hóa học trong đó, ví dụ như chất hóa học làm ngọt\nhơn)\n➔ for example : ví dụ", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2018 - Đề Lẻ"}, {"id": "2018-le-vocab-2", "type": "fill_blank", "prompt": "Countries that grow more food than their people need usually ....................... food", "answer": "export", "explanation": "S + V + N\n(Các quốc gia mà trồng nhiều lương thực hơn dân số cần thường xuất khẩu lương thực)\n➔ export (v) xuất khẩu", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2018 - Đề Lẻ"}, {"id": "2018-le-vocab-3", "type": "fill_blank", "prompt": "People who want to lose weight sometimes look for the ....................... trends in dieting and\nexercise.", "answer": "latest", "explanation": "The + adj ( so sánh nhất) + N\n(Người mà muốn giảm cần thường tìm kiếm những xu hướng mới nhất trong việc ăn kiêng và\ntập thể dục)\n➔ the lastest trends (n) những xu hướng mới nhất", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2018 - Đề Lẻ"}, {"id": "2018-le-vocab-4", "type": "fill_blank", "prompt": "What are some foods that can be harmful ....................... your health?", "answer": "to", "explanation": "(Một số loại thức ăn nào có thể gây hại cho sức khỏe của chúng ta?)\n➔ To be harmful to sth/sb (adj) nguy hiểm đến cái gì/ai", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2018 - Đề Lẻ"}, {"id": "2018-le-vocab-5", "type": "fill_blank", "prompt": "We are certain that there never ....................... any life on Mars", "answer": "is", "explanation": "There + to be + N\n(Chúng tôi chắc chắn rằng không bao giờ có sự sống trên sao Hỏa)", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2018 - Đề Lẻ"}, {"id": "2018-le-vocab-6", "type": "fill_blank", "prompt": "What kind of plants grow ....................... in your area?", "answer": "well", "explanation": "S + V + adv\n(Loại thực vật nào phát triển tốt ở khu vực của bạn?)\n➔ Grow well (adv) phát triển tốt", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2018 - Đề Lẻ"}, {"id": "2018-le-vocab-7", "type": "fill_blank", "prompt": "Because the ....................... is so low, there is no liquid on Mars, only ice.", "answer": "temperature", "explanation": "S + to be + adj\n(Vì nhiệt độ rất thấp, nên không có chất lỏng ở Sao Hỏa, chỉ có đá thôi)\n➔ temperature (n) nhiệt độ", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2018 - Đề Lẻ"}, {"id": "2018-le-vocab-8", "type": "fill_blank", "prompt": "In the future, sociable robots will ....................... better with people", "answer": "communicate", "explanation": "S + V + …\n(Trong tương lai, rô bốt tương tác xã hội sẽ giao tiếp tốt hơn với con người)\n➔ Communicate with (v): giao tiếp với", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2018 - Đề Lẻ"}, {"id": "2018-le-vocab-9", "type": "fill_blank", "prompt": "Your ....................... is your job or profession.", "answer": ": "In the past, most clothing stores only sold new styles every season. (2)", "explanation": "", "needs_review": false, "section": "reading-open", "section_label": "Đọc hiểu - Trả lời câu hỏi", "exam_label": "CPA 2018 - Đề Lẻ"}, {"id": "2018-le-reading-open-2", "type": "open_short_answer", "passage": "Read the passage and answer the questions.\nDo you like to follow the newest and latest fashion trends(1)? In the past, most clothing stores only\nsold new styles for each season(2). Nowadays, though, clothing retailers sell new styles every few\nweeks(3). They copy designer and celebrity styles and sell them cheaply(4). This is known as “fast\nfashion”(5). Fast fashion clothes are very popular because they are inexpensive and trendy(5).\nHowever, they also have problems(6). Their cheap price allows many people to follow rapidly\nchanging fashion trends(7). As a result, people buy clothes more often and throw them away, creating\nmore waste(8). Even worse, the materials used to make these clothes are harmful to the environment(9).\nThey are often made from artificial materials, such as polyester, acrylic, and nylon, which cannot\nbe easily recycled(10). And a single polyester dress takes about 200 years to break down!(11)", "prompt": "What is “fast fashion”?", "answer": "Fast fashion is cheap clothing which clothing retailers produce rapidly by copying designer and celebrity styles (4)", "explanation": "", "needs_review": false, "section": "reading-open", "section_label": "Đọc hiểu - Trả lời câu hỏi", "exam_label": "CPA 2018 - Đề Lẻ"}, {"id": "2018-le-reading-open-3", "type": "open_short_answer", "passage": "Read the passage and answer the questions.\nDo you like to follow the newest and latest fashion trends(1)? In the past, most clothing stores only\nsold new styles for each season(2). Nowadays, though, clothing retailers sell new styles every few\nweeks(3). They copy designer and celebrity styles and sell them cheaply(4). This is known as “fast\nfashion”(5). Fast fashion clothes are very popular because they are inexpensive and trendy(5).\nHowever, they also have problems(6). Their cheap price allows many people to follow rapidly\nchanging fashion trends(7). As a result, people buy clothes more often and throw them away, creating\nmore waste(8). Even worse, the materials used to make these clothes are harmful to the environment(9).\nThey are often made from artificial materials, such as polyester, acrylic, and nylon, which cannot\nbe easily recycled(10). And a single polyester dress takes about 200 years to break down!(11)", "prompt": "Why do people buy clothes more often and throw them away?", "answer": "Because fast fashion clothes are inexpensive, so that people can buy them more often to follow rapidly changing fashion trends (5),(7)", "explanation": "", "needs_review": false, "section": "reading-open", "section_label": "Đọc hiểu - Trả lời câu hỏi", "exam_label": "CPA 2018 - Đề Lẻ"}, {"id": "2018-le-reading-open-4", "type": "open_short_answer", "passage": "Read the passage and answer the questions.\nDo you like to follow the newest and latest fashion trends(1)? In the past, most clothing stores only\nsold new styles for each season(2). Nowadays, though, clothing retailers sell new styles every few\nweeks(3). They copy designer and celebrity styles and sell them cheaply(4). This is known as “fast\nfashion”(5). Fast fashion clothes are very popular because they are inexpensive and trendy(5).\nHowever, they also have problems(6). Their cheap price allows many people to follow rapidly\nchanging fashion trends(7). As a result, people buy clothes more often and throw them away, creating\nmore waste(8). Even worse, the materials used to make these clothes are harmful to the environment(9).\nThey are often made from artificial materials, such as polyester, acrylic, and nylon, which cannot\nbe easily recycled(10). And a single polyester dress takes about 200 years to break down!(11)", "prompt": "What kinds of materials are used to make clothes?", "answer": "Fast fashion clothes are often made from artificial materials, for example, polyester, acrylic, and nylon. (10)", "explanation": "", "needs_review": false, "section": "reading-open", "section_label": "Đọc hiểu - Trả lời câu hỏi", "exam_label": "CPA 2018 - Đề Lẻ"}, {"id": "2018-le-reading-open-5", "type": "open_short_answer", "passage": "Read the passage and answer the questions.\nDo you like to follow the newest and latest fashion trends(1)? In the past, most clothing stores only\nsold new styles for each season(2). Nowadays, though, clothing retailers sell new styles every few\nweeks(3). They copy designer and celebrity styles and sell them cheaply(4). This is known as “fast\nfashion”(5). Fast fashion clothes are very popular because they are inexpensive and trendy(5).\nHowever, they also have problems(6). Their cheap price allows many people to follow rapidly\nchanging fashion trends(7). As a result, people buy clothes more often and throw them away, creating\nmore waste(8). Even worse, the materials used to make these clothes are harmful to the environment(9).\nThey are often made from artificial materials, such as polyester, acrylic, and nylon, which cannot\nbe easily recycled(10). And a single polyester dress takes about 200 years to break down!(11)", "prompt": "How long does it take for a single polyester dress to breakdown?", "answer": "It takes about 200 years for a single polyester dress to breakdown (11)", "explanation": "", "needs_review": false, "section": "reading-open", "section_label": "Đọc hiểu - Trả lời câu hỏi", "exam_label": "CPA 2018 - Đề Lẻ"}, {"id": "2018-le-reading-mcq-1", "type": "mcq", "passage": "Read the passage carefully and choose ONE which you think fits best.\nAll of us have to work to earn a living ourselves and to help our family, however, we work not only for\nmaterial life but also for many other things(1). We are working to prove our ability(2). We feel self-\nconfident and proud because we are independent.(3)\nAnyone who works in regarded as a useful member of society(4). We're working, that means we're\ncontributing to our country(5). Working helps us train our minds because we always try our best to do\nthe job(6). The better we work, the more money we earn and that encourage us to work harder(7).\nWithout working, a man's life will be empty, purposeless and meaningless and it's easy for a jobless\nperson to do wrongs(8).", "prompt": "Why should we work?", "options": [{"label": "A", "text": "Because we have to"}, {"label": "B", "text": "It makes our material life worse"}, {"label": "C", "text": "It makes ourselves purposeless"}, {"label": "D", "text": "It makes ourselves better (2),"}], "answer": "D", "explanation": "Why should we work?\nE. Because we have to\nF. It makes our material life worse\nG. It makes ourselves purposeless\nH. It makes ourselves better (2),(3)", "needs_review": false, "section": "reading-mcq", "section_label": "Đọc hiểu - Trắc nghiệm", "exam_label": "CPA 2018 - Đề Lẻ"}, {"id": "2018-le-reading-mcq-2", "type": "mcq", "passage": "Read the passage carefully and choose ONE which you think fits best.\nAll of us have to work to earn a living ourselves and to help our family, however, we work not only for\nmaterial life but also for many other things(1). We are working to prove our ability(2). We feel self-\nconfident and proud because we are independent.(3)\nAnyone who works in regarded as a useful member of society(4). We're working, that means we're\ncontributing to our country(5). Working helps us train our minds because we always try our best to do\nthe job(6). The better we work, the more money we earn and that encourage us to work harder(7).\nWithout working, a man's life will be empty, purposeless and meaningless and it's easy for a jobless\nperson to do wrongs(8).", "prompt": "What can we get from work besides money?", "options": [{"label": "A", "text": "Many other important things"}, {"label": "B", "text": "Some salary"}, {"label": "C ____ known them (7) _____ years.\nHowever, usually it really does take you years to get (8) _____ know someone well enough to consider\nyour best friend. To the majority of us, this is someone we trust completely and who understands us\nbetter (9) _____ anyone else. It's the person you can turn to for impartial shoulder to cry on (10) _____", "gap_number": 10, "answer": "when", "explanation": "when life gets you down: khi cuộc sống khiến bạn thất vọng", "needs_review": false, "section": "cloze", "section_label": "Điền từ vào đoạn văn", "exam_label": "CPA 2018 - Đề Lẻ"}, {"id": "2018-le-wordform-1", "type": "fill_blank", "prompt": "You could see the audience's (enjoy) ....................... on their faces as they watched the show.", "answer": "enjoyment", "explanation": "S + V + cụm N\nenjoy (v) thích thú\n➔ enjoyment (n) sự thích thú/sự hưởng thụ", "needs_review": false, "section": "wordform", "section_label": "Từ loại (Word Formation)", "exam_label": "CPA 2018 - Đề Lẻ"}, {"id": "2018-le-wordform-2", "type": "fill_blank", "prompt": "Would you be (interest) ....................... in helping me train for my next match.", "answer": "interested", "explanation": "interest (n) quan tâm\n➔ interested in (adj) quan tâm đến _dùng khi nói đến cảm xúc >< interesting (adj) : để chỉ tính\nchất – sự thú vị của thứ gì đó", "needs_review": false, "section": "wordform", "section_label": "Từ loại (Word Formation)", "exam_label": "CPA 2018 - Đề Lẻ"}, {"id": "2018-le-wordform-3", "type": "fill_blank", "prompt": "Simon is really (health) ....................... . He smoke a pack of cigarette everyday and never does any\nexercise.", "answer": "unhealthy", "explanation": "exercise.\nhealth (n) sức khỏe\n➔ unhealthy (adj) không lành mạnh (dựa vào nghĩa của câu: anh ấy hút thuốc mỗi ngày và không\nbao giờ tập thể dục)", "needs_review": false, "section": "wordform", "section_label": "Từ loại (Word Formation)", "exam_label": "CPA 2018 - Đề Lẻ"}, {"id": "2018-le-wordform-4", "type": "fill_blank", "prompt": "We (calculate) ....................... how long it would take us to get to the airport and we missed our\nplane.", "answer": "miscalculated", "explanation": "plane.\ncalculate (v) tính toán\n➔ miscalculated (v) (Dạng quá khứ) tính toán sai ( dựa vào vế sau: miss the plane: trễ máy bay)", "needs_review": false, "section": "wordform", "section_label": "Từ loại (Word Formation)", "exam_label": "CPA 2018 - Đề Lẻ"}, {"id": "2018-le-wordform-5", "type": "fill_blank", "prompt": "John is so (depend) ....................... . He never let you down.", "answer": "dependable", "explanation": "depend (v) phụ thuộc\n➔ dependable (adj) đáng tin cậy >< let somebody down (v): làm ai đó thất vọng", "needs_review": false, "section": "wordform", "section_label": "Từ loại (Word Formation)", "exam_label": "CPA 2018 - Đề Lẻ"}, {"id": "2018-le-sentence-build-1", "type": "sentence_building", "prompt": "of/me/light/the/water/the/on/think/makes/diamonds.//", "answer": "The light on water makes me think of diamonds.", "explanation": "➔ S + make + someone + do sth: Ai/cái gì khiến ai làm gì", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2018 - Đề Lẻ"}, {"id": "2018-le-sentence-build-2", "type": "sentence_building", "prompt": "and/happy/the/seems/relaxed/boy//", "answer": "The boy seems happy and relaxed", "explanation": "➔ S + seem + adj: dường như, có vẻ như", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2018 - Đề Lẻ"}, {"id": "2018-le-sentence-build-3", "type": "sentence_building", "prompt": "angry/the/me/dead/and/sad/makes/gorilla/feel.//", "answer": "Dead of the gorilla makes me feel angry and sad.", "explanation": "➔ S + make + someone + do sth: Ai/cái gì khiến ai làm gì", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2018 - Đề Lẻ"}, {"id": "2018-le-sentence-build-4", "type": "sentence_building", "prompt": "looks/water/the/cool/refreshing/and//", "answer": "The water looks cool and refreshing.", "explanation": "", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2018 - Đề Lẻ"}, {"id": "2018-le-sentence-build-5", "type": "sentence_building", "prompt": "us/girl/of/young/the/famous/makes/sculpture/think/a.//", "answer": "The sculpture makes us think of a famous young girl.", "explanation": "➔ S + make + someone + do sth: Ai/cái gì khiến ai làm gì", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2018 - Đề Lẻ"}, {"id": "2018-le-sentence-build-6", "type": "sentence_building", "prompt": "Some/their/appointments/use/track/of/people/the calendar/their/phone/keep.//", "answer": "Some people use the calendar on their phones to keep track of their appointments.", "explanation": "", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2018 - Đề Lẻ"}, {"id": "2018-le-sentence-build-7", "type": "sentence_building", "prompt": "This/first time/I/be/cinema/my own.", "answer": "This is the first time i've been to the cinema on my own", "explanation": "", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2018 - Đề Lẻ"}, {"id": "2018-le-sentence-build-8", "type": "sentence_building", "prompt": "Everyone/agree/smoking/harmful.", "answer": "Everyone agrees that smoking is harmful.", "explanation": "", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2018 - Đề Lẻ"}, {"id": "2018-le-sentence-build-9", "type": "sentence_building", "prompt": "I/not/have/chance/look/the documents/the meeting/yet.", "answer": "I haven't had a chance to look at the documents of the meeting yet.", "explanation": "", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2018 - Đề Lẻ"}, {"id": "2018-le-sentence-build-10", "type": "sentence_building", "prompt": "People/make/more effort/usually/do better/others.", "answer": "People who make more effort usually do better than others.", "explanation": "➔ S + V + adv + than + S: so sánh hơn: so sánh cái này hơn cái kia", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2018 - Đề Lẻ"}, {"id": "2018-le-transform-1", "type": "sentence_transformation", "prompt": "Lan would have gone to the meeting if she had not been so tired (Tired)TIRED", "answer": "Lan was too tired so that she haven’t gone to the meeting.", "explanation": "➔ Câu điều kiện loại 3: If S + had + V (quá khứ hoàn thành), S + would/could/might + have +\nPP\nV : dùng để nói về mọt sự việc đã không xảy ra ở quá khứ\npp", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2018 - Đề Lẻ"}, {"id": "2018-le-transform-2", "type": "sentence_transformation", "prompt": "I can't believe this is the best room there is. BETTER", "answer": "There must be a better room than this one.", "explanation": "", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2018 - Đề Lẻ"}, {"id": "2018-le-transform-3", "type": "sentence_transformation", "prompt": "It is a waste of time for you to discuss the problem with Minh.POINT", "answer": "There's no point in discussing the problem with Minh.", "explanation": "➔ There is no point in + Ving = It is no good/use + Ving: làm gì vô ích", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2018 - Đề Lẻ"}, {"id": "2018-le-transform-4", "type": "sentence_transformation", "prompt": "It is more than a year since I saw Lucy. FOR", "answer": "I haven't seen Lucy for more than a year.", "explanation": "➔ Thì hiện tại hoàn thành: S + have/has + V + O + for + khoảng thời gian\nPP", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2018 - Đề Lẻ"}, {"id": "2018-le-transform-5", "type": "sentence_transformation", "prompt": "I'm sorry I didn't come to see you earlier. WISH", "answer": "I wish i had come to see you earlier.", "explanation": "- Wish ở quá khứ: tiếc nuối về một chuyện không có thật ở quá khứ hoặc giả định điều gì đó trái\nngược với quá khứ\n➔ S + wish (es) + (that) + S + had + V\nPP", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2018 - Đề Lẻ"}, {"id": "2018-le-translate-en-vi-1", "type": "translation", "prompt": "The statue stands by itself in the square", "answer": "Tượng đài đứng hiên ngang giữa quảng trường.", "explanation": "", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2018 - Đề Lẻ"}, {"id": "2018-le-translate-en-vi-2", "type": "translation", "prompt": "She has taken the fullest advantage of her beauty.", "answer": "Cô ấy đã tận dụng tối đa lợi thế về sắc đẹp của mình.", "explanation": "", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2018 - Đề Lẻ"}, {"id": "2018-le-translate-en-vi-3", "type": "translation", "prompt": "The religious label has long been thoroughly exploited by the enemy.", "answer": "Cái mác tôn giáo đã bị kẻ thù khai thác rất nhiều trong suốt thời gian dài.", "explanation": "➔ thoroughly (adv) triệt để ➔ be exploited (v) bị khai thác ➔ by the enemy (adv) bởi kẻ thù", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2018 - Đề Lẻ"}, {"id": "2018-le-translate-en-vi-4", "type": "translation", "prompt": "Employers must make compensatory payments to workers for injuries suffered their work.", "answer": "Các ông chủ phải thanh toán các khoản bồi thường cho những công nhận đã bị thương khi làm việc.", "explanation": "➔ make compensatory payments + to someone (v) thanh toán các khoản bồi thường ➔ injuries suffered their work (n) chấn thương gặp phải khi làm việc", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2018 - Đề Lẻ"}, {"id": "2018-le-translate-en-vi-5", "type": "translation", "prompt": "Noone doubts his competence in solving those difficult problems.", "answer": "Noone nghi ngờ khả năng của anh ấy trong việc giải quyết các vấn đề khó khan.", "explanation": "➔ to doubt sth (v) nghi ngờ cái gì đó", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2018 - Đề Lẻ"}, {"id": "2018-le-translate-vi-en-1", "type": "translation", "prompt": "Bộ phim hay lắm", "answer": "What a good movie!", "explanation": "", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2018 - Đề Lẻ"}, {"id": "2018-le-translate-vi-en-2", "type": "translation", "prompt": "Có phải những hương liệu và gia vị này đến từ phương Đông không?", "answer": "Do these herbs and spices from the East?", "explanation": "➔ hương liệu: herb ➔ gia vị: spice", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2018 - Đề Lẻ"}, {"id": "2018-le-translate-vi-en-3", "type": "translation", "prompt": "Gia đình chị rất nghèo nhưng chị ấy rất trung thực trong chuyện tiền bạc.", "answer": "Her family is very poor but she is very honest in money-related issues", "explanation": "➔ money-related issues (n) chuyện tiền bạc", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2018 - Đề Lẻ"}, {"id": "2018-le-translate-vi-en-4", "type": "translation", "prompt": "Nhiều người, kể cả tôi, bị dị ứng với các thực phẩm đóng hộp này", "answer": "A lot of people, including me, are allergic to these canned foods.", "explanation": "➔ be allergic to something: bị dị ứng với cái gì", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2018 - Đề Lẻ"}, {"id": "2018-le-translate-vi-en-5", "type": "translation", "prompt": "Nam đã giúp nàng tìm được đồ của nàng.", "answer": "Nam helped her to find her belongings.", "explanation": "", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2018 - Đề Lẻ"}]}, {"year": "2019", "version": "chan", "items": [{"id": "2019-chan-vocab-1", "type": "fill_blank", "prompt": "Orders have increased ....................... the advertising campaign in June.", "answer": "since", "explanation": "(Lượng đặt hàng đã tăng lên kể từ chiến dịch quảng cáo vào tháng Sáu)\n➔ Thì hiện tại hoàn thành: S + have/has + Vpp + since + mốc thời gian\nfor + khoảng thời gian", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2019 - Đề Chẵn"}, {"id": "2019-chan-vocab-2", "type": "fill_blank", "prompt": "I wonder how Jim is getting on. I haven’t ....................... from him for nearly a week.", "answer": "heard", "explanation": "( Tôi tự hỏi Jim dạo này sao rồi. Tôi đã không nghe tin gì từ anh ấy trong gần một tuần)\n➔ Thì hiện tại hoàn thành: S + have/has + Vpp + for + khoảng thời gian\n➔ to hear from + someone (v): nghe tin từ ai đó", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2019 - Đề Chẵn"}, {"id": "2019-chan-vocab-3", "type": "fill_blank", "prompt": "I’m applying for a ....................... to my London office, but I don’t know if I’ll be successful.", "answer": "post", "explanation": "a/an/the + N\nTôi đang đăng kí ứng tuyển vào văn phòng London của tôi, nhưng tôi không biết liệu mình có thành\ncông không.\n➔ to apply for a post (v): xin một chỗ làm/ đăng kí ứng tuyển", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2019 - Đề Chẵn"}, {"id": "2019-chan-vocab-4", "type": "fill_blank", "prompt": "We’ve got a competition ....................... is at work to find a name for our new range of cosmetics.", "answer": "which", "explanation": "N (thing) + WHICH + V + O\n(Chúng tôi đã tổ chức một cuộc thi tại nơi làm việc để tìm ra tên cho dòng mỹ phẩm mới của chúng tôi)\n➔ which: là một đại từ quan hệ để thay thế cho vật, con vật hoặc một mệnh đề → Giải thích, bổ\nsung nghĩa cho competion", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2019 - Đề Chẵn"}, {"id": "2019-chan-vocab-5", "type": "fill_blank", "prompt": "The labourers demanded that the farm manager ....................... them higher wages.", "answer": "gave", "explanation": "to demand that + S + V + O: yêu cầu rằng....\n( Những người lao động yêu cầu người quản lí nông trại trả cho họ mức lương cao hơn)\n➔ to give +someone+ wages: trả lương cho ai đó\n(note: Đề bài cho từ “give” nhưng với “Demanded” thì phải dùng ở thì quá khứ “gave”)", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2019 - Đề Chẵn"}, {"id": "2019-chan-vocab-6", "type": "fill_blank", "prompt": "It’s time something ....................... done about this problem.", "answer": "was", "explanation": "S + to be + Ved/II ( câu bị động)\n(Đã đến lúc phải giải quyết vấn đề này)\n➔ It’s time something was done ...: đã đến lúc phải giải quyết", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2019 - Đề Chẵn"}, {"id": "2019-chan-vocab-7", "type": "fill_blank", "prompt": "We are going to have 5.000 new catalogues ....................... in Hongkong.", "answer": "printed", "explanation": "(Chúng tôi sẽ có 5.000 cuốn giới thiệu sản phẩm được in tại Hồng Kông)\n➔ Mệnh đề quan hệ rút gọn bằng V_ed: printed bổ sung nghĩa cho 5.000 new catalogues\nĐộng từ ở dạng bị động ( nó không chủ động in mà được con người/máy móc in ra), ta lược bỏ\nđại từ quan hệ (nếu ở đây là which) và chia động từ ở dạng phân từ II.", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2019 - Đề Chẵn"}, {"id": "2019-chan-vocab-8", "type": "fill_blank", "prompt": "I’ll phone you later ....................... you have any problems with the program.", "answer": "in case", "explanation": "(Tôi sẽ gọi cho bạn sau phòng khi bạn gặp bất kỳ sự cố nào với chương trình)\n➔ in case: đề phòng, trong trường hợp, phòng khi. Dùng để nói về cách chúng ta sẽ đề phòng khả\nnăng xảy ra điều gì đó.", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2019 - Đề Chẵn"}, {"id": "2019-chan-vocab-9", "type": "fill_blank", "prompt": "....................... we continue to order in bulk, they will go on giving us free delivery.", "answer": "Provided that", "explanation": "( Với điều kiện chúng ta tiếp tục đặt hàng với số lượng lớn, họ sẽ giao hàng miễn phí cho chúng ta)\n➔ Provied that + mệnh đề bổ nghĩa, mệnh đề chính: giống If – nếu như, trong trường hợp mà...\n➔ order in bulk (v): đặt hàng với số lượng lớn", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2019 - Đề Chẵn"}, {"id": "2019-chan-vocab-10", "type": "fill_blank", "prompt": "If everyone contributed 20% of their salaries ....................... charity, there would be no poverty.", "answer": "to", "explanation": "(Nếu tất cả mọi người đều đóng góp 20% tiền lương của mình cho hoạt động từ thiện, thì sẽ không có\nđói nghèo.)\n➔ to contribue to/toward/towards sth: đóng góp vào, hướng tới", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2019 - Đề Chẵn"}, {"id": "2019-chan-vocab-11", "type": "fill_blank", "prompt": "The alarm went off. so someone ....................... have been trying to break in.", "answer": "must", "explanation": "(Chuông báo đã vang lên, vì vậy chắc hẳn phải có ai đó cố gắng đột nhập.)", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2019 - Đề Chẵn"}, {"id": "2019-chan-vocab-12", "type": "fill_blank", "prompt": "Shall I get you a sandwich or would you prefer ....................... a salad?", "answer": "having", "explanation": "(Tôi sẽ lấy cho bạn một chiếc bánh sandwich hay bạn muốn ăn salad hơn?)\n➔ ...to prefer + Ving: thích làm gì hơn (hơn cái gì)", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2019 - Đề Chẵn"}, {"id": "2019-chan-vocab-13", "type": "fill_blank", "prompt": "....................... employees shares can help to increase motivation.", "answer": "Giving", "explanation": "(Cho nhân viên chia sẻ có thể giúp tăng động lực.)\n➔ V-ing có thể làm chủ ngữ", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2019 - Đề Chẵn"}, {"id": "2019-chan-vocab-14", "type": "fill_blank", "prompt": "We drew up a shortlist of candidates ....................... CVs were very good.", "answer": "whose", "explanation": "(Chúng tôi đã chuẩn bị một danh sách ngắn những ứng cử viên mà có CV tốt)\n➔ Đại từ quan hệ: whose Chỉ sự sở hữu của cả người và vật. (của ai đó, của vật gì)\n➔ …..N (person, thing) + WHOSE + N + V ….", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2019 - Đề Chẵn"}, {"id": "2019-chan-vocab-15", "type": "fill_blank", "prompt": "I’d like ....................... advice about the government’s latest tax proposals.", "answer": "to have", "explanation": "(Tôi muốn có lời khuyên về các đề xuất thuế mới nhất của Chính phủ)\n➔ Would like to + V (v): muốn làm gì đó\n➔ have advice: cho lời khuyên, có lời khuyên", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2019 - Đề Chẵn"}, {"id": "2019-chan-reading-open-1", "type": "open_short_answer", "passage": "Re placed", "explanation": "S + have/ has + Ved/II + O ( Thì hiện tại hoàn thành)\n➔ replacement (n) sự thay thế\nreplace (v) thay thế → V : replaced (cấu trúc thì hiện tại hoàn thành)\nII", "needs_review": false, "section": "wordform", "section_label": "Từ loại (Word Formation)", "exam_label": "CPA 2019 - Đề Chẵn"}, {"id": "2019-chan-wordform-3", "type": "fill_blank", "prompt": "The old couple have saved a lot of money for their ....................... (RETIRE)", "answer": "retirement", "explanation": "for + đại từ sở hữu +N\n➔ retire (v): nghỉ hưu → retirement (n) sự về hưu", "needs_review": false, "section": "wordform", "section_label": "Từ loại (Word Formation)", "exam_label": "CPA 2019 - Đề Chẵn"}, {"id": "2019-chan-wordform-4", "type": "fill_blank", "prompt": "The weather was so terrible, so we had a very ....................... holiday.(PLEASE)", "answer": "unpleasant", "explanation": "a + adj + N\nplease (v) làm hài lòng\n➔ unpleasant (adj): không hài lòng ( bổ nghĩa cho vế trước: terrible)", "needs_review": false, "section": "wordform", "section_label": "Từ loại (Word Formation)", "exam_label": "CPA 2019 - Đề Chẵn"}, {"id": "2019-chan-wordform-5", "type": "fill_blank", "prompt": "He didn't give any ....................... for his absence. (EXPLAIN)", "answer": "explanation", "explanation": "S + V + N\nexplain (v) giải thích\n➔ explanation (n) sự giải thích", "needs_review": false, "section": "wordform", "section_label": "Từ loại (Word Formation)", "exam_label": "CPA 2019 - Đề Chẵn"}, {"id": "2019-chan-sentence-build-1", "type": "sentence_building", "prompt": "She / consider / be / finest pianist / her generation.", "answer": "She is considered as the finest pianist in her generation.", "explanation": "➔ be + considered + as : được coi là", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2019 - Đề Chẵn"}, {"id": "2019-chan-sentence-build-2", "type": "sentence_building", "prompt": "Jane / come / first, / which / surprise / nobody.", "answer": "Jane came first, which supprised nobody.", "explanation": "➔ Đại từ quan hệ which : Làm chủ ngữ hoặc tân ngữ, thay thế cho danh từ chỉ vật.\nS + V , WHICH + V + O", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2019 - Đề Chẵn"}, {"id": "2019-chan-sentence-build-3", "type": "sentence_building", "prompt": "The fire / be / so / intense / that / it / take / firemen / three / hours / put out", "answer": "The fire was so intense that it took the firemen three hours to put it out.", "explanation": "➔ Cấu trúc so…that…: S + to be + so + adj + that + S + V: quá… để ai đó làm gì\n➔ Intense (adj): mạnh\n➔ Put out (v): dập lửa", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2019 - Đề Chẵn"}, {"id": "2019-chan-sentence-build-4", "type": "sentence_building", "prompt": "I / be / able / drive / five / years.", "answer": "I have been able to drive for five years.", "explanation": "➔ be able to + V: có thể, đủ khả năng để làm gì đó\n➔ Cấu trúc thì hiện tại hoàn thành: : S + have/has + Vpp + for + khoảng thời gian", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2019 - Đề Chẵn"}, {"id": "2019-chan-sentence-build-5", "type": "sentence_building", "prompt": "Japan / it / essential / exchange / business cards / immediately / meeting.", "answer": "In Japan, it is essential to exchange business cards immediately in the meeting.", "explanation": "➔ It is essential to V/ that S+V: nhấn mạnh tính cần thiết của vấn đề được nói đến", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2019 - Đề Chẵn"}, {"id": "2019-chan-sentence-build-6", "type": "sentence_building", "prompt": "We / look forward / hear / you / and / see / you / soon.", "answer": "We look forward to hearing from you and seeing you soon.", "explanation": "➔ to look forward to +Ving: diễn tả cảm xúc, sự chờ đợi của bản thân mong chờ một sự việc, hành\nđộng nào đó.", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2019 - Đề Chẵn"}, {"id": "2019-chan-sentence-build-7", "type": "sentence_building", "prompt": "You / have / work / hard/ if / you / want / go / university.", "answer": "You will have to work hard if you want to go to university.", "explanation": "➔ Câu điều kiện thì hiện tại đơn: S + V + O if S + want to + O", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2019 - Đề Chẵn"}, {"id": "2019-chan-sentence-build-8", "type": "sentence_building", "prompt": "Two million / cars / produce / so far / this year.", "answer": "Two million cars have been produced so far this year.", "explanation": "➔ this year: thì hiện tại hoàn thành\n➔ Dạng bị động: S +have/has been + V + O\nPP", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2019 - Đề Chẵn"}, {"id": "2019-chan-sentence-build-9", "type": "sentence_building", "prompt": "It / be / time / something / do / this problem.", "answer": "It’s time something was done about this problem.", "explanation": "", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2019 - Đề Chẵn"}, {"id": "2019-chan-sentence-build-10", "type": "sentence_building", "prompt": "We / regret / inform / you / that / your application / be / unsuccessful.", "answer": "We regret to inform you that your application has been unsuccessful.", "explanation": "➔ S + reget to inform you that: rất tiếc phải thông báo đến bạn rằng", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2019 - Đề Chẵn"}, {"id": "2019-chan-transform-1", "type": "sentence_transformation", "prompt": "If you have enough money for the fare, why not travel first class? AFFORD", "answer": "If you can afford for the fare, why not travel first class?", "explanation": "➔ afford for + N: đủ tiền cho cái gì", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2019 - Đề Chẵn"}, {"id": "2019-chan-transform-2", "type": "sentence_transformation", "prompt": "Could you speak up because I can't hear you properly? MIND", "answer": "Would you mind speaking up because I can't hear you properly.", "explanation": "➔ Would you mind +Ving: đưa ra yêu cầu hoặc hỏi ý kiến của người nghe về việc nào đó, mang ý\nnghĩa “bạn có phiền nếu”", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2019 - Đề Chẵn"}, {"id": "2019-chan-transform-3", "type": "sentence_transformation", "prompt": "We advise customers to buy their tickets in advance. ADVISED", "answer": "Customers are advised to buy their tickets in advance.", "explanation": "➔ Câu bị động: chủ ngữ bị/được làm gì đó\nS + be + V + (by + O)+...\nPP", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2019 - Đề Chẵn"}, {"id": "2019-chan-transform-4", "type": "sentence_transformation", "prompt": "It’s such a pity I didn’t see that film on television last night. WISH", "answer": "I wish I had seen that film on television last night.", "explanation": "➔ Câu trúc Wish ở quá khứ: tiếc nuối về một chuyện không có thật ở quá khứ hoặc giả định điều\ngì đó trái ngược với quá khứ\nS + wish (es) + (that) + S + had + V\nPP", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2019 - Đề Chẵn"}, {"id": "2019-chan-transform-5", "type": "sentence_transformation", "prompt": "The party will be held in the garden as long as it doesn't rain that day. UNLESS", "answer": "The party will be held in the garden unless it rains that day", "explanation": "➔ unless: không, trừ khi = if not", "n  "The auditor should note the terms relating to the participation of the internal auditors and other personnel of the audited entity.", "explanation": "", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2019 - Đề Chẵn"}, {"id": "2019-chan-translate-vi-en-5", "type": "translation", "prompt": "Chúng tôi tin rằng công ty của chúng tôi đã thành công; chúng tôi đạt lợi nhuận hằng năm kể từ năm đầu tiên.", "answer": "We believe that our company has been successful: we have been profitable every year since the first year.", "explanation": "", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2019 - Đề Chẵn"}]}, {"year": "2019", "version": "le", "items": [{"id": "2019-le-vocab-1", "type": "fill_blank", "prompt": "He has been collecting stamps ....................... the age of ten.", "answer": "since", "explanation": "(Anh ấy đã sưu tập tem từ năm 10 tuổi)\n➔ Thì hiện tại hoàn thành: S + have/has + Vpp + since + mốc thời gian", "needs_review": true, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2019 - Đề Lẻ"}, {"id": "2019-le-vocab-2", "type": "fill_blank", "prompt": "Our turnover has ....................... by 20% over the same period last year.", "answer": "increased", "explanation": "S + has/have + Ved/II ( Thì hiện tại hoàn thành)\n(Doanh thu của chúng tôi đã tăng 20% so với cùng kỳ năm ngoái.)\n➔ increase by: tăng thêm 1 khoảng là\n➔ increase + to: tăng lên thành một mức xác định bao nhiêu (tăng lên đến)", "needs_review": true, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2019 - Đề Lẻ"}, {"id": "2019-le-vocab-3", "type": "fill_blank", "prompt": "In ....................... with other countries, Britain has a very high rate of heart attacks.", "answer": null, "explanation": "S + to be + V ( Câu bị động)\nPP\n(Người quản lý gợi ý rằng hàng hóa được đặt hàng từ một nhà cung cấp khác.)\nLưu ý: goods là danh từ chỉ hàng hóa nói chung, không phải dạng số nhiều.", "needs_review": true, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2019 - Đề Lẻ"}, {"id": "2019-le-vocab-4", "type": "fill_blank", "prompt": "What do you mean? He's watching TV? He's ....................... supposed to be washing the car.", "answer": null, "explanation": "(So với các nước khác, Anh có tỷ lệ nhồi máu cơ tim cao nhất)\n➔ In comparison with: so sánh với đối tượng nào đó", "needs_review": true, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2019 - Đề Lẻ"}, {"id": "2019-le-vocab-5", "type": "fill_blank", "prompt": "He hadn't seen his sister for 30 years, ....................... they recognized each other instantly.", "answer": null, "explanation": "(Ý bạn là sao? Anh ấy đang xem TV ư? Anh ấy đáng lẽ ra phải đang rửa xe)\n➔ be supposed to do sth: đáng lẽ phải làm gì", "needs_review": true, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2019 - Đề Lẻ"}, {"id": "2019-le-vocab-6", "type": "fill_blank", "prompt": "We would very much ....................... a reply by the end of the month.", "answer": "He h", "explanation": "(Anh ấy đã không gặp em gái mình trong 30 năm, nhưng họ nhận ra nhau ngay lập tức)", "needs_review": true, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2019 - Đề Lẻ"}, {"id": "2019-le-vocab-7", "type": "fill_blank", "prompt": "There’s always ....................... traffic in the centre during rush hours.", "answer": null, "explanation": "S + V + O + by (mốc thời gian)\n(Chúng tôi đánh giá rất cao một câu trả lời vào cuối tháng)\n➔ appreciate (v) đánh giá cao", "needs_review": true, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2019 - Đề Lẻ"}, {"id": "2019-le-vocab-8", "type": "fill_blank", "prompt": "It was raining very ....................... so I took my raincoat.", "answer": null, "explanati (v) làm hài lòng\n➔ pleasure (n) sự hài lòng", "needs_review": false, "section": "wordform", "section_label": "Từ loại (Word Formation)", "exam_label": "CPA 2019 - Đề Lẻ"}, {"id": "2019-le-wordform-2", "type": "fill_blank", "prompt": "I spent my ....................... in the country. (CHILD)", "answer": "childhood", "explanation": "Tính từ sở hữu + N\n➔ child (n) trẻ con (1 người) → childhood (n) tuổi thơ", "needs_review": false, "section": "wordform", "section_label": "Từ loại (Word Formation)", "exam_label": "CPA 2019 - Đề Lẻ"}, {"id": "2019-le-wordform-3", "type": "fill_blank", "prompt": "The ....................... she gave last night was marvelous. (PERFORM)", "answer": "performance", "explanation": "N + S + V\nperform (v) trình diễn\n➔ performance (n) màn trình diễn", "needs_review": false, "section": "wordform", "section_label": "Từ loại (Word Formation)", "exam_label": "CPA 2019 - Đề Lẻ"}, {"id": "2019-le-wordform-4", "type": "fill_blank", "prompt": "The restaurant is ....................... for its western meals. (FAME)", "answer": "famous", "explanation": "S + to be + adj\nfame (n) danh tiếng\n➔ famous (adj) nổi tiếng", "needs_review": false, "section": "wordform", "section_label": "Từ loại (Word Formation)", "exam_label": "CPA 2019 - Đề Lẻ"}, {"id": "2019-le-wordform-5", "type": "fill_blank", "prompt": "I wish you every ....................... in your new job. (SUCCEED)", "answer": "success", "explanation": "Every + N\n➔ success (n) sự thành công", "needs_review": false, "section": "wordform", "section_label": "Từ loại (Word Formation)", "exam_label": "CPA 2019 - Đề Lẻ"}, {"id": "2019-le-sentence-build-1", "type": "sentence_building", "prompt": "It/ be / unnecessary / us / buy / so much food / yesterday.", "answer": "It was unnecessary for us to buy so much food yesterday.", "explanation": "➔ It is/was unnecessary + for someone+ to do sth: Việc ai đó làm gì đó là không cần thiết", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2019 - Đề Lẻ"}, {"id": "2019-le-sentence-build-2", "type": "sentence_building", "prompt": "Ann / feel / lonely / because / she / not / invite / party.", "answer": "Ann feels lonely because she is not invited to the party.", "explanation": "", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2019 - Đề Lẻ"}, {"id": "2019-le-sentence-build-3", "type": "sentence_building", "prompt": "One day soon / every schoolchild / have / access / Internet.", "answer": "One day soon, every schoolchild will have access to the Internet.", "explanation": "➔ Access to sth (): kết nối đến/vào cái gì đó", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2019 - Đề Lẻ"}, {"id": "2019-le-sentence-build-4", "type": "sentence_building", "prompt": "you / have / chance / speak / Personnel Manager / yesterday?", "answer": "Did you have a chance to speak to the Personnel Manager yesterday?", "explanation": "➔ have a chance to do sth (v) có cơ hội để làm gì", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2019 - Đề Lẻ"}, {"id": "2019-le-sentence-build-5", "type": "sentence_building", "prompt": "I / try / warn / him, / but / it / be / too late.", "answer": "I tried to warn him, but it had been too late.", "explanation": "➔ S + try + to do sth: cố gắng làm gì", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2019 - Đề Lẻ"}, {"id": "2019-le-sentence-build-6", "type": "sentence_building", "prompt": "Peter / give / permission / his boss / take / day / off.", "answer": "Peter is given permission by his boss to take a day off.", "explanation": "➔ be given permission to V: được sự cho phép làm gì đó", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2019 - Đề Lẻ"}, {"id": "2019-le-sentence-build-7", "type": "sentence_building", "prompt": "It / be / time / government / bring / economy / control.", "answer": "It is time for the government to bring the economy under control.", "explanation": "➔ It is time for + someone + to do sth: Đã đến lúc để ai đó làm gì", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2019 - Đề Lẻ"}, {"id": "2019-le-sentence-build-8", "type": "sentence_building", "prompt": "management / decide/ reduce / workforce / 10%.", "answer": "The management has decided to reduce the workforce to 10%.", "explanation": "➔ to decide to V: quyết định làm gì đó", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2019 - Đề Lẻ"}, {"id": "2019-le-sentence-build-9", "type": "sentence_building", "prompt": "You / have / make / application / visa / advance.", "answer": "You have to make the visa application in advance.", "explanation": "➔ in advance: trước/làm trước", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2019 - Đề Lẻ"}, {"id": "2019-le-sentence-build-10", "type": "sentence_building", "prompt": "If / they / be / financial trouble, / they / get / touch / our Finance Department.", "answer": "If they are in financial trouble, they will get in touch with our Finance Department.", "explanation": "➔ Câu điều kiện loại 1: If + S +V(s,es), S + will/can/shall + V: dùng để nói về một sự việc có thể\nxảy ra ở hiện tại hoặc tương lai nếu có một điều kiện nào đó.", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2019 - Đề Lẻ"}, {"id": "2019-le-transform-1", "type": "sentence_transformation", "prompt": "I will be very happy when I go on holiday.FORWARD", "answer": "I am very much happy to look forward to going on holiday.", "explanation": "➔ to look forward to +Ving: diễn tả cảm xúc, sự chờ đợi của bản thân mong chờ một sự việc, hành\nđộng nào đó.", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2019 - Đề Lẻ"}, {"id": "2019-le-transform-2", "type": "sentence_transformation", "prompt": "My father last went abroad in 1966. BEEN", "answer": "My father has been adroad since 1966.", "explanation": "", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2019 - Đề Lẻ"}, {"id": "2019-le-transform-3", "type": "sentence_transformation", "prompt": "‘Did you read the book or not?’ the teacher asked me. WHETHER", "answer": "The teacher asked me whether I had read the book or not.", "explanation": "➔ Chuyển câu trực tiếp sang gián tiếp dạng yes/no:\nThêm if/whether sau động từ tường thuật:\nS + asked (someone)/wondered/wanted to know + if/whether + Mệnh đề + (or not).", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2019 - Đề Lẻ"}, {"id": "2019-le-transform-4", "type": "sentence_transformation", "prompt": "When she is angry, she never lets him finish speaking. ALLOWED", "answer": "When she is angry, she has never allowed him to finish speaking.", "explanation": "➔ S + allow + someone to do sth: cho phép ai đó làm gì", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2019 - Đề Lẻ"}, {"id": "2019-le-transform-5", "type": "sentence_transformation", "prompt": "It took him three months to recover from his illness. OVER", "answer": "It took him three months to get over his illness.", "explanation": "➔ get over + N (chỉ bệnh tật) = to recover from + N(chỉ bệnh tật)\n= to make a recovery from + N: vừa trải qua căn bệnh", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2019 - Đề Lẻ"}, {"id": "2019-le-translate-en-vi-1", "type": "translation", "prompt": "In America, accounting firms have almost recovered from the effects of the global crisis. Before applying for a job you should consider the area that you would like to work in.", "answer": "Ở Mỹ, các công ty kế toán hầu như đã phục hồi sau ảnh hưởng của khủng hoảng toàn cầu. Trước khi nộp đơn xin việc, bạn nên xem xét lĩnh vực nào mà bạn muốn làm việc.", "explanation": "➔ recover from sth: hồi phục từ ... ➔ global crisis (n) khủng hoảng toàn cầu", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2019 - Đề Lẻ"}, {"id": "2019-le-translate-en-vi-2", "type": "translation", "prompt": "Before applying for a job you should consider the area that you would like to work in.", "answer": "Trước khi nộp đơn xin việc, bạn nên xem xét lĩnh vực mà bạn muốn làm việc.", "explanation": "", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2019 - Đề Lẻ"}, {"id": "2019-le-translate-en-vi-3", "type": "translation", "prompt": "Currently, many accounting graduates are being employed by governmental and non-profit organisations.", "answer": "Hiện nay, nhiều sinh viên tốt nghiệp ngành kế toán đang làm việc trong các tổ chức thuộc chính phủ và các tổ chức phi lợi nhuận.", "explanation": "", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2019 - Đề Lẻ"}, {"id": "2019-le-translate-en-vi-4", "type": "translation", "prompt": "The company’s goal is to reach maximum production capacity within the next three months.", "answer": "Mục tiêu của công ty là đạt được mức sản xuất tối đa trong vòng 3 tháng tới.", "explanation": "➔ The goal/aim is to reach...: mục tiêu là đạt được", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2019 - Đề Lẻ"}, {"id": "2019-le-translate-en-vi-5", "type": "translation", "prompt": "She hasn't finished the monthly financial reports yet, but she says she should have them by the end of the day.", "answer": "Cô ấy vẫn chưa hoàn thành báo cáo tài chính hàng tháng, nhưng cô ấy nói cô ấy nên hoàn thành chúng vào cuối ngày.", "explanation": "➔ by the end of the day: vào cuối ngày ➔ at the end of a day + S+V...: sau cùng thì, rốt cuộc thì (dùng để đưa ra một kết luận mà bạn đã rút ra sau khi xem xét tất cả các dữ kiện khác)", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2019 - Đề Lẻ"}, {"id": "2019-le-translate-vi-en-1", "type": "translation", "prompt": "Báo cáo kiểm toán hoạt động đánh giá tính kinh tế, hiệu lực và hiệu quả trong quản lý, sử dụng tiền, tài sản và các nguồn lực khác của đơn vị được kiểm toán.", "answer": "The performance audit report evaluates the economy, effectiveness and efficiency in the management and use of money, assets and other resources of the audited entity.", "explanation": "", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2019 - Đề Lẻ"}, {"id": "2019-le-translate-vi-en-2", "type": "translation", "prompt": "Chúng tôi tin rằng công ty của chúng tôi đã thành công; chúng tôi đạt lợi nhuận mỗi năm kể từ năm đầu tiên.", "answer": "We believe that our company has been successful: we have been profitable every year since the first year.", "explanation": "➔ S + believe that + Mệnh đề: ai đó tin rằng", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2019 - Đề Lẻ"}, {"id": "2019-le-translate-vi-en-3", "type": "translation", "prompt": "Hợp đồng kiểm toán còn bao gồm thỏa thuận với Ban Giám đốc đơn vị về trách nhiệm cung cấp cho kiểm toán viên báo cáo tài chính và các tài liệu có liên quan.", "answer": "The engagement also includes an agreement with management about the responsibility to provide the auditor with financial statements and related documents.", "explanation": "➔ the responsibility to V: trách nhiệm về việc gì", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2019 - Đề Lẻ"}, {"id": "2019-le-translate-vi-en-4", "type": "translation", "prompt": "Kiểm toán viên cần lưu ý các điều khoản liên quan đến việc tham gia của kiểm toán viên và chuyên gia khác vào một số công việc trong quá trình kiểm toán.", "answer": "The auditor should keep in mind the provisions relating to the engagement of the auditor and other experts in some work during the audit process.", "explanation": "➔ Relate to sth (v): Liên quan đến cái gì ➔ audit process (n) quá trình kiểm toán", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2019 - Đề Lẻ"}, {"id": "2019-le-translate-vi-en-5", "type": "translation", "prompt": "Thuế là thuật ngữ được áp dụng cho tất cả các loại thuế, từ thuế thu nhập, thuế thừa kế đến thuế bất động sản.", "answer": "Tax is the term applied to all taxes including income tax, inheritance tax and real estate tax.", "explanation": "➔ income taxes (n) thuế thu nhập ➔ inheritance tax (n) thuế thừa kế ➔ real estate tax (n) thuế bất động sản", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2019 - Đề Lẻ"}]}, {"year": "2020", "version": "chan", "items": [{"id": "2020-chan-vocab-1", "type": "fill_blank", "prompt": "My favorite …………. at school are Maths and English.", "answer": "subjects", "explanation": "Tính từ sở hữu+ adj + N\n( Môn học yêu thích của tôi ở trường là Toán và Tiếng Anh )\nFavorite subject: môn học yêu thích ( bổ nghĩa cho vế sau “Maths and English”).", "needs_review": true, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2020 - Đề Chẵn"}, {"id": "2020-chan-vocab-2", "type": "fill_blank", "prompt": "This colour makes customers more ....................... in the restaurant.", "answer": "interested", "explanation": "Make somebody + V : khiến ai đó như thế nào\nInterested in (v): hứng thú với\n( Màu sắc này khiến khách hàng hứng thú với nhà hàng hơn.)", "needs_review": true, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2020 - Đề Chẵn"}, {"id": "2020-chan-vocab-3", "type": "fill_blank", "prompt": "Are you not ....................... of doing the same things every day?", "answer": "bored", "explanation": "To be + S + adj + of + Ving ( Câu hỏi nghi vấn)\n( Bạn không cảm thấy nhàn chán khi phải làm những việc giống nhau mỗi ngày à?)", "needs_review": true, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2020 - Đề Chẵn"}, {"id": "2020-chan-vocab-4", "type": "fill_blank", "prompt": "These boys and girls perform ....................... dances.", "answer": "traditional", "explanation": "S + V + adj + N\n( Những chàng trai và cô gái biểu diễn các điệu múa truyền thống. )", "needs_review": true, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2020 - Đề Chẵn"}, {"id": "2020-chan-vocab-5", "type": "fill_blank", "prompt": "I don't ....................... that kind of behavior in my classes. Please do not do it again.", "answer": "tolerate", "explanation": "S + V + N\n( Tôi không chấp nhận hành vi đó trong các lớp học của tôi. Vui lòng đừng lặp lại nó. )", "needs_review": true, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2020 - Đề Chẵn"}, {"id": "2020-chan-vocab-6", "type": "fill_blank", "prompt": "Do you ....................... in God? Yes, I do.", "answer": "believe", "explanation": "Do/ Does + S + V +… ( Câu hỏi nghi vấn)\nBelieve in (v): tin vào điều gì\n( Bạn có tin vào Chúa không? Vâng, tôi có. )", "needs_review": true, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2020 - Đề Chẵn"}, {"id": "2020-chan-vocab-7", "type": "fill_blank", "prompt": "We wear our ....................... in the season of winter. They keep us warm.", "answer": "gloves", "explanation": "S + V + N\n( Chúng tôi đeo găng tay vào mùa đông. Chúng giữ

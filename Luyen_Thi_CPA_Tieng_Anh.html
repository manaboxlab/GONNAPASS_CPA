2", "type": "fill_blank", "prompt": "The report was full of errors because the data had been ___________ recorded. (ACCURACY)", "answer": "inaccurately", "explanation": "Accuracy (n): sự chính xác\nInaccurately (adv): một cách không chính xác\nDịch: Bản báo cáo đầy lỗi vì dữ liệu đã được ghi lại một cách không chính xác.", "needs_review": false, "section": "wordform", "section_label": "Từ loại (Word Formation)", "exam_label": "CPA 2025 - Đề Chẵn"}, {"id": "2025-chan-wordform-3", "type": "fill_blank", "prompt": "In today's market, companies must be ___________ to adapt quickly to new consumer trends. (FLEXIBILITY)", "answer": "flexible", "explanation": "Flexibility (n): tính linh hoạt\nFlexible (adj): linh hoạt\nDịch: Trong thị trường ngày nay, các công ty phải linh hoạt để thích ứng nhanh với xu hướng tiêu dùng mới.", "needs_review": false, "section": "wordform", "section_label": "Từ loại (Word Formation)", "exam_label": "CPA 2025 - Đề Chẵn"}, {"id": "2025-chan-wordform-4", "type": "fill_blank", "prompt": "The CEO emphasized that innovation and creativity are key factors in staying ___________ in a global economy. (COMPETE)", "answer": "competitive", "explanation": "Compete (v): cạnh tranh\nCompetitive (adj): có tính cạnh tranh\nDịch: Giám đốc điều hành nhấn mạnh rằng đổi mới và sáng tạo là những yếu tố then chốt để duy trì khả năng cạnh tranh trong nền kinh tế toàn cầu.", "needs_review": false, "section": "wordform", "section_label": "Từ loại (Word Formation)", "exam_label": "CPA 2025 - Đề Chẵn"}, {"id": "2025-chan-wordform-5", "type": "fill_blank", "prompt": "The government is encouraging companies to use more ___________ materials in their production. (RECYCLE)", "answer": "recyclable", "explanation": "Recycle (v): tái chế\nRecyclable (adj): có thể tái chế được\nDịch: Chính phủ đang khuyến khích các công ty sử dụng nhiều hơn nguyên liệu có thể tái chế được trong sản xuất.", "needs_review": false, "section": "wordform", "section_label": "Từ loại (Word Formation)", "exam_label": "CPA 2025 - Đề Chẵn"}, {"id": "2025-chan-sentence-build-1", "type": "sentence_building", "prompt": "The / report / not / complete / yet / by / the / team.", "answer": "The report has not been completed by the team yet.", "explanation": "– Thì hiện tại hoàn thành (thể bị động): have/has + not + been + V3 → diễn tả việc chưa hoàn thành tính đến hiện tại.\n– Dịch: Bản báo cáo vẫn chưa được nhóm hoàn thành.", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2025 - Đề Chẵn"}, {"id": "2025-chan-sentence-build-2", "type": "sentence_building", "prompt": "If/ I / know/ about/ meeting/ earlier, / I / prepare / presentation.", "answer": "If I had known about the meeting earlier, I would have prepared for the presentation.", "explanation": "– Câu điều kiện loại 3: If + had + V3, S + would have + V3 → giả định trái với quá khứ.\n– Dịch: Nếu tôi biết về cuộc họp sớm hơn, tôi đã chuẩn bị một bài thuyết trình.", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2025 - Đề Chẵn"}, {"id": "2025-chan-sentence-build-3", "type": "sentence_building", "prompt": "The / man / who / sit / next/ to / me/ yesterday/ be/ famous/ actor.", "answer": "The man who sat next to me yesterday is a famous actor.", "explanation": "– Mệnh đề quan hệ (who).\n– Dịch: Người đàn ông ngồi cạnh tôi hôm qua là một diễn viên nổi tiếng.", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2025 - Đề Chẵn"}, {"id": "2025-chan-sentence-build-4", "type": "sentence_building", "prompt": "Our / company/ expect/ launch/ new/ product/ by/ end/ year.", "answer": "Our company is expected to launch a new product by the end of the year.", "explanation": "– Cấu trúc: expect to V = mong đợi/dự kiến làm gì.\n– Dịch: Công ty chúng tôi được mong đợi sẽ ra mắt một sản phẩm mới vào cuối năm.", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2025 - Đề Chẵn"}, {"id": "2025-chan-sentence-build-5", "type": "sentence_building", "prompt": "She / be / promoted / because / her / hard work / and / dedication.", "answer": "She was promoted because of her hard work and dedication.", "explanation": "– Câu bị động: S + was/were + V3. Vì theo sau là cụm danh từ nên dùng \"because of\" thay vì \"because\".\n– Dịch: Cô ấy được thăng chức nhờ sự chăm chỉ và tận tâm của mình.", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2025 - Đề Chẵn"}, {"id": "2025-chan-sentence-build-6", "type": "sentence_building", "prompt": "I / not/ used to /work/ night shifts/ but/ now/ I / get / used to / it.", "answer": "I was not used to working night shifts, but now I get used to it.", "explanation": "– Cấu trúc: be used to + Ving/N = trước đây không quen làm gì; get used to + N/V-ing = trở nên quen với việc gì.\n– Dịch: Trước đây tôi không quen làm ca đêm, nhưng bây giờ tôi đã quen với việc đó.", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2025 - Đề Chẵn"}, {"id": "2025-chan-sentence-build-7", "type": "sentence_building", "prompt": "The/ project / delay/ last month/ due to/ technical/ problems.", "answer": "The project was delayed last month due to technical problems.", "explanation": "– Câu bị động, thì quá khứ đơn: S + was/were + V3; due to + danh từ = bởi vì.\n– Dịch: Dự án đã bị trì hoãn vào tháng trước do các vấn đề kỹ thuật.", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2025 - Đề Chẵn"}, {"id": "2025-chan-sentence-build-8", "type": "sentence_building", "prompt": "You/ should/ back up /your/ files / regularly / avoid/ losing/ data.", "answer": "You should back up your files regularly to avoid losing your data.", "explanation": "– Cấu trúc: to + V (nguyên mẫu) chỉ mục đích; avoid + V-ing = tránh làm gì.\n– Dịch: Bạn nên sao lưu tệp tin của mình thường xuyên để tránh mất dữ liệu.", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2025 - Đề Chẵn"}, {"id": "2025-chan-sentence-build-9", "type": "sentence_building", "prompt": "He / regret / not / take / job / offer / when / he / have/ chance.", "answer": "He regrets not taking the job offer when he had the chance.", "explanation": "– Cấu trúc: regret + V-ing = hối tiếc về việc đã (không) làm gì đó trong quá khứ.\n– Dịch: Anh ấy hối tiếc vì đã không nhận lời mời làm việc khi có cơ hội.", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2025 - Đề Chẵn"}, {"id": "2025-chan-sentence-build-10", "type": "sentence_building", "prompt": "By / time / we / arrive/ at/ station, /train/ already / leave.", "answer": "By the time we arrived at the station, the train had already left.", "explanation": "– Cấu trúc: By the time + S + V (quá khứ đơn), S + had + V3 (quá khứ hoàn thành) → hành động xảy ra trước một mốc thời gian trong quá khứ.\n– Dịch: Khi chúng tôi đến ga thì tàu đã rời đi rồi.", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2025 - Đề Chẵn"}, {"id": "2025-chan-transform-1", "type": "sentence_transformation", "prompt": "They have postponed the meeting until next Monday.", "answer": "The meeting has been postponed until next Monday.", "explanation": "- Câu bị động, thì hiện tại hoàn thành: S + have/has been + V3.\n- Dịch: Cuộc họp đã bị hoãn đến thứ Hai tuần sau.", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2025 - Đề Chẵn"}, {"id": "2025-chan-transform-2", "type": "sentence_transformation", "prompt": "“I didn't take your book,” said Tom.", "answer": "Tom denied taking my book.", "explanation": "- Cấu trúc: deny + V-ing = phủ nhận việc đã làm gì.\n- Dịch: Tom phủ nhận việc đã lấy cuốn sách của tôi.", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2025 - Đề Chẵn"}, {"id": "2025-chan-transform-3", "type": "sentence_transformation", "prompt": "I haven't seen her for five years.", "answer": "The last time I saw her was five years ago.", "explanation": "- Cấu trúc: The last time + S + V (quá khứ đơn) + was + khoảng thời gian + ago.\n- Dịch: Lần cuối tôi gặp cô ấy là năm năm trước.", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2025 - Đề Chẵn"}, {"id": "2025-chan-transform-4", "type": "sentence_transformation", "prompt": "You should take an umbrella or you'll get wet.", "answer": "If you don't take an umbrella, you'll get wet.", "explanation": "- Cấu trúc: câu điều kiện loại 1: If + S + don't/doesn't + V, S + will + V.\n- Dịch: Nếu bạn không mang ô, bạn sẽ bị ướt.", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2025 - Đề Chẵn"}, {"id": "2025-chan-transform-5", "type": "sentence_transformation", "prompt": "The manager said to the staff, “Please arrive on time tomorrow.”", "answer": "The manager told the staff to arrive on time the next day.", "explanation": "- Câu tường thuật với câu mệnh lệnh: S + told + O + to V; \"tomorrow\" chuyển thành \"the next day\".\n- Dịch: Người quản lý bảo nhân viên đến đúng giờ vào ngày hôm sau.", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2025 - Đề Chẵn"}, {"id": "2025-chan-translate-en-vi-1", "type": "translation", "prompt": "The government is taking steps to promote renewable energy projects in order to reduce dependence on fossil fuels.", "answer": "Chính phủ đang thực hiện các biện pháp nhằm thúc đẩy các dự án năng lượng tái tạo để giảm sự phụ thuộc vào nhiên liệu hóa thạch.", "explanation": "• renewable energy = năng lượng tái tạo\n• dependence on fossil fuels = sự phụ thuộc vào nhiên liệu hóa thạch", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2025 - Đề Chẵn"}, {"id": "2025-chan-translate-en-vi-2", "type": "translation", "prompt": "Inflation remains a major concern for many families as the cost of living continues to rise.", "answer": "Lạm phát vẫn là mối lo ngại lớn đối với nhiều gia đình khi chi phí sinh hoạt tiếp tục tăng.", "explanation": "• a major concern = một mối lo ngại lớn\n• cost of living = chi phí sinh hoạt", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2025 - Đề Chẵn"}, {"id": "2025-chan-translate-en-vi-3", "type": "translation", "prompt": "Many investors believe that Vietnam's growing digital economy offers great potential for long-term development.", "answer": "Nhiều nhà đầu tư tin rằng nền kinh tế số đang phát triển của Việt Nam mang lại tiềm năng lớn cho sự phát triển lâu dài.", "explanation": "• digital economy = nền kinh tế số\n• long-term development = sự phát triển lâu dài", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2025 - Đề Chẵn"}, {"id": "2025-chan-translate-en-vi-4", "type": "translation", "prompt": "The education sector is expected to benefit from new policies encouraging innovation and international cooperation.", "answer": "Ngành giáo dục được kỳ vọng sẽ hưởng lợi từ các chính sách mới khuyến khích đổi mới sáng tạo và hợp tác quốc tế.", "explanation": "• be expected to benefit from... = được kỳ vọng sẽ hưởng lợi từ...\n• international cooperation = hợp tác quốc tế", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2025 - Đề Chẵn"}, {"id": "2025-chan-translate-en-vi-5", "type": "translation", "prompt": "Sustainable businesses focus not only on profit but also on environmental and social responsibility.", "answer": "Các doanh nghiệp bền vững không chỉ tập trung vào lợi nhuận mà còn chú trọng đến trách nhiệm với môi trường và xã hội.", "explanation": "• not only... but also... = không những... mà còn...\n• environmental and social responsibility = trách nhiệm với môi trường và xã hội", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2025 - Đề Chẵn"}, {"id": "2025-chan-translate-vi-en-1", "type": "translation", "prompt": "Chính phủ đang nỗ lực thu hút thêm vốn đầu tư nước ngoài để thúc đẩy tăng trưởng kinh tế.", "answer": "The government is making efforts to attract more foreign investment to promote economic growth.", "explanation": "• attract foreign investment = thu hút vốn đầu tư nước ngoài\n• promote economic growth = thúc đẩy tăng trưởng kinh tế", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2025 - Đề Chẵn"}, {"id": "2025-chan-translate-vi-en-2", "type": "translation", "prompt": "Nhiều doanh nghiệp đang chuyển sang sử dụng năng lượng sạch nhằm giảm thiểu tác động đến môi trường.", "answer": "Many businesses are switching to clean energy in order to minimize their impact on the environment.", "explanation": "• switch to clean energy = chuyển sang sử dụng năng lượng sạch\n• minimize the impact on... = giảm thiểu tác động đến...", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2025 - Đề Chẵn"}, {"id": "2025-chan-translate-vi-en-3", "type": "translation", "prompt": "Đại dịch đã thay đổi cách con người làm việc và học tập, với sự gia tăng nhanh chóng của công nghệ trực tuyến.", "answer": "The pandemic has changed the way people work and study, with the rapid growth of online technology.", "explanation": "• the way people work and study = cách con người làm việc và học tập\n• rapid growth = sự gia tăng nhanh chóng", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2025 - Đề Chẵn"}, {"id": "2025-chan-translate-vi-en-4", "type": "translation", "prompt": "Giáo dục đóng vai trò quan trọng trong việc nâng cao nhận thức cộng đồng về phát triển bền vững.", "answer": "Education plays an important role in raising community’s awareness of sustainable development.", "explanation": "• play an important role in... = đóng vai trò quan trọng trong...\n• raise awareness of... = nâng cao nhận thức về...", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2025 - Đề Chẵn"}, {"id": "2025-chan-translate-vi-en-5", "type": "translation", "prompt": "Các chuyên gia cảnh báo rằng nếu không có hành động kịp thời, biến đổi khí hậu sẽ gây ra hậu quả nghiêm trọng cho tương lai của nhân loại.", "answer": "Experts warn that without timely actions, climate change will cause serious consequences on the future of humanity.", "explanation": "• without timely action = nếu không có hành động kịp thời\n• cause serious consequences = gây ra hậu quả nghiêm trọng\n--- TABLE 0 ---\nHỘI ĐỒNG THI KTV\nKẾ TOÁN VIÊN NĂM 2025 | ĐỀ THI VIẾT\nMÔN THI: Tiếng Anh\n--- TABLE 1 ---\ndecision | due to | take part in | on time | efficient\nresponsible | because | look after | deal with | according to\nget along with | make sure | opportunity | in charge of | instead\nimprove | tired of | at least | come up with | put off", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2025 - Đề Chẵn"}]}, {"year": "2025", "version": "le", "items": [{"id": "2025-le-vocab-1", "type": "fill_blank", "prompt": "He didn't mean to break the vase; it happened ___________.", "answer": "by accident", "explanation": "(Anh ấy không cố ý làm vỡ chiếc bình; điều đó xảy ra một cách vô tình.)\n- by accident = một cách tình cờ, vô tình (trái nghĩa với on purpose)", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-vocab-2", "type": "fill_blank", "prompt": "Our school's talent show will ___________ next Saturday evening.", "answer": "take place", "explanation": "(Buổi biểu diễn tài năng của trường sẽ diễn ra vào tối thứ Bảy tới.)\n- take place = diễn ra, xảy ra (dùng cho sự kiện)", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-vocab-3", "type": "fill_blank", "prompt": "She is ___________ organizing the company's annual event.", "answer": "responsible for", "explanation": "(Cô ấy chịu trách nhiệm tổ chức sự kiện thường niên của công ty.)\n- be responsible for N/Ving = chịu trách nhiệm về việc gì", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-vocab-4", "type": "fill_blank", "prompt": "Don't forget to ___________ your books after you finish studying.", "answer": "put away", "explanation": "(Đừng quên cất sách vở đi sau khi học xong.)\n- put away = cất, dọn đi (đồ vật)", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-vocab-5", "type": "fill_blank", "prompt": "I'm ___________ meeting you again next month in Hanoi.", "answer": "looking forward to", "explanation": "(Tôi rất mong được gặp lại bạn vào tháng tới tại Hà Nội.)\n- look forward to + V-ing = mong chờ, mong đợi làm gì", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-vocab-6", "type": "fill_blank", "prompt": "He didn't know the truth until he tried to ___________ what really happened.", "answer": "find out", "explanation": "(Anh ấy không biết sự thật cho đến khi cố gắng tìm hiểu chuyện gì đã thực sự xảy ra.)\n- find out = tìm ra, khám phá ra (thông tin, sự thật)", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-vocab-7", "type": "fill_blank", "prompt": "The students were asked to ___________ carefully during the lecture.", "answer": "take notes", "explanation": "(Học sinh được yêu cầu ghi chép cẩn thận trong suốt buổi giảng.)\n- take notes = ghi chú, ghi chép", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-vocab-8", "type": "fill_blank", "prompt": "My parents are very ___________ my graduation results.", "answer": "proud of", "explanation": "(Bố mẹ tôi rất tự hào về kết quả tốt nghiệp của tôi.)\n- be proud of = tự hào về điều gì", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-vocab-9", "type": "fill_blank", "prompt": "She had to ___________ a new job after moving to the city.", "answer": "apply for", "explanation": "(Cô ấy phải nộp đơn xin việc mới sau khi chuyển đến thành phố.)\n- apply for = nộp đơn xin (việc làm, học bổng...)", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-vocab-10", "type": "fill_blank", "prompt": "The teacher asked me to ___________ the answer more clearly.", "answer": "explain", "explanation": "(Giáo viên yêu cầu tôi giải thích câu trả lời rõ ràng hơn.)\n- explain = giải thích", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-vocab-11", "type": "fill_blank", "prompt": "___________, learning English is essential for future success.", "answer": "In my opinion", "explanation": "(Theo ý kiến của tôi, học tiếng Anh là điều cần thiết cho thành công trong tương lai.)\n- in my opinion = theo ý kiến của tôi (dùng để mở đầu quan điểm cá nhân)", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-vocab-12", "type": "fill_blank", "prompt": "They always ___________ each other, even when they disagree.", "answer": "get along with", "explanation": "(Họ luôn hòa hợp với nhau, ngay cả khi họ bất đồng ý kiến.)\n- get along with = hòa hợp, hòa thuận với ai", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-vocab-13", "type": "fill_blank", "prompt": "He was late for work yesterday, but today he arrived exactly ___________.", "answer": "on time", "explanation": "(Hôm qua anh ấy đi làm trễ, nhưng hôm nay anh ấy đến đúng giờ.)\n- on time = đúng giờ", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-vocab-14", "type": "fill_blank", "prompt": "I haven't made up my mind yet; I still need time to ___________.", "answer": "make a decision", "explanation": "(Tôi vẫn chưa quyết định; tôi vẫn cần thời gian để đưa ra quyết định.)\n- make a decision = đưa ra quyết định", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-vocab-15", "type": "fill_blank", "prompt": "She failed the exam; ___________, she couldn't enter university this year.", "answer": "as a result", "explanation": "(Cô ấy đã trượt kỳ thi; kết quả là cô ấy không thể vào đại học năm nay.)\n- as a result = kết quả là, do đó (nối 2 mệnh đề nguyên nhân - kết quả)", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-reading-open-1", "type": "open_short_answer", "passage": "Read the passage and answer the questions:\nIn today's interconnected world, education plays a crucial role in shaping global citizens. A global citizen is someone who understands the importance of cultural diversity, respects human rights, and takes responsibility for global issues such as climate change and poverty. Schools and universities now integrate global perspectives into their curriculum to prepare students for an increasingly international job market. By learning about other cultures and global challenges, young people can develop empathy and contribute to a more peaceful and sustainable world.", "prompt": "What does it mean to be a global citizen? (Bạn hiểu như thế nào là một công dân toàn cầu)", "answer": "A global citizen is someone who understands the importance of cultural diversity, respects human rights, and takes responsibility for global issues such as climate change and poverty. (Một công dân toàn cầu là người hiểu được tầm quan trọng của sự đa dạng văn hóa, tôn trọng quyền con người và có trách nhiệm với các vấn đề toàn cầu như biến đổi khí hậu và đói nghèo.) Thông tin câu: (2)", "explanation": "", "needs_review": false, "section": "reading-open", "section_label": "Đọc hiểu - Trả lời câu hỏi", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-reading-open-2", "type": "open_short_answer", "passage": "Read the passage and answer the questions:\nIn today's interconnected world, education plays a crucial role in shaping global citizens. A global citizen is someone who understands the importance of cultural diversity, respects human rights, and takes responsibility for global issues such as climate change and poverty. Schools and universities now integrate global perspectives into their curriculum to prepare students for an increasingly international job market. By learning about other cultures and global challenges, young people can develop empathy and contribute to a more peaceful and sustainable world.", "prompt": "What role does education play in shaping global citizens? (giáo dục đóng vai trò gì trong việc hình thành những công dân toàn cầu)", "answer": "Education plays a crucial role in shaping global citizens. (Giáo dục đóng vai trò then chốt trong việc hình thành những công dân toàn cầu.) Thông tin câu: (1)", "explanation": "", "needs_review": false, "section": "reading-open", "section_label": "Đọc hiểu - Trả lời câu hỏi", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-reading-open-3", "type": "open_short_answer", "passage": "Read the passage and answer the questions:\nIn today's interconnected world, education plays a crucial role in shaping global citizens. A global citizen is someone who understands the importance of cultural diversity, respects human rights, and takes responsibility for global issues such as climate change and poverty. Schools and universities now integrate global perspectives into their curriculum to prepare students for an increasingly international job market. By learning about other cultures and global challenges, young people can develop empathy and contribute to a more peaceful and sustainable world.", "prompt": "What global issues are mentioned in the passage? (Những vấn đề toàn cầu gì đang được đề cập trong đoạn văn)", "answer": "They are climate change and poverty. (Các vấn đề toàn cầu được nhắc đến là biến đổi khí hậu và đói nghèo.) Thông tin câu: (2)", "explanation": "", "needs_review": false, "section": "reading-open", "section_label": "Đọc hiểu - Trả lời câu hỏi", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-reading-open-4", "type": "open_short_answer", "passage": "Read the passage and answer the questions:\nIn today's interconnected world, education plays a crucial role in shaping global citizens. A global citizen is someone who understands the importance of cultural diversity, respects human rights, and takes responsibility for global issues such as climate change and poverty. Schools and universities now integrate global perspectives into their curriculum to prepare students for an increasingly international job market. By learning about other cultures and global challenges, young people can develop empathy and contribute to a more peaceful and sustainable world.", "prompt": "How are schools and universities helping students become global citizens? (Các trường học đã giúp học sinh trở thành những công dân toàn cầu như thế nào)", "answer": "Schools and universities are integrating global perspectives into their curriculum to prepare students for an increasingly international job market. (Các trường học và đại học đang lồng ghép các góc nhìn toàn cầu vào chương trình giảng dạy để chuẩn bị cho sinh viên bước vào thị trường việc làm ngày càng mang tính quốc tế.) Thông tin câu: (3)", "explanation": "", "needs_review": false, "section": "reading-open", "section_label": "Đọc hiểu - Trả lời câu hỏi", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-reading-open-5", "type": "open_short_answer", "passage": "Read the passage and answer the questions:\nIn today's interconnected world, education plays a crucial role in shaping global citizens. A global citizen is someone who understands the importance of cultural diversity, respects human rights, and takes responsibility for global issues such as climate change and poverty. Schools and universities now integrate global perspectives into their curriculum to prepare students for an increasingly international job market. By learning about other cultures and global challenges, young people can develop empathy and contribute to a more peaceful and sustainable world.", "prompt": "What are the benefits of learning about other cultures and global challenges? (Lợi ích của việc học về các nền văn hóa khác và các thử thách toàn cầu là gì)", "answer": "By learning about other cultures and global challenges, young people can develop empathy and contribute to a more peaceful and sustainable world. (Bằng việc tìm hiểu về các nền văn hóa khác và các thách thức toàn cầu, người trẻ có thể phát triển sự đồng cảm và đóng góp cho một thế giới hòa bình, bền vững hơn.) Thông tin câu: (4)", "explanation": "", "needs_review": false, "section": "reading-open", "section_label": "Đọc hiểu - Trả lời câu hỏi", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-reading-mcq-1", "type": "mcq", "passage": "Read the passage carefully and choose ONE which you think fits best\nSocial media has transformed the way people communicate and share their lives. Platforms like Facebook, Instagram, and TikTok allow users to connect instantly, express opinions, and discover trends. While these platforms help people stay in touch, they also create pressure to maintain a “perfect” online image. Some users spend too much time comparing themselves to others, leading to stress or low self-esteem. Experts suggest balancing online and offline activities to maintain mental health. Used wisely, social media can be a powerful tool for connection and learning.", "prompt": "What is the main idea of the passage? (Ý chính của đoạn văn trên là gì)", "options": [{"label": "A", "text": "The history of social media"}, {"label": "B", "text": "The negative effects of technology"}, {"label": "C", "text": "The influence of social media on modern lifestyles"}, {"label": "D", "text": "How to create a perfect online profile (Cách để tạo ra một hồ sơ trực tuyến hoàn hảo)\nGiải thích: Toàn bộ đoạn văn bàn về cách mạng xã hội ảnh hưởng đến đời sống hiện đại, gồm cả mặt tích cực lẫn tiêu cực (câu 1, 3, 4) → đáp án C."}], "answer": "C", "explanation": "Toàn bộ đoạn văn bàn về cách mạng xã hội ảnh hưởng đến đời sống hiện đại, gồm cả mặt tích cực lẫn tiêu cực (câu 1, 3, 4) → đáp án C.", "needs_review": false, "section": "reading-mcq", "section_label": "Đọc hiểu - Trắc nghiệm", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-reading-mcq-2", "type": "mcq", "passage": "Read the passage carefully and choose ONE which you think fits best\nSocial media has transformed the way people communicate and share their lives. Platforms like Facebook, Instagram, and TikTok allow users to connect instantly, express opinions, and discover trends. While these platforms help people stay in touch, they also create pressure to maintain a “perfect” online image. Some users spend too much time comparing themselves to others, leading to stress or low self-esteem. Experts suggest balancing online and offline activities to maintain mental health. Used wisely, social media can be a powerful tool for connection and learning.", "prompt": "Which of the following is a positive effect of social media? (Điều gì được nhắc đến là ảnh hưởng tích cực của mạng xã hội?)", "options": [{"label": "A", "text": "It helps people stay connected and informed."}, {"label": "B", "text": "It prevents people from expressing their opinions."}, {"label": "C", "text": "It causes stress and competition."}, {"label": "D", "text": "It increases the pressure to be perfect. (nó làm tăng áp lực để hoàn hảo)\nGiải thích: Câu 1, 2: \"Social media has transformed the way people communicate...\", \"...allow users to connect instantly, express opinions, and discover trends.\" → mạng xã hội giúp con người kết nối và cập nhật thông tin → đáp án A."}], "answer": "A", "explanation": "Câu 1, 2: \"Social media has transformed the way people communicate...\", \"...allow users to connect instantly, express opinions, and discover trends.\" → mạng xã hội giúp con người kết nối và cập nhật thông tin → đáp án A.", "needs_review": false, "section": "reading-mcq", "section_label": "Đọc hiểu - Trắc nghiệm", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-reading-mcq-3", "type": "mcq", "passage": "Read the passage carefully and choose ONE which you think fits best\nSocial media has transformed the way people communicate and share their lives. Platforms like Facebook, Instagram, and TikTok allow users to connect instantly, express opinions, and discover trends. While these platforms help people stay in touch, they also create pressure to maintain a “perfect” online image. Some users spend too much time comparing themselves to others, leading to stress or low self-esteem. Experts suggest balancing online and offline activities to maintain mental health. Used wisely, social media can be a powerful tool for connection and learning.", "prompt": "What problem do some users face because of social media? (Những vấn đề mà người dùng phải đối mặt khi sử dụng mạng xã hội)", "options": [{"label": "A", "text": "They can't communicate with friends."}, {"label": "B", "text": "They compare themselves to others and feel unhappy."}, {"label": "C", "text": "They become addicted to watching TV."}, {"label": "D", "text": "They stop learning about new trends. (Họ dừng việc học theo những xu hướng mới)\nGiải thích: Câu 4: \"Some users spend too much time comparing themselves to others, leading to stress or low self-esteem.\" → một số người dùng so sánh bản thân với người khác và cảm thấy không vui → đáp án B."}], "answer": "B", "explanation": "Câu 4: \"Some users spend too much time comparing themselves to others, leading to stress or low self-esteem.\" → một số người dùng so sánh bản thân với người khác và cảm thấy không vui → đáp án B.", "needs_review": false, "section": "reading-mcq", "section_label": "Đọc hiểu - Trắc nghiệm", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-reading-mcq-4", "type": "mcq", "passage": "Read the passage carefully and choose ONE which you think fits best\nSocial media has transformed the way people communicate and share their lives. Platforms like Facebook, Instagram, and TikTok allow users to connect instantly, express opinions, and discover trends. While these platforms help people stay in touch, they also create pressure to maintain a “perfect” online image. Some users spend too much time comparing themselves to others, leading to stress or low self-esteem. Experts suggest balancing online and offline activities to maintain mental health. Used wisely, social media can be a powerful tool for connection and learning.", "prompt": "What advice do experts give about using social media? (Các chuyên gia đưa ra lời khuyên gì về việc sử dụng mạng xã hội)", "options": [{"label": "A", "text": "Avoid using it completely."}, {"label": "B", "text": "Spend more time online than offline."}, {"label": "C", "text": "Balance online and offline life."}, {"label": "D", "text": "Use it only for entertainment. (Chỉ sử dụng nó để giải trí)\nGiải thích: Câu 5: \"Experts suggest balancing online and offline activities to maintain mental health.\" → các chuyên gia khuyên nên cân bằng giữa đời sống trực tuyến và ngoại tuyến → đáp án C."}], "answer": "C", "explanation": "Câu 5: \"Experts suggest balancing online and offline activities to maintain mental health.\" → các chuyên gia khuyên nên cân bằng giữa đời sống trực tuyến và ngoại tuyến → đáp án C.", "needs_review": false, "section": "reading-mcq", "section_label": "Đọc hiểu - Trắc nghiệm", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-reading-mcq-5", "type": "mcq", "passage": "Read the passage carefully and choose ONE which you think fits best\nSocial media has transformed the way people communicate and share their lives. Platforms like Facebook, Instagram, and TikTok allow users to connect instantly, express opinions, and discover trends. While these platforms help people stay in touch, they also create pressure to maintain a “perfect” online image. Some users spend too much time comparing themselves to others, leading to stress or low self-esteem. Experts suggest balancing online and offline activities to maintain mental health. Used wisely, social media can be a powerful tool for connection and learning.", "prompt": "What does the writer suggest about social media overall? (Tác giả gợi ý điều gì về việc sử dụng mạng xã hội nói chung)", "options": [{"label": "A", "text": "It can be useful if used properly."}, {"label": "B", "text": "It should be banned for young people."}, {"label": "C", "text": "It has only negative impacts."}, {"label": "D", "text": "It is more harmful than helpful. (Nó có hại hơn có lợi)\nGiải thích: Câu cuối: \"Used wisely, social media can be a powerful tool for connection and learning.\" → nếu sử dụng khôn ngoan, mạng xã hội có thể là công cụ hữu ích → đáp án A."}], "answer": "A", "explanation": "Câu cuối: \"Used wisely, social media can be a powerful tool for connection and learning.\" → nếu sử dụng khôn ngoan, mạng xã hội có thể là công cụ hữu ích → đáp án A.", "needs_review": false, "section": "reading-mcq", "section_label": "Đọc hiểu - Trắc nghiệm", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-cloze-1", "type": "cloze", "passage": "Read the text below and think of ONE word which best fits each space. There is an example at the beginning (0).\nTechnology is an important part of our lives today. We use it to study, to work, and to communicate with (0) others. Many people can't imagine a day (1) _____ their smartphone or computer.\nThe internet helps us find information quickly and stay (2) _____ with the world. We can also use it to shop online, watch movies, or listen to music. However, spending too much time on screens can be (3) _____ for our eyes and health. It's important to take breaks and move around (4) _____ using electronic devices for a long time.\nTechnology also makes working from home easier. Many companies allow employees to do their jobs (5) _____ home a few days a week. This gives people more time with their families and helps them save (6) _____ on travel costs.\nStill, not everyone has the same access to technology. Some rural areas have slow internet connections or (7) _____ no internet at all. Governments should help improve digital access so that everyone can enjoy the (8) _____/advantages of technology.\nIn the future, technology will continue to (9) _____/affect our lives in many ways. We need to use it wisely and remember that real-life connections are just as (10) _____", "gap_number": 1, "answer": "without", "explanation": "a day without their smartphone (prep) - một ngày mà không có điện thoại thông minh", "needs_review": false, "section": "cloze", "section_label": "Điền từ vào đoạn văn", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-cloze-2", "type": "cloze", "passage": "Read the text below and think of ONE word which best fits each space. There is an e ess so that everyone can enjoy the (8) _____/advantages of technology.\nIn the future, technology will continue to (9) _____/affect our lives in many ways. We need to use it wisely and remember that real-life connections are just as (10) _____", "gap_number": 9, "answer": "change", "explanation": "continue to change our lives (v) - tiếp tục thay đổi cuộc sống của chúng ta", "needs_review": false, "section": "cloze", "section_label": "Điền từ vào đoạn văn", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-cloze-10", "type": "cloze", "passage": "Read the text below and think of ONE word which best fits each space. There is an example at the beginning (0).\nTechnology is an important part of our lives today. We use it to study, to work, and to communicate with (0) others. Many people can't imagine a day (1) _____ their smartphone or computer.\nThe internet helps us find information quickly and stay (2) _____ with the world. We can also use it to shop online, watch movies, or listen to music. However, spending too much time on screens can be (3) _____ for our eyes and health. It's important to take breaks and move around (4) _____ using electronic devices for a long time.\nTechnology also makes working from home easier. Many companies allow employees to do their jobs (5) _____ home a few days a week. This gives people more time with their families and helps them save (6) _____ on travel costs.\nStill, not everyone has the same access to technology. Some rural areas have slow internet connections or (7) _____ no internet at all. Governments should help improve digital access so that everyone can enjoy the (8) _____/advantages of technology.\nIn the future, technology will continue to (9) _____/affect our lives in many ways. We need to use it wisely and remember that real-life connections are just as (10) _____", "gap_number": 10, "answer": "important", "explanation": "just as important as (adj) - quan trọng không kém", "needs_review": false, "section": "cloze", "section_label": "Điền từ vào đoạn văn", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-wordform-1", "type": "fill_blank", "prompt": "The company plans to increase its international ___________ next year. (EXPAND)", "answer": "expansion", "explanation": "Expand (v): mở rộng\nExpansion (n): sự mở rộng\nDịch: Công ty dự định tăng cường sự mở rộng quốc tế của mình vào năm tới.", "needs_review": false, "section": "wordform", "section_label": "Từ loại (Word Formation)", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-wordform-2", "type": "fill_blank", "prompt": "Some critics argue that globalization has led to the ___________ of local traditions and values. (LOSE)", "answer": "loss", "explanation": "Lose (v): mất, đánh mất\nLoss (n): sự mất mát\nDịch: Một số nhà phê bình cho rằng toàn cầu hóa đã dẫn đến sự mai một các truyền thống và giá trị địa phương.", "needs_review": false, "section": "wordform", "section_label": "Từ loại (Word Formation)", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-wordform-3", "type": "fill_blank", "prompt": "The manager wants to make the office more ___________ by introducing new technology. (PRODUCT)", "answer": "productive", "explanation": "Product (n): sản phẩm\nProductive (adj): có năng suất, hiệu quả\nDịch: Người quản lý muốn làm cho văn phòng làm việc năng suất hơn bằng cách đưa vào công nghệ mới.", "needs_review": false, "section": "wordform", "section_label": "Từ loại (Word Formation)", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-wordform-4", "type": "fill_blank", "prompt": "Many students find it hard to stay ___________ when studying from home. (MOTIVATE)", "answer": "motivated", "explanation": "Motivate (v): tạo động lực\nMotivated (adj): có động lực\nDịch: Nhiều học sinh cảm thấy khó giữ được động lực khi học tại nhà.", "needs_review": false, "section": "wordform", "section_label": "Từ loại (Word Formation)", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-wordform-5", "type": "fill_blank", "prompt": "The team's failure was mainly due to poor planning and complete ___________ of communication. (UNDERSTAND)", "answer": "misunderstanding", "explanation": "Understand (v): hiểu\nMisunderstanding (n): sự hiểu lầm\nDịch: Thất bại của nhóm chủ yếu là do việc lập kế hoạch kém và sự hiểu lầm hoàn toàn trong giao tiếp.", "needs_review": false, "section": "wordform", "section_label": "Từ loại (Word Formation)", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-sentence-build-1", "type": "sentence_building", "prompt": "If/ people/ recycle/ more,/ there/ be/ less/ waste/ on/ planet.", "answer": "If people recycle more, there will be less waste on the planet.", "explanation": "– Câu điều kiện loại 1: If + S + V (hiện tại đơn), S + will + V → dùng cho điều kiện có thể xảy ra ở tương lai.\n– Dịch: Nếu con người tái chế nhiều hơn, sẽ có ít rác thải hơn trên hành tinh.", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-sentence-build-2", "type": "sentence_building", "prompt": "The / factory / which/ cause /pollution/ be / closed/ last/ year.", "answer": "The factory which caused pollution was closed last year.", "explanation": "– Mệnh đề quan hệ (which) bổ nghĩa cho danh từ \"factory\" + câu bị động thì quá khứ đơn: S + was/were + V3.\n– Dịch: Nhà máy gây ô nhiễm đã bị đóng cửa vào năm ngoái.", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-sentence-build-3", "type": "sentence_building", "prompt": "Education/ play/ important/ role / in/ solving/ social/ problems.", "answer": "Education plays an important role in solving social problems.", "explanation": "– Cấu trúc: play an important role in + V-ing = đóng vai trò quan trọng trong việc gì; thì hiện tại đơn diễn tả sự thật hiển nhiên.\n– Dịch: Giáo dục đóng vai trò quan trọng trong việc giải quyết các vấn đề xã hội.", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-sentence-build-4", "type": "sentence_building", "prompt": "The/ government/ plan/ increase/ investment/ renewable/ energy.", "answer": "The government plans to increase investment in renewable energy.", "explanation": "– Cấu trúc: plan to V = có kế hoạch làm gì; investment in... = đầu tư vào...\n– Dịch: Chính phủ có kế hoạch tăng đầu tư vào năng lượng tái tạo.", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-sentence-build-5", "type": "sentence_building", "prompt": "Many/ endangered/ species/ protect / by / international/ organizations.", "answer": "Many endangered species are protected by international organizations.", "explanation": "– Câu bị động thì hiện tại đơn: S + am/is/are + V3 + by + tác nhân.\n– Dịch: Nhiều loài động vật có nguy cơ tuyệt chủng được bảo vệ bởi các tổ chức quốc tế.", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-sentence-build-6", "type": "sentence_building", "prompt": "If/ I / study / abroad, / I/ choose / course / related / to / sustainable / development.", "answer": "If I study abroad, I will choose a course related to sustainable development.", "explanation": "– Câu điều kiện loại 1: If + S + V (hiện tại đơn), S + will + V; related to = liên quan đến.\n– Dịch: Nếu tôi đi du học, tôi sẽ chọn một khóa học liên quan đến phát triển bền vững.", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-sentence-build-7", "type": "sentence_building", "prompt": "Online / learning / become / more / popular / since / pandemic / begin.", "answer": "Online learning has become more popular since the pandemic began.", "explanation": "– Cấu trúc: S + have/has + V3, since + S + V (quá khứ đơn) → thì hiện tại hoàn thành kết hợp với since.\n– Dịch: Việc học trực tuyến đã trở nên phổ biến hơn kể từ khi đại dịch bắt đầu.", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-sentence-build-8", "type": "sentence_building", "prompt": "The/ reason/ why / many / students/ volunteer/ (to be)/ that/ they / want/ help/ community.", "answer": "The reason why many students volunteer is that they want to help the community.", "explanation": "– Cấu trúc: The reason why + mệnh đề + is that + mệnh đề = lý do mà... là vì...\n– Dịch: Lý do mà nhiều sinh viên đi tình nguyện là vì họ muốn giúp đỡ cộng đồng.", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-sentence-build-9", "type": "sentence_building", "prompt": "We/ should/ use/ public/ transport/ instead/ drive/ private/ cars.", "answer": "We should use public transport instead of driving private cars.", "explanation": "– Cấu trúc: instead of + V-ing = thay vì làm gì.\n– Dịch: Chúng ta nên sử dụng phương tiện công cộng thay vì lái xe riêng.", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-sentence-build-10", "type": "sentence_building", "prompt": "Scientists/ warn/ that/ unless/ we/ act/ now, / climate/ change/ cause/ serious/ damage.", "answer": "Scientists warn that unless we act now, climate change will cause serious damage.", "explanation": "– Cấu trúc: unless + S + V (hiện tại đơn) = if... not (nếu không); mệnh đề chính dùng will + V.\n– Dịch: Các nhà khoa học cảnh báo rằng nếu chúng ta không hành động ngay bây giờ, biến đổi khí hậu sẽ gây ra thiệt hại nghiêm trọng.", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-transform-1", "type": "sentence_transformation", "prompt": "They started building the bridge two years ago.", "answer": "The bridge has been under construction for two years.", "explanation": "- Chuyển từ mốc thời gian bắt đầu (started... two years ago) sang khoảng thời gian kéo dài tính đến hiện tại: S + has/have been + under construction + for + khoảng thời gian.\n- Dịch: Cây cầu đã được xây dựng trong hai năm qua.", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-transform-2", "type": "sentence_transformation", "prompt": "“I'll call you when I arrive,” he said to me.", "answer": "He told me that he would call me when he arrived.", "explanation": "- Câu tường thuật: will → would, arrive (hiện tại đơn trong mệnh đề thời gian) → arrived (quá khứ đơn).\n- Dịch: Anh ấy nói với tôi rằng anh ấy sẽ gọi cho tôi khi anh ấy đến.", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-transform-3", "type": "sentence_transformation", "prompt": "It's a pity I can't attend the conference next week.", "answer": "I wish I could attend the conference next week.", "explanation": "- Cấu trúc: I wish + S + could + V (nguyên mẫu) → diễn tả ước muốn về khả năng ở hiện tại/tương lai.\n- Dịch: Tôi ước gì mình có thể tham dự hội nghị vào tuần tới.", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-transform-4", "type": "sentence_transformation", "prompt": "People expect that the company will announce a new product soon.", "answer": "The company is expected to announce a new product soon.", "explanation": "- Cấu trúc bị động với động từ tường thuật: S + is/are + expected + to V.\n- Dịch: Công ty được kỳ vọng sẽ công bố sản phẩm mới sớm.", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-transform-5", "type": "sentence_transformation", "prompt": "We didn't go hiking because the weather was terrible.", "answer": "If the weather hadn't been terrible, we would have gone hiking.", "explanation": "- Câu điều kiện loại 3: If + had + (not) + V3, S + would (not) have + V3 → giả định trái với quá khứ.\n- Dịch: Nếu thời tiết không quá tệ, chúng tôi đã đi leo núi.", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-translate-en-vi-1", "type": "translation", "prompt": "The government has introduced new policies to attract foreign investors and boost sustainable economic growth.", "answer": "Chính phủ đã ban hành các chính sách mới nhằm thu hút các nhà đầu tư nước ngoài và thúc đẩy tăng trưởng kinh tế bền vững.", "explanation": "• introduce new policies = ban hành các chính sách mới\n• boost sustainable economic growth = thúc đẩy tăng trưởng kinh tế bền vững", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-translate-en-vi-2", "type": "translation", "prompt": "Many young people are choosing remote work because it offers more flexibility and a better work-life balance.", "answer": "Nhiều người trẻ đang lựa chọn làm việc từ xa vì nó mang lại sự linh hoạt hơn và cân bằng tốt hơn giữa công việc và cuộc sống.", "explanation": "• remote work = làm việc từ xa\n• work-life balance = cân bằng giữa công việc và cuộc sống", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-translate-en-vi-3", "type": "translation", "prompt": "The Ministry of Education announced plans to integrate digital skills into the national curriculum starting next year.", "answer": "Bộ Giáo dục đã công bố kế hoạch tích hợp kỹ năng số vào chương trình giảng dạy quốc gia bắt đầu từ năm sau.", "explanation": "• integrate... into... = tích hợp... vào...\n• national curriculum = chương trình giảng dạy quốc gia", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-translate-en-vi-4", "type": "translation", "prompt": "Environmental experts warn that rapid urbanization is putting enormous pressure on natural resources and public infrastructure.", "answer": "Các chuyên gia môi trường cảnh báo rằng quá trình đô thị hóa nhanh chóng đang gây áp lực rất lớn lên tài nguyên thiên nhiên và cơ sở hạ tầng công cộng.", "explanation": "• rapid urbanization = đô thị hóa nhanh chóng\n• put pressure on... = gây áp lực lên...", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-translate-en-vi-5", "type": "translation", "prompt": "Companies that fail to adapt to green business models may face serious challenges in the global market.", "answer": "Các doanh nghiệp không thích ứng được với mô hình kinh doanh xanh có thể phải đối mặt với những thách thức nghiêm trọng trên thị trường toàn cầu.", "explanation": "• fail to adapt to... = không thích ứng được với...\n• face serious challenges = đối mặt với thách thức nghiêm trọng", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-translate-vi-en-1", "type": "translation", "prompt": "Chính phủ đang đẩy mạnh các chương trình đào tạo nghề để giảm tỷ lệ thất nghiệp trong thanh niên.", "answer": "The government is stepping up vocational training programs to reduce youth unemployment.", "explanation": "• vocational training programs = chương trình đào tạo nghề\n• youth unemployment = tỷ lệ thất nghiệp trong thanh niên", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-translate-vi-en-2", "type": "translation", "prompt": "Việc áp dụng công nghệ mới giúp doanh nghiệp tiết kiệm chi phí và nâng cao năng suất lao động.", "answer": "Applying new technology helps businesses save costs and improve labor productivity.", "explanation": "• save costs = tiết kiệm chi phí\n• labor productivity = năng suất lao động", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-translate-vi-en-3", "type": "translation", "prompt": "Ngày càng nhiều người tiêu dùng quan tâm đến các sản phẩm thân thiện với môi trường.", "answer": "More and more consumers are paying attention to environmentally friendly products.", "explanation": "• environmentally friendly products = sản phẩm thân thiện với môi trường", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-translate-vi-en-4", "type": "translation", "prompt": "Các trường đại học cần tăng cường hợp tác quốc tế để nâng cao chất lượng giảng dạy và nghiên cứu.", "answer": "Universities need to strengthen international cooperation to improve the quality of teaching and research.", "explanation": "• strengthen international cooperation = tăng cường hợp tác quốc tế", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2025 - Đề Lẻ"}, {"id": "2025-le-translate-vi-en-5", "type": "translation", "prompt": "Báo cáo cho thấy khoảng cách thu nhập giữa các khu vực thành thị và nông thôn vẫn còn khá lớn.", "answer": "The report shows that the income gap between urban and rural areas remains quite large.", "explanation": "• income gap = khoảng cách thu nhập\n• urban and rural areas = khu vực thành thị và nông thôn\n--- TABLE 0 ---\nHỘI ĐỒNG THI KTV\nKẾ TOÁN VIÊN NĂM 2025 | ĐỀ THI VIẾT\nMÔN THI: Tiếng Anh\n--- TABLE 1 ---\npromise | apply for | make a decision | In my opinion | by accident\nfind out | get along with | explain | proud of | at least\nlooking forward to | responsible for | as a result | borrow | interested in\ntake notes | turn on | take place | on time | put away", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2025 - Đề Lẻ"}]}]</script>
<script id="allowlist-data" type="application/json">{"b022c669": "Trần Hà Vy", "2b353ee0": "Nguyễn Thị Linh Chi", "7d3fe2d1": "Phạm Thị Thu Hà", "b37c4ffd": "Phạm Thị Thu Huyền"}</script>
<script>
(function(){
  "use strict";

  // ---------- data ----------
  var EXAMS = [];
  var ALL_ITEMS = [];
  var SECTIONS = [
    {key:"vocab", label:"Từ vựng - Collocation", icon:"🔤"},
    {key:"reading-mcq", label:"Đọc hiểu - Trắc nghiệm", icon:"📖"},
    {key:"reading-open", label:"Đọc hiểu - Trả lời câu hỏi", icon:"❓"},
    {key:"cloze", label:"Điền từ vào đoạn văn", icon:"✏️"},
    {key:"wordform", label:"Từ loại (Word Formation)", icon:"🔁"},
    {key:"sentence-build", label:"Viết câu từ gợi ý", icon:"🧩"},
    {key:"transform", label:"Viết lại câu", icon:"🔄"},
    {key:"translate-en-vi", label:"Dịch Anh → Việt", icon:"🇬🇧"},
    {key:"translate-vi-en", label:"Dịch Việt → Anh", icon:"🇻🇳"}
  ];
  var SECTION_LABEL = {}; SECTIONS.forEach(function(s){ SECTION_LABEL[s.key]=s.label; });
  var AUTO_GRADED = {"mcq":1,"fill_blank":1,"cloze":1};

  // ---------- state ----------
  var state = {
    profile: null,
    view: "loading",
    session: null,
    statsCache: null
  };

  function el(id){ return document.getElementById(id); }
  function esc(s){ return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function slugify(s){
    return (s||"").toString().trim().toLowerCase()
      .normalize("NFD").replace(/[̀-ͯ]/g,"")
      .replace(/đ/g,"d").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"") || "user";
  }
  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function fmtPct(n,d){ return d? Math.round(n/d*100)+"%" : "—"; }

  // Whether this page is running as a live claude.ai artifact (has the db runtime)
  // vs. a standalone/offline HTML file. The phone-number allowlist gate only makes
  // sense when there's a shared db to check against -- opened as a plain file there
  // is no server to ask, so the login screen falls back to simple name entry instead
  // of locking everyone out. Everything else (questions, grading, stats-per-browser)
  // works the same either way.
  var hasClaudeRuntime = !!(window.claude && window.claude.use);

  // ---------- persistence: db capability with localStorage fallback ----------
  var dbNs = null, dbReady = false;
  function ready(){ return window.claude && window.claude.use ? window.claude.use("db") : Promise.resolve(null); }
  ready().then(function(ns){ dbNs = ns; dbReady = true; }).catch(function(){ dbReady = true; });

  function lsGet(key, fallback){
    try{ var v = localStorage.getItem(key); return v? JSON.parse(v): fallback; }catch(e){ return fallback; }
  }
  function lsSet(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

  function waitDb(){
    return new Promise(function(resolve){
      var tries=0;
      (function poll(){
        if(dbReady || tries>60){ resolve(dbNs); return; }
        tries++; setTimeout(poll,100);
      })();
    });
  }

  function docGet(path, fallback){
    return waitDb().then(function(ns){
      if(!ns) return lsGet("local:"+path, fallback);
      return ns.doc(path).get().then(function(res){
        var data = (res && (res.data || res.value || res)) || null;
        if(res && res.exists === false) return fallback;
        return data || fallback;
      }).catch(function(){ return lsGet("local:"+path, fallback); });
    });
  }
  function docSet(path, value){
    lsSet("local:"+path, value); // always mirror locally as a safety net
    return waitDb().then(function(ns){
      if(!ns) return true;
      return ns.doc(path).set(value).catch(function(){ return false; });
    });
  }

  function getProfilesDoc(){ return docGet("app/profiles", {list:[]}); }
  function saveProfilesDoc(doc){ return docSet("app/profiles", doc); }
  function getStatsDoc(profileId){ return docGet("stats/"+profileId, {profileId:profileId, questions:{}, sessions:[]}); }
  function saveStatsDoc(profileId, doc){ return docSet("stats/"+profileId, doc); }

  // ---------- profile ----------
  function loadLocalProfile(){ return lsGet("cpa:profile", null); }
  function setLocalProfile(p){ lsSet("cpa:profile", p); }

  // ---------- access gate: phone number allowlist ----------
  // On the live artifact, the list of {phone: name} is NOT embedded in this file --
  // it lives in the artifact's shared db under collection "allowlist" (doc id =
  // normalized phone), so Manabox staff can add/remove clients at any time without
  // republishing. A standalone exported file has no server to ask, so it instead
  // checks a SNAPSHOT of that same list embedded at export time (see loadData() /
  // the "allowlist-data" script tag) -- phone numbers are hashed before embedding so
  // the file's source doesn't show them in plain text. Either way this is a soft gate
  // only (all checks run in the visitor's own browser), meant to keep casual/
  // unintended visitors out, not as strong access control for sensitive data.
  function normalizePhone(s){
    var d = (s||"").toString().replace(/\D+/g,"");
    if(d.length===11 && d.slice(0,2)==="84") d = "0"+d.slice(2);
    else if(d.length===9) d = "0"+d;
    return d;
  }
  function checkAllowlist(phone){ return docGet("allowlist/"+phone, null); }

  // Small synchronous string hash (FNV-1a, 32-bit) -- not cryptographically secure,
  // but avoids sitting plaintext client phone numbers in an exported file's source,
  // and works even over file:// where the Web Crypto API may be unavailable.
  function simpleHash(str){
    var h = 0x811c9dc5;
    for(var i=0;i<str.length;i++){
      h ^= str.charCodeAt(i);
      // Math.imul does true 32-bit integer multiplication -- a plain `h * k` here
      // would silently lose precision once h gets large (JS numbers are floats),
      // producing a hash that can't be reproduced by the Python export script that
      // computes the same FNV-1a with exact-precision integers.
      h = Math.imul(h, 0x01000193) >>> 0;
    }
    return h.toString(16);
  }
  var EMBEDDED_ALLOWLIST = null;
  function loadEmbeddedAllowlist(){
    if(EMBEDDED_ALLOWLIST) return EMBEDDED_ALLOWLIST;
    try{
      var tag = document.getElementById("allowlist-data");
      EMBEDDED_ALLOWLIST = tag ? JSON.parse(tag.textContent) : {};
    }catch(e){ EMBEDDED_ALLOWLIST = {}; }
    return EMBEDDED_ALLOWLIST;
  }
  function checkAllowlistEmbedded(phone){
    var name = loadEmbeddedAllowlist()[simpleHash(phone)];
    return name ? {name:name} : null;
  }

  function ensureProfile(id, name){
    return getProfilesDoc().then(function(doc){
      doc.list = doc.list || [];
      var existing = doc.list.filter(function(p){ return p.id===id; })[0];
      if(!existing){
        existing = {id:id, name:name.trim(), createdAt: Date.now()};
        doc.list.push(existing);
        return saveProfilesDoc(doc).then(function(){ return existing; });
      }
      if(existing.name !== name){
        existing.name = name; // keep display name in sync if it was corrected in the allowlist
        return saveProfilesDoc(doc).then(function(){ return existing; });
      }
      return existing;
    });
  }

  // Verifies the phone against the allowlist (live db on the artifact, embedded
  // snapshot in a standalone file) and returns the matching profile (creating/
  // reusing it, keyed by phone) or null if not authorized.
  function authenticateByPhone(rawPhone){
    var phone = normalizePhone(rawPhone);
    if(!phone) return Promise.resolve(null);
    var lookup = hasClaudeRuntime ? checkAllowlist(phone) : Promise.resolve(checkAllowlistEmbedded(phone));
    return lookup.then(function(entry){
      if(!entry || !entry.name) return null;
      return ensureProfile(phone, entry.name);
    });
  }

  // ---------- recording attempts ----------
  function recordAttempt(item, isCorrect){
    if(!state.profile) return Promise.resolve();
    var pid = state.profile.id;
    return getStatsDoc(pid).then(function(doc){
      doc.questions = doc.questions || {};
      var q = doc.questions[item.id] || {attempts:0, correct:0, wrong:0, section:item.section, year:item.year, lastAt:0, lastCorrect:null};
      q.attempts += 1;
      if(isCorrect){ q.correct += 1; } else { q.wrong += 1; }
      q.lastAt = Date.now();
      q.lastCorrect = !!isCorrect;
      q.section = item.section;
      q.year = item.year;
      doc.questions[item.id] = q;
      return saveStatsDoc(pid, doc);
    });
  }
  function recordSession(mode, total, correct){
    if(!state.profile) return Promise.resolve();
    var pid = state.profile.id;
    return getStatsDoc(pid).then(function(doc){
      doc.sessions = doc.sessions || [];
      doc.sessions.unshift({mode:mode, total:total, correct:correct, at:Date.now()});
      doc.sessions = doc.sessions.slice(0,50);
      return saveStatsDoc(pid, doc);
    });
  }
  // Flips a just-recorded attempt's correct/wrong outcome without counting it as a
  // second attempt (used when the student overrides the auto-grader's verdict).
  function correctLastAttempt(item, newIsCorrect){
    if(!state.profile) return Promise.resolve();
    var pid = state.profile.id;
    return getStatsDoc(pid).then(function(doc){
      doc.questions = doc.questions || {};
      var q = doc.questions[item.id];
      if(!q || q.lastCorrect === newIsCorrect) return;
      if(newIsCorrect){ q.correct += 1; q.wrong = Math.max(0, q.wrong-1); }
      else { q.wrong += 1; q.correct = Math.max(0, q.correct-1); }
      q.lastCorrect = newIsCorrect;
      doc.questions[item.id] = q;
      return saveStatsDoc(pid, doc);
    });
  }

  // ---------- grading helpers ----------
  function normalize(s){
    return (s||"").toString().trim().toLowerCase()
      .replace(/[‘’]/g,"'").replace(/[“”]/g,'"')
      .replace(/\s+/g," ").replace(/[.!?;:,]+$/,"");
  }
  function fillBlankCorrect(user, answer){
    if(!answer) return null;
    var alts = answer.split("/").map(normalize).filter(Boolean);
    return alts.indexOf(normalize(user)) !== -1;
  }

  // ---------- auto-grading for open-ended (essay-style) answers ----------
  // Translation / sentence-building / rewriting / reading-open answers accept many
  // valid phrasings, so we cannot exact-match like fillBlankCorrect. Instead we score
  // how many of the model answer's content words (stopwords removed) also appear in
  // what the student typed, and compare against a per-section threshold. This is an
  // approximation, not a real grammar/meaning check -- the UI always shows the score
  // and lets the student flip the verdict if the auto-grade looks wrong.
  var STOPWORDS_EN = {"a":1,"an":1,"the":1,"is":1,"are":1,"was":1,"were":1,"am":1,"to":1,"of":1,"in":1,
    "on":1,"at":1,"for":1,"and":1,"or":1,"but":1,"with":1,"that":1,"this":1,"these":1,"those":1,
    "it":1,"its":1,"he":1,"she":1,"they":1,"we":1,"you":1,"i":1,"his":1,"her":1,"their":1,"our":1,
    "your":1,"be":1,"been":1,"being":1,"as":1,"by":1,"from":1,"not":1,"no":1,"do":1,"does":1,"did":1,
    "will":1,"would":1,"can":1,"could":1,"should":1,"have":1,"has":1,"had":1,"so":1,"if":1,"than":1,
    "then":1,"there":1,"what":1,"who":1,"whom":1,"which":1,"when":1,"where":1,"why":1,"how":1,"very":1,
    "just":1,"also":1,"about":1,"into":1,"up":1,"out":1,"some":1,"such":1,"more":1,"most":1};
  var STOPWORDS_VI = {"là":1,"của":1,"và":1,"có":1,"được":1,"cho":1,"trong":1,"với":1,"các":1,"một":1,
    "những":1,"đã":1,"sẽ":1,"này":1,"đó":1,"khi":1,"nếu":1,"thì":1,"mà":1,"nên":1,"vì":1,"để":1,"như":1,
    "cũng":1,"rất":1,"bị":1,"bởi":1,"tại":1,"về":1,"từ":1,"theo":1,"hay":1,"hoặc":1,"không":1,"chưa":1,
    "đang":1,"vẫn":1,"còn":1,"nữa":1,"ra":1,"vào":1,"lên":1,"xuống":1,"đi":1,"lại":1,"là":1,"trên":1,
    "dưới":1,"nhiều":1,"ít":1,"đây":1,"đấy":1,"kia":1,"ạ":1,"nhé":1};
  function tokenizeForGrading(s){
    if(!s) return [];
    var norm = s.toString().toLowerCase();
    norm = norm.replace(/\([^)]*\)/g," "); // drop footnote refs / parenthetical glosses
    norm = norm.replace(/[^\p{L}\p{N}\s]/gu," ");
    var toks = norm.split(/\s+/).filter(Boolean);
    return toks.filter(function(t){ return t.length>1 && !STOPWORDS_EN[t] && !STOPWORDS_VI[t]; });
  }
  var AUTO_GRADE_THRESHOLD = {
    "translate-en-vi": 0.5,
    "translate-vi-en": 0.5,
    "sentence-build": 0.7,
    "transform": 0.5,
    "reading-open": 0.5
  };
  function fuzzyScoreAgainst(userTokenSet, modelAnswerAlt){
    var modelToks = tokenizeForGrading(modelAnswerAlt);
    if(modelToks.length===0) return 0;
    var hit = 0;
    modelToks.forEach(function(w){ if(userTokenSet[w]) hit++; });
    return hit/modelToks.length;
  }
  function autoGradeOpenEnded(userText, modelAnswer, section){
    var userToks = tokenizeForGrading(userText);
    var userSet = {};
    userToks.forEach(function(w){ userSet[w]=1; });
    var alts = (modelAnswer||"").split("/");
    var best = 0;
    alts.forEach(function(alt){
      var sc = fuzzyScoreAgainst(userSet, alt);
      if(sc>best) best = sc;
    });
    var threshold = AUTO_GRADE_THRESHOLD[section] != null ? AUTO_GRADE_THRESHOLD[section] : 0.55;
    return { score: best, isCorrect: userToks.length>0 && best >= threshold };
  }

  // ---------- data loading ----------
  function loadData(){
    return new Promise(function(resolve, reject){
      try{
        var tag = document.getElementById("qbank-data");
        var exams = tag ? JSON.parse(tag.textContent) : null;
        if(!exams) throw new Error("no embedded data");
        resolve(exams);
      }catch(e){ reject(e); }
    }).then(function(exams){
      EXAMS = exams;
      ALL_ITEMS = [];
      exams.forEach(function(exam){
        exam.items.forEach(function(it){
          it.year = exam.year; it.version = exam.version;
          ALL_ITEMS.push(it);
        });
      });
    });
  }

    else if(state.view==="home") html += renderHome();
    else if(state.view==="pickYear") html += renderPickYear();
    else if(state.view==="pickSections") html += renderPickSections();
    else if(state.view==="practice") html += renderPractice();
    else if(state.view==="summary") html += renderSummary();
    else if(state.view==="stats") html += renderStats();
    app.innerHTML = html;
    bindEvents();
  }

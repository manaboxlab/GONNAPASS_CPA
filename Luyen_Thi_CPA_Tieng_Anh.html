<title>Luyện Thi CPA</title>
<style>
  :root{
    --bg:#f5f6f8;
    --surface:#ffffff;
    --surface-2:#eef0f4;
    --ink:#151a26;
    --muted:#5b6472;
    --line:#dde1e8;
    --accent:#002060;
    --accent-ink:#ffffff;
    --accent-soft:#e7ecf8;
    --success:#15794e;
    --success-soft:#e3f5ec;
    --danger:#b4232f;
    --danger-soft:#fbe9ea;
    --warn:#8a5b00;
    --warn-soft:#fdf1dc;
    --radius:12px;
    --font-display:'Lexend',system-ui,-apple-system,'Segoe UI',sans-serif;
    --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12151c;
      --surface:#1a1f29;
      --surface-2:#222835;
      --ink:#eef1f6;
      --muted:#98a1b0;
      --line:#2c333f;
      --accent:#5b7fd6;
      --accent-ink:#0b1220;
      --accent-soft:#1e2a44;
      --success:#4fd39a;
      --success-soft:#173428;
      --danger:#f0808a;
      --danger-soft:#3a1c22;
      --warn:#e2b455;
      --warn-soft:#3a2f16;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12151c;
    --surface:#1a1f29;
    --surface-2:#222835;
    --ink:#eef1f6;
    --muted:#98a1b0;
    --line:#2c333f;
    --accent:#5b7fd6;
    --accent-ink:#0b1220;
    --accent-soft:#1e2a44;
    --success:#4fd39a;
    --success-soft:#173428;
    --danger:#f0808a;
    --danger-soft:#3a1c22;
    --warn:#e2b455;
    --warn-soft:#3a2f16;
  }
  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.5;
    padding:0 16px;
    padding-block:16px;
    min-height:100%;
  }
  html,body{height:100%;}
  h1,h2,h3{font-family:var(--font-display); text-wrap:balance; margin:0;}
  .wrap{max-width:880px; margin:0 auto; display:flex; flex-direction:column; gap:16px;}
  .topbar{
    position:sticky; top:env(safe-area-inset-top,0px);
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:10px 14px; z-index:5;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .mark{
    width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);
    display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:600;font-size:13px;flex:none;
  }
  .brand .name{font-family:var(--font-display); font-weight:600; font-size:15px;}
  .brand .name small{display:block; font-family:var(--font-body); font-weight:400; color:var(--muted); font-size:11.5px;}
  .userpill{
    display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--line);
    border-radius:999px; padding:5px 10px 5px 6px; font-size:13px; cursor:pointer; color:var(--ink);
  }
  .userpill .dot{width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px;}
  .grid{display:grid; gap:12px;}
  .grid.cols-2{grid-template-columns:1fr 1fr;}
  .grid.cols-3{grid-template-columns:1fr 1fr 1fr;}
  @media (max-width:560px){ .grid.cols-2,.grid.cols-3{grid-template-columns:1fr;} }
  .menu-btn{
    display:flex; flex-direction:column; gap:4px; text-align:left; background:var(--surface);
    border:1px solid var(--line); border-radius:var(--radius); padding:16px; cursor:pointer;
    font-family:var(--font-body); color:var(--ink); transition:border-color .15s, transform .1s;
  }
  .menu-btn:hover{border-color:var(--accent);}
  .menu-btn:active{transform:scale(.99);}
  .menu-btn .ic{font-size:20px;}
  .menu-btn .t{font-family:var(--font-display); font-weight:600; font-size:15px;}
  .menu-btn .d{color:var(--muted); font-size:12.5px;}
  button{font-family:var(--font-body); cursor:pointer;}
  .btn{
    background:var(--accent); color:var(--accent-ink); border:none; border-radius:9px;
    padding:10px 16px; font-size:14px; font-weight:600;
  }
  .btn.secondary{background:var(--surface-2); color:var(--ink); border:1px solid var(--line);}
  .btn.ghost{background:transparent; color:var(--accent); border:1px solid var(--accent);}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .row{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .row.between{justify-content:space-between;}
  .pill{
    display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px;
    font-size:12px; font-weight:600; background:var(--surface-2); color:var(--muted); border:1px solid var(--line);
  }
  .pill.on{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  .pill.success{background:var(--success-soft); color:var(--success); border-color:transparent;}
  .pill.danger{background:var(--danger-soft); color:var(--danger); border-color:transparent;}
  .pill.warn{background:var(--warn-soft); color:var(--warn); border-color:transparent;}
  input[type=text],textarea{
    width:100%; font-family:var(--font-body); font-size:14.5px; color:var(--ink);
    background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px 12px;
  }
  textarea{resize:vertical; min-height:64px;}
  label.field{display:flex; flex-direction:column; gap:6px; font-size:12.5px; color:var(--muted); font-weight:600;}
  .passage{
    background:var(--surface-2); border-radius:9px; padding:14px; font-size:14.5px; line-height:1.65;
    white-space:pre-wrap; margin-bottom:12px; max-height:340px; overflow-y:auto;
  }
  .qtext{font-size:16px; line-height:1.55; margin-bottom:14px; white-space:pre-wrap;}
  .qtext .blank{display:inline-block; min-width:70px; border-bottom:2px solid var(--accent); color:var(--accent); font-weight:700;}
  .options{display:flex; flex-direction:column; gap:8px;}
  .opt{
    display:flex; gap:10px; align-items:flex-start; border:1px solid var(--line); border-radius:9px;
    padding:11px 13px; cursor:pointer; background:var(--surface);
  }
  .opt:hover{border-color:var(--accent);}
  .opt input{margin-top:3px;}
  .opt.correct{border-color:var(--success); background:var(--success-soft);}
  .opt.wrong{border-color:var(--danger); background:var(--danger-soft);}
  .opt .lab{
    flex:none; width:22px; height:22px; border-radius:50%; background:var(--surface-2); font-size:12px;
    font-weight:700; display:flex; align-items:center; justify-content:center; border:1px solid var(--line);
  }
  .feedback{border-radius:9px; padding:12px 14px; margin-top:12px; font-size:14px;}
  .feedback.ok{background:var(--success-soft); color:var(--success);}
  .feedback.bad{background:var(--danger-soft); color:var(--danger);}
  .explain{margin-top:10px; font-size:13.5px; color:var(--muted); white-space:pre-wrap; border-top:1px dashed var(--line); padding-top:10px;}
  .progressbar{height:6px; background:var(--surface-2); border-radius:999px; overflow:hidden;}
  .progressbar > div{height:100%; background:var(--accent);}
  .statgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  @media (max-width:560px){ .statgrid{grid-template-columns:1fr 1fr;} }
  .stattile{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 14px;}
  .stattile .n{font-family:var(--font-display); font-size:24px; font-weight:600; font-variant-numeric:tabular-nums;}
  .stattile .l{font-size:11.5px; color:var(--muted); margin-top:2px;}
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th,td{text-align:left; padding:8px 6px; border-bottom:1px solid var(--line);}
  th{color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.03em;}
  td.num,th.num{text-align:right; font-variant-numeric:tabular-nums;}
  .tablewrap{overflow-x:auto;}
  .barrow{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
  .barrow .lbl{width:150px; flex:none; font-size:12.5px; color:var(--muted); text-align:right;}
  .barrow .track{flex:1; background:var(--surface-2); border-radius:6px; height:14px; position:relative; overflow:hidden;}
  .barrow .fill{height:100%; border-radius:6px;}
  .barrow .val{width:40px; flex:none; font-size:12px; font-variant-numeric:tabular-nums; color:var(--muted);}
  .muted{color:var(--muted);}
  .small{font-size:12.5px;}
  .center{text-align:center;}
  .backlink{color:var(--muted); font-size:13px; background:none; border:none; padding:0; text-decoration:underline; cursor:pointer;}
  .filterchips{display:flex; gap:8px; flex-wrap:wrap;}
  .chip{
    padding:7px 12px; border-radius:999px; border:1px solid var(--line); background:var(--surface);
    font-size:13px; cursor:pointer; color:var(--ink);
  }
  .chip.on{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  select{
    font-family:var(--font-body); font-size:14px; padding:9px 10px; border-radius:8px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink);
  }
  a.godl{color:var(--accent);}
  ::selection{background:var(--accent-soft);}
</style>

lank", "prompt": "Oscar had eaten so much he had to ....................... his belt. (LOOSE)", "answer": "loosen", "explanation": "Loose (adj)lỏng, chùng\n➔ Loosen (v) nới lỏng (nới lỏng thắt lưng)", "needs_review": false, "section": "wordform", "section_label": "Từ loại (Word Formation)", "exam_label": "CPA 2016 - Đề Chẵn"}, {"id": "2016-chan-wordform-4", "type": "fill_blank", "prompt": "The thief replaced the diamond with a ....................... stone.(WORTH)", "answer": "worthless", "explanation": "Worth (n) giá trị\n➔ Worthless (adj) vô giá trị", "needs_review": false, "section": "wordform", "section_label": "Từ loại (Word Formation)", "exam_label": "CPA 2016 - Đề Chẵn"}, {"id": "2016-chan-wordform-5", "type": "fill_blank", "prompt": "Uncertainty about the company’s future meant that few people wanted to invest money in it\n(CERTAIN)", "answer": null, "explanation": "(CERTAIN)\nCertain (adj) chắc chắn\nCertainty (n): sự chắc chắn\n➔ Uncertainty (n) sự không chắc chắn (hiểu nghĩa của câu: sự không chắc chắn về tương lai\ncủa công ty làm cho ít người muốn đầu tư tiền vào nó)", "needs_review": true, "section": "wordform", "section_label": "Từ loại (Word Formation)", "exam_label": "CPA 2016 - Đề Chẵn"}, {"id": "2016-chan-sentence-build-1", "type": "sentence_building", "prompt": "If you / take this exam / study / be / likely / fail //", "answer": "If you take this exam without studying, you are likely to fail.", "explanation": "➔ Câu điều kiện loại 1: [If + thì hiện tại đơn], [will + động từ nguyên mẫu]: được dùng để\nnói về một sự việc có thể xảy ra ở hiện tại hoặc tương lai nếu có một điều kiện nào đó.", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2016 - Đề Chẵn"}, {"id": "2016-chan-sentence-build-2", "type": "sentence_building", "prompt": "The children / full / excitement / at / thought / their coming holiday //", "answer": "The children are full of excitement at the thought of their coming holiday.", "explanation": "➔ be full of sth (v) tràn ngập với\n➔ at the thought of (idioms) khi nghĩ đến", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2016 - Đề Chẵn"}, {"id": "2016-chan-sentence-build-3", "type": "sentence_building", "prompt": "Many attempts / make / overcome / language barrier / little success / make //", "answer": "Many attempts have been made to overcome the language barrier but little success has been", "explanation": "➔ Câu bị động ở thì hiện tại hoàn thành: O + have/has + been + V + (by S)\nPP", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2016 - Đề Chẵn"}, {"id": "2016-chan-sentence-build-4", "type": "sentence_building", "prompt": "Young people / less and less / dependent / their parents / tend /develop / independent", "answer": "thinking //", "explanation": "➔ be dependent on/upon sb: phụ thuộc vào ai đó\n➔ to tend to + V (v) có xu hướng", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2016 - Đề Chẵn"}, {"id": "2016-chan-sentence-build-5", "type": "sentence_building", "prompt": "The climate / Britain / same / that / northwestern Europe //", "answer": "The climate of Britain is the same as that of northwestern Europe.", "explanation": "➔ S + be the same as + O : so sánh ngang bằng", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2016 - Đề Chẵn"}, {"id": "2016-chan-sentence-build-6", "type": "sentence_building", "prompt": "Jack London / life and writings / think / by many people / represent / American / love /", "answer": "adventure//", "explanation": "➔ Câu chủ động: S1 + think + S2 + V + O\n➔ Câu bị động: S2 + be + thought+ (by S1) + to V + O", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2016 - Đề Chẵn"}, {"id": "2016-chan-sentence-build-7", "type": "sentence_building", "prompt": "They / no / intention / put / end / crisis / those days //", "answer": "They had no intention of putting an end to the crisis in those days.", "explanation": "➔ have no intention of Ving(v) không có ý định làm gì", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2016 - Đề Chẵn"}, {"id": "2016-chan-sentence-build-8", "type": "sentence_building", "prompt": "James Watt / Scottish scientist / invent / steam engine //", "answer": "James Watt, a Scottish scientist, invented the steam engine.", "explanation": "", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2016 - Đề Chẵn"}, {"id": "2016-chan-sentence-build-9", "type": "sentence_building", "prompt": "You / not pass / coming exam / unless / work hard //", "answer": "You will not pass the coming exam unless you work hard.", "explanation": "➔ Unless (= If not) sử dụng trong các loại câu điều kiện: diễn tả một sự việc có thể xảy ra\ntrong tương lai\n➔ S + will/can/shall + V + unless + S +V (simple present)", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2016 - Đề Chẵn"}, {"id": "2016-chan-sentence-build-10", "type": "sentence_building", "prompt": "Our beautiful forests / destroy / if / we / do / nothing / preserve them //", "answer": "Our beautiful forests will be destroyed if we do nothing to preserve them.", "explanation": "➔ Câu điều kiện loại 1: If + S +V(s,es), S + will/can/shall + V: dùng để nói về một sự việc\ncó thể xảy ra ở hiện tại hoặc tương lai nếu có một điều kiện nào đó.", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2016 - Đề Chẵn"}, {"id": "2016-chan-transform-1", "type": "sentence_transformation", "prompt": "The children couldn't go swimming because the sea was very rough.", "answer": "The sea was too rough for the children to go swimming.", "explanation": "➔ To be too adj for someone to do something: quá… để ai đó làm gì", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2016 - Đề Chẵn"}, {"id": "2016-chan-transform-2", "type": "sentence_transformation", "prompt": "The mechanic serviced my car last week.", "answer": "I had the mechanic service my car last week.", "explanation": "➔ Tôi đã nhờ thợ sửa xe của mình vào tuần trước.\n➔ Câu nhờ vả:\nS + have + (sb) + V-inf + …\n= S + have + sth + V-ed/PII + … + by sb.", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2016 - Đề Chẵn"}, {"id": "2016-chan-transform-3", "type": "sentence_transformation", "prompt": "I advise you to put your money in the bank.", "answer": "You’d better put your money in a bank.", "explanation": "➔ S + had better + V: tốt hơn nên…( đưa ra lời khuyên, bảo rằng người nào đó nên hoặc không\nnên làm điều gì đó trong một tình huống nào đó).", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2016 - Đề Chẵn"}, {"id": "2016-chan-transform-4", "type": "sentence_transformation", "prompt": "That restaurant is so dirty that no one wants to eat there.", "answer": "It is such a dirty restaurant so that no one wants to eat there.", "explanation": "➔ It’s such ….: Thật là….", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2016 - Đề Chẵn"}, {"id": "2016-chan-transform-5", "type": "sentence_transformation", "prompt": "Although he had a good salary, he was unhappy in his job.", "answer": "In spite of getting a good salary, he was unhappy in his job.", "explanation": "➔ Despite/In spite of + N/Ving, S + V + O...: Mặc dù…, …..(chỉ sự tương phản cho một hành\nđộng).", "needs_review": false, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2016 - Đề Chẵn"}, {"id": "2016-chan-translate-en-vi-1", "type": "translation", "prompt": "Have a safe journey home!", "answer": "Chúc bạn về nhà an toàn nhé!", "explanation": "➔ Have a journey: có một chuyến đi", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2016 - Đề Chẵn"}, {"id": "2016-chan-translate-en-vi-2", "type": "translation", "prompt": "It’s hard to overstate her beauty.", "answer": "Thật khó để cường điệu/phóng đại vẻ đẹp của cô ấy.", "explanation": "➔ It’s hard to + V: thật khó để làm gì", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2016 - Đề Chẵn"}, {"id": "2016-chan-translate-en-vi-3", "type": "translation", "prompt": "My new assistant is very efficient, he always follows through all the tasks assigned to him.", "answer": "Trợ lý mới của tôi rất có năng lực, cậu ấy luôn hoàn thành tất cả nhiệm vụ được giao", "explanation": "➔ to follow through (v) hoàn thành", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2016 - Đề Chẵn"}, {"id": "2016-chan-translate-en-vi-4", "type": "translation", "prompt": "Unlike managers, leaders only use power as a last resort.", "answer": "Khác với các nhà quản lý, những nhà lãnh đạo chỉ sử dụng quyền lực như một biện pháp cuối cùng.", "explanation": "➔ Unlike: khác với…", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2016 - Đề Chẵn"}, {"id": "2016-chan-translate-en-vi-5", "type": "translation", "prompt": "Environmental pollution is one of the most serious problems facing humanity today.", "answer": "Ô nhiễm môi trường là một trong những vấn đề nghiêm trọng loài người đang phải đối mặt ngày nay.", "explanation": "", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2016 - Đề Chẵn"}, {"id": "2016-chan-translate-vi-en-1", "type": "translation", "prompt": "Tiếc là tôi không thể giúp gì anh được, việc này nằm ngoài khả năng của tôi.", "answer": "I apologize that I am unable to help you, this is beyond of my ability/ capabilities.", "explanation": "➔ within/beyond the capabilities/ abilities of someone/something: trong/ ngoài khả năng của ai/ cái gì", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2016 - Đề Chẵn"}, {"id": "2016-chan-translate-vi-en-2", "type": "translation", "prompt": "Công ty chúng tôi đối xử rất tốt với nhân viên nên không có gì ngạc nhiên là họ lại tận tâm như vậy.", "answer": "Our company treats staffs very well, so it is no surprise that they are so dedicated.", "explanation": "➔ It is no surprise that: không có gì ngạc nhiên là…", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2016 - Đề Chẵn"}, {"id": "2016-chan-translate-vi-en-3", "type": "translation", "prompt": "Chúng ta cần thương lượng và đưa vào thực hiện các thỏa ước quốc tế để bảo vệ sức khỏe cộng đồng và tài nguyên môi trường.", "answer": "We need to negotiate and implement international agreements to protect public health and environmental resources.", "explanation": "➔ negotiate and implement: thương lượng và thực hiện", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2016 - Đề Chẵn"}, {"id": "2016-chan-translate-vi-en-4", "type": "translation", "prompt": "Ban giám đốc rất ủng hộ chính sách kinh doanh mới của công ty.", "answer": "Board of directors strongly supports the company’s new business policy.", "explanation": "", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2016 - Đề Chẵn"}, {"id": "2016-chan-translate-vi-en-5", "type": "translation", "prompt": "Nhắc đến Việt Nam, người ta không chỉ nhắc đến Vịnh Hạ Long, mà còn nhắc đến những món ăn ngon và đa dạng.", "answer": "Referring to Vietnam, people not only mention Ha Long Bay, but also mention delicious and diverse dishes.", "explanation": "➔ Referring to something: ám chỉ, nhắc đến, nói đến", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2016 - Đề Chẵn"}]}, {"year": "2016", "version": "le", "items": [{"id": "2016-le-vocab-1", "type": "fill_blank", "prompt": "The professor ....................... that many people have never studied social psychology.", "answer": "pointed out", "explanation": "(Giáo sư chỉ ra rằng nhiều người chưa bao giờ học tâm lý xã hội)\n➔ point out that (v) chỉ ra rằng", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2016 - Đề Lẻ"}, {"id": "2016-le-vocab-2", "type": "fill_blank", "prompt": "One ....................... of studying in a university is doing homework.", "answer": "part", "explanation": "(Một phần của việc học ở trường đại học là làm bài tập về nhà)\n➔ One part of sth: một phần của cái gì đó", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2016 - Đề Lẻ"}, {"id": "2016-le-vocab-3", "type": "fill_blank", "prompt": "The amount of time you study can ....................... your grade on a test.", "answer": "affect", "explanation": "(Lượng thời gian bạn học có thể ảnh hưởng đến điểm số của bạn trong một bài kiểm tra)\n➔ to affect + sth (v) ảnh hưởng đến cái gì", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2016 - Đề Lẻ"}, {"id": "2016-le-vocab-4", "type": "fill_blank", "prompt": "In this class, students study two different ....................... that try to explain how people\nbehave.", "answer": "theories", "explanation": "(Trong lớp học này, sinh viên nghiên cứu hai học thuyết khác nhau để cố gắng giải thích cách\nmọi người hành xử.)\n➔ theory (n) học thuyết", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2016 - Đề Lẻ"}, {"id": "2016-le-vocab-5", "type": "fill_blank", "prompt": "Students can use the Internet to do their own ....................... on a topic.", "answer": "research", "explanation": "(Sinh viên có thể sử dụng Internet để tự nghiên cứu về một chủ đề)\n➔ to do research about something (v) nghiên cứu về cái gì", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2016 - Đề Lẻ"}, {"id": "2016-le-vocab-6", "type": "fill_blank", "prompt": "If you ....................... the pace of life in big cities in Japan and big cities in Russia, you will\nnotice many differences.", "answer": "compare", "explanation": "many differences.\n(Nếu bạn so sánh nhịp sống ở các thành phố lớn ở Nhật Bản và các thành phố lớn ở Nga, bạn sẽ\nnhận thấy nhiều điểm khác biệt)\n➔ Dấu hiệu là differences (điểm khác biệt )→ từ cần điền: compare: so sánh", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2016 - Đề Lẻ"}, {"id": "2016-le-vocab-7", "type": "fill_blank", "prompt": "I elbowed my way through the ....................... room.", "answer": "crowded", "explanation": "(Tôi đã dùng cùi trỏ để thoát ra khỏi căn phòng chật ních người)\n➔ elbow (v) đẩy ai đó thô lỗ với khuỷu tay (thúc cùi chỏ) để bạn có thể di chuyển hoặc có nhiều\nkhông gian hơn", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2016 - Đề Lẻ"}, {"id": "2016-le-vocab-8", "type": "fill_blank", "prompt": "They discussed the problem to ....................... what went wrong.", "answer": "analyze", "explanation": "(Họ thảo luận vấn đề để phân tích xem đã sai sót ở đâu.)\n➔ to analyze (v) phân tích", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2016 - Đề Lẻ"}, {"id": "2016-le-vocab-9", "type": "fill_blank", "prompt": "People who live in big cities ....................... live life at a faster  "section_label": "Đọc hiểu - Trả lời câu hỏi", "exam_label": "CPA 2016 - Đề Lẻ"}, {"id": "2016-le-reading-open-2", "type": "open_short_answer", "passage": "Read the passage and answer the questions:\nMoney is what you use to buy things(1). You may earn money from completing household chores,\ngetting good grades, for your allowance, or for losing a tooth(2)! Money is very important in our world\nand comes in many different forms(3). People have been using money for hundreds of years(4). Before\nmoney gave specific values for things, people simply traded items(5). In the United States, we use the\ndollar as our currency or money, but people in different parts of the world use different currencies,\nthough some countries also use or accept our dollars(6).\nPeople earn money from the jobs they work and use that money to save for the future or pay for their\nhouses, cars, good, taxes, medical needs, and household items, among other things(7). Even things such\nas turning the lights on, using the air conditioning or heat, and connecting to the internet cost money(8).", "prompt": "How long have people used money?", "answer": "People have been using money for hundreds of years.(4)", "explanation": "", "needs_review": false, "section": "reading-open", "section_label": "Đọc hiểu - Trả lời câu hỏi", "exam_label": "CPA 2016 - Đề Lẻ"}, {"id": "2016-le-reading-open-3", "type": "open_short_answer", "passage": "Read the passage and answer the questions:\nMoney is what you use to buy things(1). You may earn money from completing household chores,\ngetting good grades, for your allowance, or for losing a tooth(2)! Money is very important in our world\nand comes in many different forms(3). People have been using money for hundreds of years(4). Before\nmoney gave specific values for things, people simply traded items(5). In the United States, we use the\ndollar as our currency or money, but people in different parts of the world use different currencies,\nthough some countries also u uy things(1). You may earn money from completing household chores,\ngetting good grades, for your allowance, or for losing a tooth(2)! Money is very important in our world\nand comes in many different forms(3). People have been using money for hundreds of years(4). Before\nmoney gave specific values for things, people simply traded items(5). In the United States, we use the\ndollar as our currency or money, but people in different parts of the world use different currencies,\nthough some countries also use or accept our dollars(6).\nPeople earn money from the jobs they work and use that money to save for the future or pay for their\nhouses, cars, good, taxes, medical needs, and household items, among other things(7). Even things such\nas turning the lights on, using the air conditioning or heat, and connecting to the internet cost money(8).", "prompt": "Do people in different parts of the world use USD?", "answer": "Yes, some countries also use USD (6)", "explanation": "", "needs_review": false, "section": "reading-open", "section_label": "Đọc hiểu - Trả lời câu hỏi", "exam_label": "CPA 2016 - Đề Lẻ"}, {"id": "2016-le-reading-mcq-1", "type": "mcq", "passage": "Read the passage carefully and choose ONE which you think fits best\nHave you ever had the flu (1)? If you have, you know how miserable it can make you feel(2). Most kids\nwill get the flu sometime during their school years(3). When you have the flu, you usually get a fever\n(which can be high), have a cough, feel very tired, and may have a sore throat as well(4). It can make\nyou feel sick for a few days or for as long as a week(5). Sometimes, it can be hard to tell if you have\nthe flu or a cold, but with the flu, you’ll usually have a higher fever and feel much worse(6). The flu is a\ntype of virus, which means medicine will only help the symptoms such as the cough and fever(7). For\nmost kids, the flu comes and goes, but for some, it can be a serious illness(8).\nMost kids get the flu in the winter because germs spread more easily when kids are inside in\nsettings such as classrooms(9). The best way to prevent from getting the flu is to wash your hands\noften, keep your hands to yourself, and go to your doctor for the flu shot or mist(10).", "prompt": "According to the author....", "options": [{"label": "A", "text": "most kids don't even realize they have the flu"}, {"label": "B", "text": "the flu can’t easily spread from one person to another"}, {"label": "C", "text": "most kids get the flu in winter"}, {"label": "D", "text": "medicine can help kill the flu"}], "answer": "C", "explanation": "According to the author....\nA. most kids don't even realize they have the flu\nB. the flu can’t easily spread from one person to another\nC. most kids get the flu in winter (9)\nD. medicine can help kill the flu", "needs_review": false, "section": "reading-mcq", "section_label": "Đọc hiểu - Trắc nghiệm", "exam_label": "CPA 2016 - Đề Lẻ"}, {"id": "2016-le-reading-mcq-2", "type": "mcq", "passage": "Read the passage carefully and choose ONE which you think fits best\nHave you ever had the flu (1)? If you have, you know how miserable it can make you feel(2). Most kids\nwill get the flu sometime during their school years(3). When you have the flu, you usually get a fever\n(which can be high), have a cough, feel very tired, and may have a sore throat as well(4). It can make\nyou feel sick for a few days or for as long as a week(5). Sometimes, it can be hard to tell if you have\nthe flu or a cold, but with the flu, you’ll usually have a higher fever and feel much worse(6). The flu is a\ntype of virus, which means medicine will only help the symptoms such as the cough and fever(7). For\nmost kids, the flu comes and goes, but for some, it can be a serious illness(8).\nMost kids get the flu in the winter because germs spread more easily when kids are inside in\nsettings such as classrooms(9). The best way to prevent from getting the flu is to wash your hands\noften, keep your hands to yourself, and go to your doctor for the flu shot or mist(10).", "prompt": "Why is the flu most easily spread in the winter?", "options": [{"label": "A", "text": "Because kids are inside in classroom settings"}, {"label": "B", "text": "Because kids are outside playing in the cold"}, {"label": "C", "text": "Because there is less daylight in winter days"}, {"label": "D", "text": "Because kids start washing their hands more in the winter"}], "answer": "A", "explanation": "Why is the flu most easily spread in the winter?\nA. Because kids are inside in classroom settings (9)\nB. Because kids are outside playing in the cold\nC. Because there is less daylight in winter days\nD. Because kids start washing their hands more in the winter", "needs_review": false, "section": "reading-mcq", "section_label": "Đọc hiểu - Trắc nghiệm", "exam_label": "CPA 2016 - Đề Lẻ"}, {"id": "2016-le-reading-mcq-3", "type": "mcq", "passage": "Read the passage carefully and choose ONE which you think fits best\nHave you ever had the flu (1)? If you have, you know how miserable it can make you feel(2). Most kids\nwill get the flu sometime during their school years(3). When you have the flu, you usually get a fever\n(which can be high), have a cough, feel very tired, and may have a sore throat as well(4). It can make\nyou feel sick for a few days or for as long as a week(5). Sometimes, it can be hard to tell if you have\nthe flu or a cold, but with the flu, you’ll usually have a higher fever and feel much worse(6). The flu is a\ntype of virus, which means medicine will only help the symptoms such as the cough and fever(7). For\nmost kids, the flu comes and goes, but for some, it can be a serious illness(8).\nMost kids get the flu in the winter because germs spread more easily when kids are inside in\nsettings such as classrooms(9). The best way to prevent from getting the flu is to wash your hands\noften, keep your hands to yourself, and go to your doctor for the flu shot or mist(10).", "prompt": "What question is answered in the first paragraph?", "options": [{"label": "A", "text": "How do I prevent the flu?"}, {"label": "B", "text": "How long does the flu last?"}, {"label": "C", "text": "When does the flu spread?"}, {"label": "D", "text": "How many people get the flu?"}], "answer": "B", "explanation": "What question is answered in the first paragraph?\nA. How do I prevent the flu?\nB. How long does the flu last? (5)\nC. When does the flu spread?\nD. How many people get the flu?", "needs_review": false, "section": "reading-mcq", "section_label": "Đọc hiểu - Trắc nghiệm", "exam_label": "CPA 2016 - Đề Lẻ"}, {"id": "2016-le-reading-mcq-4", "type": "mcq", "passage": "Read the passage carefully and choose ONE which you think fits best\nHave you ever had the flu (1)? If you have, you know how miserable it can make you feel(2). Most kids\nwill get the flu sometime during their school years(3). When you have the flu, you usually get a fever\n(which can be high), have a cough, feel very tired, and may have a sore throat as well(4). It can make\nyou feel sick for a few days or for as long as a week(5). Sometimes, it can be hard to tell if you have\nthe flu or a cold, but with the flu, you’ll usually have a higher fever and feel much worse(6). The flu is a\ntype of virus, which means medicine will only help the symptoms such as the cough and fever(7). For\nmost kids, the flu comes and goes, but for some, it can be a serious illness(8).\nMost kids get the flu in the winter because germs spread more easily when kids are inside in\nsettings such as classrooms(9). The best way to prevent from getting the flu is to wash your hands\noften, keep your hands to yourself, and go to your doctor for the flu shot or mist(10).", "prompt": "Which of the following WOULD NOT help you in preventing the flu? (10)", "options": [{"label": "A", "text": "Getting a flu shot or flu mist"}, {"label": "B", "text": "Washing your hands often"}, {"label": "C", "text": "Keeping your hands to yourself"}, {"label": "D", "text": "Shaking the hands of your classmates"}], "answer": null, "explanation": "Which of the following WOULD NOT help you in preventing the flu? (10)\nA. Getting a flu shot or flu mist\nB. Washing your hands often\nC. Keeping your hands to yourself\nD. Shaking the hands of your classmates", "needs_review": true, "section": "reading-mcq", "section_label": "Đọc hiểu - Trắc nghiệm", "exam_label": "CPA 2016 - Đề Lẻ"}, {"id": "2016-le-reading-mcq-5", "type": "mcq", "passage": "Read the passage carefully and choose ONE which you think fits best\nHave you ever had the flu (1)? If you have, you know how miserable it can make you feel(2). Most kids\nwill get the flu sometime during their school years(3). When you have the flu, you usually get a fever\n(which can be high), have a cough, feel very tired, and may have a sore throat as well(4). It can make\nyou feel sick for a few days or for as long as a week(5). Sometimes, it can be hard to tell if you have\nthe flu or a cold, but with the flu, you’ll usually have a higher fever and feel much worse(6). The flu is a\ntype of virus, which means medicine will only help the symptoms such as the cough and fever(7). For\nmost kids, the flu comes and goes, but for some, it can be a serious illness(8).\nMost kids get the flu in the winter because germs spread more easily when kids are inside in\nsettings such as classrooms(9). The best way to prevent from getting the flu is to wash your hands\noften, keep your hands to yourself, and go to your doctor for the flu shot or mist(10).", "prompt": "What does the author IMPLY in the following sentence?\n‘The flu is a type of virus, which means medicine will only help the symptoms such as the cough and\nfever.’", "options": [{"label": "A", "text": "Medicine will not help your fever or sore throat"}, {"label": "B", "text": "Medicine will NOT be able to kill the flu"}, {"label": "C", "text": "You should not bother taking medicine if you have the flu"}, {"label": "D", "text": "The flu is not really a virus"}], "answer": null, "explanation": "What does the author IMPLY in the following sentence?\n‘The flu is a type of virus, which means medicine will only help the symptoms such as the cough and\nfever.’\nA. Medicine will not help your fever or sore throat\nB. Medicine will NOT be able to kill the flu\nC. You should not bother taking medicine if you have the flu\nD. The flu is not really a virus", "needs_review": true, "section": "reading-mcq", "section_label": "Đọc hiểu - Trắc nghiệm", "exam_label": "CPA 2016 - Đề Lẻ"}, {"id": "2016-le-cloze-1", "type": "cloze", "passage": "Read the paragraph below and think of ONE word which best fits each space. There is\nan example at the beginning (0).\nBritish humour is often very difficult to (0) ...understand... .A lot of (1) _____ depends on the\nuse of (2) _____ which sound the (3) _____ but have different meanings. For example, when\nsomeone said he was on a seafood diet, everyone thought that the person (4) _____ fish. When he was\nasked what (5) _____ of seafood he ate, however, the (6) _____ replied, ‘It’s very simple indeed.\nWhen I (7) _____ food, I eat it. That's a see-food (8) _____. People often begin to (9) _____ jokes by\nsaying. ‘Have you (10) _____", "gap_number": 1, "answer": "humour", "explanation": "humour (n) sự hài hước, liên kết với chủ đề đoạn, về humour", "needs_review": false, "section": "cloze", "section_label": "Điền từ vào đoạn văn", "exam_label": "CPA 2016 - Đề Lẻ"}, {"id": "2016-le-cloze-2", "type": "cloze", "passage": "Read the paragraph below and think of ONE word which best fits each space. There is\nan example at the beginning (0).\nBritish humour is often very difficult to (0) ...understand... .A lot of (1) _____ depends on the\nuse of (2) _____ which sound the (3) _____ but have different meanings. For example, when\nsomeone said he was on a seafood diet, everyone thought that the person (4) _____ fish. When he was\nasked what (5) _____ of seafood he ate, however, ften very difficult to (0) ...understand... .A lot of (1) _____ depends on the\nuse of (2) _____ which sound the (3) _____ but have different meanings. For example, when\nsomeone said he was on a seafood diet, everyone thought that the person (4) _____ fish. When he was\nasked what (5) _____ of seafood he ate, however, the (6) _____ replied, ‘It’s very simple indeed.\nWhen I (7) _____ food, I eat it. That's a see-food (8) _____. People often begin to (9) _____ jokes by\nsaying. ‘Have you (10) _____", "gap_number": 9, "answer": "tell", "explanation": "tell jokes (v) kể chuyện cười", "needs_review": false, "section": "cloze", "section_label": "Điền từ vào đoạn văn", "exam_label": "CPA 2016 - Đề Lẻ"}, {"id": "2016-le-cloze-10", "type": "cloze", "passage": "Read the paragraph below and think of ONE word which best fits each space. There is\nan example at the beginning (0).\nBritish humour is often very difficult to (0) ...understand... .A lot of (1) _____ depends on the\nuse of (2) _____ which sound the (3) _____ but have different meanings. For example, when\nsomeone said he was on a seafood diet, everyone thought that the person (4) _____ fish. When he was\nasked what (5) _____ of seafood he ate, however, the (6) _____ replied, ‘It’s very simple indeed.\nWhen I (7) _____ food, I eat it. That's a see-food (8) _____. People often begin to (9) _____ jokes by\nsaying. ‘Have you (10) _____", "gap_number": 10, "answer": "heard", "explanation": "Have you heard the one about...: Bạn đã nghe ai về việc....", "needs_review": false, "section": "cloze", "section_label": "Điền từ vào đoạn văn", "exam_label": "CPA 2016 - Đề Lẻ"}, {"id": "2016-le-wordform-1", "type": "fill_blank", "prompt": "Would you mind ....................... the door? Thanks. (OPEN)", "answer": "opening", "explanation": "➔ Would you mind + Ving: đưa ra yêu cầu hoặc hỏi ý kiến của người nghe về việc nào đó, mang\ný nghĩa “bạn có phiền nếu”", "needs_review": false, "section": "wordform", "section_label": "Từ loại (Word Formation)", "exam_label": "CPA 2016 - Đề Lẻ"}, {"id": "2016-le-wordform-2", "type": "fill_blank", "prompt": "All the newspapers praised the ....................... of the firemen. (BRAVE)", "answer": "bravery", "explanation": "brave (adj) dũng cảm\n➔ bravery (n) sự dũng cảm (sự dũng cảm của lính cứu hỏa)", "needs_review": false, "section": "wordform", "section_label": "Từ loại (Word Formation)", "exam_label": "CPA 2016 - Đề Lẻ"}, {"id": "2016-le-wordform-3", "type": "fill_blank", "prompt": "The restaurant is now under new ....................... . (MANAGE)", "answer": "management", "explanation": "manage (v) quản lý\n➔ management (n) sự quản lý ( không chọn đáp án manager vì trước đó không có mạo từ\na/an/the.", "needs_review": false, "section": "wordform", "section_label": "Từ loại (Word Formation)", "exam_label": "CPA 2016 - Đề Lẻ"}, {"id": "2016-le-wordform-4", "type": "fill_blank", "prompt": "The manager handed in his ....................... after being accused of dishonesty. (RESIGN)", "answer": "resignation", "explanation": "resign (v) từ chức\nresignation (n) sự từ chức\n➔ handed in his resignation: nộp đơn xin từ chức", "needs_review": false, "section": "wordform", "section_label": "Từ loại (Word Formation)", "exam_label": "CPA 2016 - Đề Lẻ"}, {"id": "2016-le-wordform-5", "type": "fill_blank", "prompt": "Thousands of people have been made ....................... by the war. (HOME)", "answer": "homeless", "explanation": "home (n): nhà\n➔ homeless (n): vô gia cư\n(Nghĩa của câu: Hàng nghìn người bị trở thành vô gia cư bởi chiến tranh)", "needs_review": false, "section": "wordform", "section_label": "Từ loại (Word Formation)", "exam_label": "CPA 2016 - Đề Lẻ"}, {"id": "2016-le-sentence-build-1", "type": "sentence_building", "prompt": "A friend / mine / recently / return / England / advise me / write / you.//", "answer": "A friend of mine who has recently returned from England advised me to write to you.", "explanation": "➔ A friend of mine: một người bạn của tôi", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2016 - Đề Lẻ"}, {"id": "2016-le-sentence-build-2", "type": "sentence_building", "prompt": "I / hope / come / England / next year / spend / some months / Cambridge.//", "answer": "I hope to come to England next year and spend some months in Cambridge.", "explanation": "➔ to hope + to V/ to hope (that) + S +V: để nói về những mong đợi trong hiện tại hoặc tương lai\nmà chúng ta nghĩ có khả năng sẽ xảy ra.", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2016 - Đề Lẻ"}, {"id": "2016-le-sentence-build-3", "type": "sentence_building", "prompt": "I be / very please / receive / parcel / send.//", "answer": "I was very pleased to receive the parcel you had sent.", "explanation": "➔ be very pleased to V: vui lòng làm việc gì đó", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2016 - Đề Lẻ"}, {"id": "2016-le-sentence-build-4", "type": "sentence_building", "prompt": "Last Monday /1 have / accident / when I drive / work.//", "answer": "Last monday, I had an accident when I was driving to work.", "explanation": "➔ Quá khứ tiếp diễn: S + was/were + Ving.\nTrong câu có “when” khi diễn tả một hành động đang xảy ra và một hành động khác xen vào.", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2016 - Đề Lẻ"}, {"id": "2016-le-sentence-build-5", "type": "sentence_building", "prompt": "They / no / intention / put / end / crisis / those days //", "answer": "They had no intention of putting an end to the crisis in those days.", "explanation": "➔ intention of +Ving (n) có ý định", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2016 - Đề Lẻ"}, {"id": "2016-le-sentence-build-6", "type": "sentence_building", "prompt": "Andrea / get along very well / new job.//", "answer": "Andrea is getting along very well in her new job.", "explanation": "➔ Get along: hòa nhập với\n➔ Get along with someone: chung sống hòa thuận với ai", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2016 - Đề Lẻ"}, {"id": "2016-le-sentence-build-7", "type": "sentence_building", "prompt": "Addition / have considerable experience / new secretary / bilingual.//", "answer": "In addition to having considerable experience, the new secretary is bilingual.", "explanation": "➔ In addition to + N/Ving: bên cạnh cái gì đó. Cụm này được dùng để giới thiệu thêm một điều\ngì bên cạnh cái đã nói ở trước", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2016 - Đề Lẻ"}, {"id": "2016-le-sentence-build-8", "type": "sentence_building", "prompt": "Parents / once / well-off / go out of business.//", "answer": "His/ her parents were once well-off but they went out of business.", "explanation": "➔ Well-off (adj): khá giả\n➔ Go out of business (v) = bankrupt = crash : phá sản", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2016 - Đề Lẻ"}, {"id": "2016-le-sentence-build-9", "type": "sentence_building", "prompt": "He / used to / go hunting / forests / younger.//", "answer": "He used to go hunting in (the) forests when he was younger.", "explanation": "➔ S + used to + V: sử dụng để nói về một thói quen, hành động, sự kiện hoặc trạng thái đã từng\nxảy ra trong quá khứ và không còn xảy ra trong hiện tại nữa. Đôi khi nớ được dùng để nhấn\nmạnh về sự khác biệt giữa hiện thực và quá khứ.", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2016 - Đề Lẻ"}, {"id": "2016-le-sentence-build-10", "type": "sentence_building", "prompt": "Dog / bark / at / the / cat / last night.//", "answer": "The dog barked at the cat last night.", "explanation": "➔ Bark (v): sủa (chó)", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2016 - Đề Lẻ"}, {"id": "2016-le-transform-1", "type": "sentence_transformation", "prompt": "It was so late that nothing could be done.", "answer": "", "explanation": "➔ It was too late to do anything.\nĐã quá muộn để làm bất cứ điều gì.", "needs_review": true, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2016 - Đề Lẻ"}, {"id": "2016-le-transform-2", "type": "sentence_transformation", "prompt": "You may get hungry on the train, so take some sandwiches.", "answer": "", "explanation": "➔ In case you get hungry on the train, you can take some sandwiches.\nTrong trường hợp bạn đói trên tàu, bạn có thể lấy một ít bánh mì kẹp.\n➔ In case + S + V, S+V: đề phòng, trong trường hợp, phòng khi.\n“In case” được dùng để nói về những việc chúng ta nên làm để chuẩn bị cho những tình huống có\nthể xảy ra trong tương lai. Nói cách khác, cấu trúc in case là một cấu trúc chúng ta sử dụng khi thể\nhiện cách chúng ta sẽ đề phòng khả năng xảy ra điều gì đó.", "needs_review": true, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2016 - Đề Lẻ"}, {"id": "2016-le-transform-3", "type": "sentence_transformation", "prompt": "We couldn't drive because of the fog.", "answer": "", "explanation": "➔ The fog prevented us from driving.\nSương mù đã ngăn cản chúng tôi lái xe.\n➔ to prevent from sth (v) ngăn cản", "needs_review": true, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2016 - Đề Lẻ"}, {"id": "2016-le-transform-4", "type": "sentence_transformation", "prompt": "The child will die if nobody sends for a doctor.", "answer": "", "explanation": "➔ Unless somebody sends for a doctor, the child will die.\nTrừ khi ai đó đưa đi bác sĩ, đứa bé sẽ chết.\n➔ Unless: được sử dụng với ý nghĩa phủ định, có nghĩa là không, trừ khi. Ví dụ của unless với\ncâu điều kiện loại 1:\nUnless + S + V (simple present), S + will/can/shall + V", "needs_review": true, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2016 - Đề Lẻ"}, {"id": "2016-le-transform-5", "type": "sentence_transformation", "prompt": "Maria didn't apply for the job in the library and regrets it now.", "answer": "", "explanation": "➔ Maria wishes she had applied for the job in the library.\nMaria ước rằng cô ấy đã nộp đơn xin việc trong thư viện.\n➔ Wish ở quá khứ: tiếc nuối về một chuyện không có thật ở quá khứ hoặc giả định điều gì đó trái\nngược với quá khứ: S + wish (es) + (that) + S + had + V\nPP", "needs_review": true, "section": "transform", "section_label": "Viết lại câu", "exam_label": "CPA 2016 - Đề Lẻ"}, {"id": "2016-le-translate-en-vi-1", "type": "translation", "prompt": "Most people want more than they can afford to buy.", "answer": "Hầu hết mọi người muốn nhiều hơn những gì họ có thể chi trả.", "explanation": "", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2016 - Đề Lẻ"}, {"id": "2016-le-translate-en-vi-2", "type": "translation", "prompt": "The value of all goods and services produced in any year makes up a nation’s gross national product.", "answer": "Giá trị của tất cả hàng hóa và dịch vụ được sản xuất trong năm tạo nên tổng sản phẩm quốc dân của một quốc gia.", "explanation": "", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2016 - Đề Lẻ"}, {"id": "2016-le-translate-en-vi-3", "type": "translation", "prompt": "Henry talks to his dog as if it understood him.", "answer": "Henry nói chuyện với con chó của mình như thể nó hiểu anh ấy nói gì.", "explanation": "➔ as if (adv) như thể", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2016 - Đề Lẻ"}, {"id": "2016-le-translate-en-vi-4", "type": "translation", "prompt": "He talks to me as if there were nothing between us.", "answer": "Anh ta nói chuyện với tôi như thể không có gì giữa chúng tôi.", "explanation": "", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2016 - Đề Lẻ"}, {"id": "2016-le-translate-en-vi-5", "type": "translation", "prompt": "Inresponsibility is the quickest way for you to get sacked.", "answer": "Sự vô trách nhiệm là cách nhanh nhất để bạn bị sa thải.", "explanation": "➔ Get sacked = get fired: bị sa thải", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2016 - Đề Lẻ"}, {"id": "2016-le-translate-vi-en-1", "type": "translation", "prompt": "Trung Quốc giờ đây đang được coi là nền kinh tế năng động nhất thế giới vì nước này tăng trưởng không những nhanh mà còn bền vững.", "answer": "China is now considered as the most dynamic economy in the world because its growth is not only fast but also sustainable.", "explanation": "➔ be + considered + as: được coi là", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2016 - Đề Lẻ"}, {"id": "2016-le-translate-vi-en-2", "type": "translation", "prompt": "Chưa bao giờ miền quê bé nhỏ này phải hứng chịu một trận bão khủng khiếp đến như vậy.", "answer": "Never before has this countryside suffered such a terrible storm.", "explanation": "➔ Never + have/has/had + S + (ever) + V hoàn thành + before ( nhấn mạnh vào “chưa bao giờ”).", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2016 - Đề Lẻ"}, {"id": "2016-le-translate-vi-en-3", "type": "translation", "prompt": "Bán được hết lô hàng này, tớ sẽ trả tiền cho cậu", "answer": "If I sell all of this, I will pay you.", "explanation": "", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2016 - Đề Lẻ"}, {"id": "2016-le-translate-vi-en-4", "type": "translation", "prompt": "Phải công nhận rằng ông ấy là một nhà lãnh đạo kiệt xuất.", "answer": "I must admit that he is an outstanding leader.", "explanation": "➔ Admit: thừa nhận, công nhận", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2016 - Đề Lẻ"}, {"id": "2016-le-translate-vi-en-5", "type": "translation", "prompt": "Bảo vệ môi trường là bảo vệ cuộc sống xung quanh chúng ta.", "answer": "Protecting the environment is protecting the life around us.", "explanation": "", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2016 - Đề Lẻ"}]}, {"year": "2017", "version": "chan", "items": [{"id": "2017-chan-vocab-1", "type": "fill_blank", "prompt": "It's very hard to say what the future ....................... in store for US-Cuba relations.", "answer": "work", "explanation": "➔ Rất khó để nói tương lai sẽ như thế nào đối với mối quan hệ Mỹ-Cuba.", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2017 - Đề Chẵn"}, {"id": "2017-chan-vocab-2", "type": "fill_blank", "prompt": "However, there is definitely a lot of untapped ....................... in the country.", "answer": "potential", "explanation": "➔ Tuy nhiên, có rất nhiều tiềm năng chưa được khai thác trong nước.", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2017 - Đề Chẵn"}, {"id": "2017-chan-vocab-3", "type": "fill_blank", "prompt": "When your business is very young, it's harder for lenders to ....................... how you will\nmanage cash flow.", "answer": "predict", "explanation": "➔ Khi doanh nghiệp của bạn còn rất non trẻ, người cho vay sẽ khó dự đoán bạn sẽ quản lý dòng tiền như thế\nnào.", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2017 - Đề Chẵn"}, {"id": "2017-chan-vocab-4", "type": "fill_blank", "prompt": "You can't achieve your ……………… by trying to have fun all the time.", "answer": "goals", "explanation": "➔ Bạn không thể đạt được mục tiêu của mình bằng cách cố gắng vui vẻ mọi lúc.", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2017 - Đề Chẵn"}, {"id": "2017-chan-vocab-5", "type": "fill_blank", "prompt": "He's ....................... for a glass of beer.", "answer": "dying", "explanation": "➔ Anh ấy đang say ngất vì một ly bia.", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2017 - Đề Chẵn"}, {"id": "2017-chan-vocab-6", "type": "fill_blank", "prompt": "The number of people out of work has been going down little by ....................... .", "answer": "little", "explanation": "➔ Số người không có việc làm đang giảm dần từng chút một.", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2017 - Đề Chẵn"}, {"id": "2017-chan-vocab-7", "type": "fill_blank", "prompt": "Scott prides ....................... on her cooking.", "answer": "herself", "explanation": "➔ Scott rất tự hào về tài nấu ăn của cô ấy.", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2017 - Đề Chẵn"}, {"id": "2017-chan-vocab-8", "type": "fill_blank", "prompt": "He was torn ....................... love and duty.", "answer": "between", "explanation": "➔ Anh ấy bị giằng xé giữa tình yêu và trách nhiệm.", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2017 - Đề Chẵn"}, {"id": "2017-chan-vocab-9", "type": "fill_blank", "prompt": "According to the salesman, my new car would be ....................... next Wednesday.", "answer": "delivered", "explanation": "➔ Theo người bán hàng, chiếc xe mới của tôi sẽ được giao vào thứ Tư tới", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2017 - Đề Chẵ idence of the kingdom's past(5). The UK was once the world's\nmost powerful nation(6). Canada, Australia, India, Pakistan, and even the United States are among\nnations that used to be controlled by the United Kingdom(7). It is also the birthplace of the English\nlanguage(8).", "prompt": "Which of the following is not an example of a Constitutional Monarchy?", "options": [{"label": "A", "text": "A country with a queen"}, {"label": "B", "text": "A country with a king"}, {"label": "C", "text": "A country with a president"}, {"label": "D", "text": "Both A and B"}], "answer": null, "explanation": "Which of the following is not an example of a Constitutional Monarchy?\nA. A country with a queen(4)\nB. A country with a king(4)\nC. A country with a president\nD. Both A and B", "needs_review": true, "section": "reading-mcq", "section_label": "Đọc hiểu - Trắc nghiệm", "exam_label": "CPA 2017 - Đề Chẵn"}, {"id": "2017-chan-reading-mcq-3", "type": "mcq", "passage": "Read the passage carefully and choose ONE which you think fits best\nUnited Kingdom\nThe United Kingdom is made up of four nations: England, Scotland, Wales and Northern\nIreland(1).The vast majority of the population lives in England(2). The government of the United\nKingdom is considered a constitutional monarchy(3). A constitutional monarchy is a government in\nwhich the monarch (king or queen) is head of state(4).\nThe history of the United Kingdom is full of wars, revolutions, and interesting rulers. Numerous\ncastles, old cathedrals, and ruins are evidence of the kingdom's past(5). The UK was once the world's\nmost powerful nation(6). Canada, Australia, India, Pakistan, and even the United States are among\nnations that used to be controlled by the United Kingdom(7). It is also the birthplace of the English\nlanguage(8).", "prompt": "Which of the following would probably not be evidence of United Kingdom's past?", "options": [{"label": "A", "text": "Old churches and cathedrals"}, {"label": "B", "text": "Castl , "prompt": "The difficulties in reducing unemployment rate are enormous.", "answer": "Có rất nhiều khó khăn trong việc giảm tỷ lệ thất nghiệp.", "explanation": "➔ Enormous (adj): vô vàn/ rất nhiều", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2017 - Đề Chẵn"}, {"id": "2017-chan-translate-en-vi-4", "type": "translation", "prompt": "I would like to say a word of thanks to our teachers, without whom none of our achievements would have been possible.", "answer": "Tôi muốn gửi lời cảm ơn đến thầy cô của chúng tôi. Nếu không có thầy cô, chúng tôi sẽ không thể đạt được những thành tựu như hôm nay.", "explanation": "➔ Say a word of thanks to N (v): gửi/nói lời cảm ơn đến ai ➔ None of N: không có ai/ điều gì trong…", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2017 - Đề Chẵn"}, {"id": "2017-chan-translate-en-vi-5", "type": "translation", "prompt": "Ours is a world in which no individual, and no country, exists in isolation. We are all influenced by the same tides of political, social and technological change.", "answer": "Tất cả chúng ta là 1 thế giới mà trong đó không có cá nhân hay quốc gia nào tồn tại độc lập. Tất cả chúng ta đều chịu tác động chung của những biến đổi chính trị, xã hội và khoa học kỹ thuật.", "explanation": "➔ Exists in isolation (v): tồn tại độc lập", "needs_review": false, "section": "translate-en-vi", "section_label": "Dịch Anh - Việt", "exam_label": "CPA 2017 - Đề Chẵn"}, {"id": "2017-chan-translate-vi-en-1", "type": "translation", "prompt": "Cô ấy trông rất thật sành điệu với bộ váy hàng hiệu.", "answer": "She looks very fashionable in her famous brand dress.", "explanation": "➔ stylish (adj): sành điệu ➔ designer dress: váy hàng hiệu", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2017 - Đề Chẵn"}, {"id": "2017-chan-translate-vi-en-2", "type": "translation", "prompt": "Sao trông anh hôm nay tươi tỉnh thế? - À, tôi mới được tăng lương.", "answer": "Why do you look so happy today? - Oh, I have just got a raise.", "explanation": "➔ Get a pay raise (v): được tăng lương", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2017 - Đề Chẵn"}, {"id": "2017-chan-translate-vi-en-3", "type": "translation", "prompt": "Tôi hoàn toàn đồng ý với anh về việc tăng thuế đối với ô tô nhập khẩu.", "answer": "I totally agree with you about the rising of taxes on the imported cars.", "explanation": "➔ Agree with somebody about something (v): đồng ý với ai về điều gì", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2017 - Đề Chẵn"}, {"id": "2017-chan-translate-vi-en-4", "type": "translation", "prompt": "Mong rằng hai công ty chúng ta sẽ có một mối quan hệ làm ăn tốt đẹp trong tương lai.", "answer": "Hope our two companies will have a good co-operation in the future.", "explanation": "➔ a good co-operation (n): một mối quan hệ làm ăn tốt đẹp", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2017 - Đề Chẵn"}, {"id": "2017-chan-translate-vi-en-5", "type": "translation", "prompt": "Năm 2018 sẽ là một năm thuận lợi cho thị trường bảo hiểm phát triển lành mạnh, an toàn, hiệu quả nhờ các chính sách vĩ mô đang được hoàn thiện và các thủ tục hành chính công khai minh bạch.", "answer": "2018 will be a favorable year for the insurance market to develop in a safe, healthy, and effective way thanks to the macro policies being perfected and the public and transparent administrative procedures.", "explanation": "➔ insurance market (n): thị trường bảo hiểm ➔ public (adj): công khai ➔ transparent (adj): minh bạch ➔ Thanks to: nhờ vào", "needs_review": false, "section": "translate-vi-en", "section_label": "Dịch Việt - Anh", "exam_label": "CPA 2017 - Đề Chẵn"}]}, {"year": "2017", "version": "le", "items": [{"id": "2017-le-vocab-1", "type": "fill_blank", "prompt": "You work very hard. I’m sure you’ll have no ....................... passing the exam.", "answer": "difficulty", "explanation": "(Bạn làm việc rất chăm chỉ. Tôi chắc chắn rằng bạn sẽ không gặp khó khăn gì khi vượt qua kỳ thi)\nto have no difficulty (in) doing something (v) không có sự khó khăn/ không gặp khó khăn gì khi…", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2017 - Đề Lẻ"}, {"id": "2017-le-vocab-2", "type": "fill_blank", "prompt": "My car would not start ....................... Jenny’s started immediately.", "answer": "whereas", "explanation": "(Xe của tôi sẽ không khởi động nhưng trái lại Jenny đã bắt đầu ngay rồi)\nwhereas: mặc dù, trái lại, trong khi.\nCấu trúc: S1 + V1, Whereas S2 + V2.", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2017 - Đề Lẻ"}, {"id": "2017-le-vocab-3", "type": "fill_blank", "prompt": "You’d better stop spending money, ....................... you will end up in debt.", "answer": "otherwise", "explanation": "(Tốt hơn hết bạn nên ngừng tiêu tiền, nếu không bạn sẽ rơi vào cảnh nợ nần.)\nS +V, otherwise + S+V: nếu không thì", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2017 - Đề Lẻ"}, {"id": "2017-le-vocab-4", "type": "fill_blank", "prompt": "He is determined to finish the job ....................... how long it takes.", "answer": "no matter", "explanation": "(Anh ấy quyết tâm hoàn thành công việc dù phải mất bao lâu đi nữa)\nno matter: dù có, đi chăng nữa", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2017 - Đề Lẻ"}, {"id": "2017-le-vocab-5", "type": "fill_blank", "prompt": "You should be responsible for ....................... you have done.", "answer": "what", "explanation": "(Bạn nên chịu trách nhiệm về những gì bạn đã làm)\nbe responsible for (adj) chịu trách nhiệm về cái gì", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2017 - Đề Lẻ"}, {"id": "2017-le-vocab-6", "type": "fill_blank", "prompt": "If you need any support, you can ....................... me to back you up.", "answer": "rely on", "explanation": "(Nếu bạn cần bất kỳ sự hỗ trợ nào, bạn có thể trông cậy vào tôi sẽ hỗ trợ bạn)\nrely on (v): tin tưởng, trông cậy vào", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2017 - Đề Lẻ"}, {"id": "2017-le-vocab-7", "type": "fill_blank", "prompt": "They live on a busy street. ....................... a lot of noise and pollution from traffic.", "answer": "There must be", "explanation": "(Họ sống trên một con phố đông đúc. Chắc hẳn là có rất nhiều tiếng ồn và ô nhiễm từ các phương tiện\ngiao thông)", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2017 - Đề Lẻ"}, {"id": "2017-le-vocab-8", "type": "fill_blank", "prompt": "Jane will have to repeat the course because her work has been ....................... .", "answer": "unsatisfactory", "explanation": "(Jane sẽ phải học lại khóa học vì công việc của cô ấy không đạt yêu cầu)\nunsatisfactory (adj) không thỏa mãn, không đạt yêu cầu", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2017 - Đề Lẻ"}, {"id": "2017-le-vocab-9", "type": "fill_blank", "prompt": "It was a great ....................... to have a doctor living near us.", "answer": "convenience", "explanation": "(Thật là tiện khi có một bác sỹ sống gần chúng tôi)", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2017 - Đề Lẻ"}, {"id": "2017-le-vocab-10", "type": "fill_blank", "prompt": "The greater the demand, the higher the ....................... .", "answer": "supply", "explanation": "(Nhu cầu càng lớn thì nguồn cung càng dồi dào)", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2017 - Đề Lẻ"}, {"id": "2017-le-vocab-11", "type": "fill_blank", "prompt": "The main goal of any business is to ....................... money.", "answer": "make", "explanation": "(Mục đích chính của bất kỳ doanh nghiệp nào đều là kiếm tiền)\nto make money (v) kiếm tiền", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2017 - Đề Lẻ"}, {"id": "2017-le-vocab-12", "type": "fill_blank", "prompt": "During lectures, it’s a good idea if you take ....................... .", "answer": "notes", "explanation": "(Trong giờ bài học, bạn nên ghi chép lại)\nto take notes (v) ghi chép lại / lưu ý một thứ gì đó", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2017 - Đề Lẻ"}, {"id": "2017-le-vocab-13", "type": "fill_blank", "prompt": "Pollution is a big problem in our city and we are trying all sorts of ideas to ....................... it.", "answer": "solve", "explanation": "(Ô nhiễm là một vấn đề lớn trong thành phố của chúng tôi và chúng tôi đang cố gắng tìm mọi cách để\ngiải quyết nó)\nto try + to do sth (v) cố gắng làm gì\nto solve (v) giải quyết", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2017 - Đề Lẻ"}, {"id": "2017-le-vocab-14", "type": "fill_blank", "prompt": "Please fill in your employment history, including your ....................... employer as well as any\nprevious ones you might have had.", "answer": "current", "explanation": "ones you might have had.\n(Vui lòng điền vào lịch sử làm việc của bạn, bao gồm cả người sử dụng hiện tại cũng như bất kỳ người\nnào trước đây bạn đã từng có)\ncurrent (adj) hiện tại\nDựa vào nghĩa của câu để điền current >< previous (trước kia)", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2017 - Đề Lẻ"}, {"id": "2017-le-vocab-15", "type": "fill_blank", "prompt": "As I was ....................... of the change in the schedule, I arrived half an hour late for the exam.", "answer": "unaware", "explanation": "(Vì tôi không biết về sự thay đổi trong lịch trình, tôi đã đến trễ nửa tiếng để thi)\nbe unaware of: không nhận thức được về điều gì, không biết đến", "needs_review": false, "section": "vocab", "section_label": "Từ vựng - Collocation", "exam_label": "CPA 2017 - Đề Lẻ"}, {"id": "2017-le-reading-open-1", "type": "open_short_answer", "passage": "Read the passage and answer the questions:\nThe country’s GDP inereased by 0.9 percent in the third quarter of 2016; significantly higher than\nthe rate of 0.4 percent seen in the previous quarter(1).\nNo one sector can be held responsible for the increase, as there was growth across the board in each\nof services, construction and production(2).\nServices Oufput rose to 1.0 percent, and the largest contribution to this was the Busines and\nFinance sector, which rose by 1.3 percent(3). Communications, Government services and Hospitality\nalso rose, but there was a decline in Transport and Distribution(4).\nConstruction output rose 3.4 percent in this quarter, a considerable improvement from the second\nquarter, in which output decreased by 1.6 percent(5).\nTotal production output grew in the third quarter at a rate of 1.0 percent, the same rafe as in the\nprevious quarter(6). Electricity, gas and water supply output contributed most to growth in the\nproduction sector, as Oufput rose from 0.8 to l.Š percent(7). Manufacturing, mining and agriculture\nall decreased during this period(8).", "prompt": "How did the country’s GDP change in the second and third quarters?", "answer": "The country's GDP changed significantly from 0.4% to 0.9% in the second and third quarters. (1)", "explanation": "", "needs_review": false, "section": "reading-open", "section_label": "Đọc hiểu - Trả lời câu hỏi", "exam_label": "CPA 2017 g4. (achieve)", "answer": "achievement", "explanation": "achieve (v) đạt được\nachievement (n) thành tựu", "needs_review": false, "section": "wordform", "section_label": "Từ loại (Word Formation)", "exam_label": "CPA 2017 - Đề Lẻ"}, {"id": "2017-le-wordform-3", "type": "fill_blank", "prompt": "The stock market crash of 1929 left my great-grandfather ....................... . (Penny)", "answer": "penniless", "explanation": "penny (n) đồng xu\npenniless (adj) không một xu dính túi", "needs_review": false, "section": "wordform", "section_label": "Từ loại (Word Formation)", "exam_label": "CPA 2017 - Đề Lẻ"}, {"id": "2017-le-wordform-4", "type": "fill_blank", "prompt": "Product development involves ....................... new products, or merely new product features or\nqualities or sizes or models. (develop)", "answer": "developing", "explanation": "or sizes or models. (develop)\ndevelop (v) phát triển\ninvolve + Ving/N: bao gồm, liên quan đến điều gì/ cái gì", "needs_review": false, "section": "wordform", "section_label": "Từ loại (Word Formation)", "exam_label": "CPA 2017 - Đề Lẻ"}, {"id": "2017-le-wordform-5", "type": "fill_blank", "prompt": "I think we should try something else. That strategy seems way too ....................... for our company\nbudget. (risk)", "answer": "risky", "explanation": "(risk)\nrisk (n) sự rủi ro\nrisky (adj) mạo hiểm", "needs_review": false, "section": "wordform", "section_label": "Từ loại (Word Formation)", "exam_label": "CPA 2017 - Đề Lẻ"}, {"id": "2017-le-sentence-build-1", "type": "sentence_building", "prompt": "Anna / sister / her / mother / look / both / and / like / her.", "answer": "Both Anna and her sister look like her mother.", "explanation": "", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2017 - Đề Lẻ"}, {"id": "2017-le-sentence-build-2", "type": "sentence_building", "prompt": "We/ wait/ her / until/ for/ she/ will/ come/ back", "answer": "We will wait for her until she comes back.", "explanation": "", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2017 - Đề Lẻ"}, {"id": "2017-le-sentence-build-3", "type": "sentence_building", "prompt": "The / was / too / us / gain / for / short / class discussion / some / from/ it/ knowledge/to.", "answer": "The class discussion was too short for us to gain some knowledge from it.", "explanation": "", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2017 - Đề Lẻ"}, {"id": "2017-le-sentence-build-4", "type": "sentence_building", "prompt": "People / still/ many/ him/ believe/ he/ although/ tell/ sometimes/ lies.", "answer": "Many people still believe him although he sometimes tells lies.", "explanation": "", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2017 - Đề Lẻ"}, {"id": "2017-le-sentence-build-5", "type": "sentence_building", "prompt": "Look after/ the/ children/ will/ while/ who/ go out/ to/ work/ you?", "answer": "Who will look after the children while you go out to work?", "explanation": "", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2017 - Đề Lẻ"}, {"id": "2017-le-sentence-build-6", "type": "sentence_building", "prompt": "Bill/ because/ he/ boss/ unhappy/ doesn’t/ his/ get on well/ with/ seems", "answer": "Bill seems unhappy because he doesn't get on well with his boss.", "explanation": "", "needs_review": false, "section": "sentence-build", "section_label": "Viết câu từ từ gợi ý", "exam_label": "CPA 2017 - Đề Lẻ"}, {"id": "2017-le-sentence-build-7", "type": "sentence_building", "prompt": "The/ will/ encourage/ new law/ growth / export market/ next/ the/ in/ year", "answer": "The new law will encourage the growth in export market next year.", "explanation": "", "needs_review": false, "section": "sentence-build", "sectio

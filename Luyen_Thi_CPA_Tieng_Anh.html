  // ---------- practice session engine ----------
  function buildQueue(items){
    // filter out unresolved/needs_review items so nothing wrong is shown as certain
    return shuffle(items.filter(function(it){ return !it.needs_review; }));
  }

  // Same filtering as buildQueue, but orders the pool by how many times the CURRENT
  // profile has already attempted each question (fewest attempts first, ties broken
  // randomly). This is what makes "Luyện theo dạng bài" / "Ngẫu nhiên tổng hợp" /
  // "Làm đề đầy đủ" automatically steer each person toward questions they haven't
  // done yet (or have only done once) instead of re-serving ones they've already
  // covered -- so across repeated sessions everyone works toward full coverage with
  // >=2 attempts per question, using the per-profile stats already saved in the db.
  function buildQueueSmart(items, cb){
    var pool = shuffle(items.filter(function(it){ return !it.needs_review; }));
    if(!state.profile){ cb(pool); return; }
    getStatsDoc(state.profile.id).then(function(doc){
      var qmap = (doc && doc.questions) || {};
      pool.sort(function(a,b){
        var ca = (qmap[a.id] && qmap[a.id].attempts) || 0;
        var cb2 = (qmap[b.id] && qmap[b.id].attempts) || 0;
        return ca - cb2;
      });
      cb(pool);
    }).catch(function(){ cb(pool); });
  }

  function startSession(mode, items, opts){
    opts = opts || {};
    state.session = {
      mode: mode,
      queue: items,
      idx: 0,
      correct: 0,
      answered: [],
      revealed: false,
      userAnswer: null,
      groupPassageKey: opts.groupPassageKey || null
    };
    state.view = "practice";
    render();
  }

  function currentItem(){
    var s = state.session;
    return s ? s.queue[s.idx] : null;
  }

  function renderPractice(){
    var s = state.session;
    if(!s || s.queue.length===0){
      return '<div class="card"><p>Không có câu hỏi phù hợp (có thể toàn bộ câu ở lựa chọn này đang cần rà soát).</p>'+
        '<button class="btn secondary" data-action="goHome">Về trang chủ</button></div>';
    }
    var it = currentItem();
    var pct = Math.round((s.idx)/s.queue.length*100);
    var body = "";
    if(it.type==="mcq") body = renderMcq(it, s);
    else if(it.type==="fill_blank" || it.type==="cloze") body = renderFillBlank(it, s);
    else body = renderOpenEnded(it, s);

    return '<div class="card">'+
      '<div class="row between" style="margin-bottom:10px;">'+
        '<button class="backlink" data-action="confirmExit">&larr; Thoát</button>'+
        '<span class="pill">'+esc(it.section_label || SECTION_LABEL[it.section] || "")+'</span>'+
      '</div>'+
      '<div class="progressbar" style="margin-bottom:14px;"><div style="width:'+pct+'%"></div></div>'+
      '<div class="muted small" style="margin-bottom:8px;">Câu '+(s.idx+1)+' / '+s.queue.length+' &middot; Đúng '+s.correct+'</div>'+
      body+
      (it.exam_label? '<div class="muted small" style="margin-top:14px; border-top:1px solid var(--line); padding-top:8px;">📖 Nguồn: '+esc(it.exam_label)+' &middot; mã câu <code>'+esc(it.id)+'</code></div>' : "")+
      '</div>';
  }

  function highlightPassage(passage, gapNum){
    if(gapNum==null) return esc(passage);
    var re = new RegExp("\\("+gapNum+"\\)\\s*_+","g");
    return esc(passage).replace(re, function(m){ return '<span class="blank">'+esc(m)+'</span>'; });
  }

  function renderMcq(it, s){
    var passage = it.passage ? '<div class="passage">'+highlightPassage(it.passage, null)+'</div>' : "";
    var optsHtml = (it.options||[]).map(function(o){
      var cls = "opt";
      var extra = "";
      if(s.revealed){
        if(o.label===it.answer) cls += " correct";
        else if(o.label===s.userAnswer) cls += " wrong";
      }
      return '<label class="'+cls+'" data-mcq-opt="'+esc(o.label)+'">'+
        '<span class="lab">'+esc(o.label)+'</span><span>'+esc(o.text)+'</span>'+extra+'</label>';
    }).join("");
    var feedback = "";
    if(s.revealed){
      var ok = s.userAnswer===it.answer;
      feedback = '<div class="feedback '+(ok?"ok":"bad")+'">'+(ok?"Chính xác!":"Chưa đúng. Đáp án đúng là "+esc(it.answer)+".")+'</div>'+
        (it.explanation? '<div class="explain">'+esc(it.explanation)+'</div>' : "");
    }
    return passage+
      '<div class="qtext">'+esc(it.prompt)+'</div>'+
      '<div class="options">'+optsHtml+'</div>'+
      feedback+
      renderNavButtons(s, !s.revealed, s.userAnswer==null);
  }

  function renderFillBlank(it, s){
    var passageHtml = "";
    var qHtml = "";
    if(it.type==="cloze"){
      passageHtml = '<div class="passage">'+highlightPassage(it.passage, it.gap_number)+'</div>';
      qHtml = '<div class="qtext">Điền từ còn thiếu cho vị trí số ('+it.gap_number+').</div>';
    } else {
      var wfInstr = it.section==="wordform" ? '<div class="pill" style="margin-bottom:8px;">Điền từ đúng dạng (danh từ/động từ/tính từ...) vào chỗ trống:</div>' : '<div class="pill" style="margin-bottom:8px;">Điền một từ/cụm từ thích hợp vào chỗ trống:</div>';
      qHtml = wfInstr+'<div class="qtext">'+esc(it.prompt).replace(/_{3,}/, '<span class="blank">_____</span>')+'</div>';
    }
    var disabled = s.revealed ? "disabled" : "";
    var val = s.userAnswer!=null ? esc(s.userAnswer) : "";
    var feedback = "";
    if(s.revealed){
      var ok = fillBlankCorrect(s.userAnswer, it.answer);
      feedback = '<div class="feedback '+(ok?"ok":"bad")+'">'+
        (ok? "Chính xác!" : "Đáp án đúng: "+esc(it.answer))+
        '</div>'+(it.explanation? '<div class="explain">'+esc(it.explanation)+'</div>' : "");
    }
    return passageHtml+qHtml+
      '<input type="text" id="fillInput" '+disabled+' value="'+val+'" placeholder="Nhập câu trả lời của bạn" autocomplete="off">'+
      feedback+
      renderNavButtons(s, !s.revealed, false, "checkFillBtn");
  }

  var OPEN_INSTRUCTIONS = {
    "reading-open": "Trả lời câu hỏi sau dựa vào đoạn văn ở trên:",
    "sentence-build": "Sắp xếp và biến đổi các từ/cụm từ gợi ý sau đây thành một câu hoàn chỉnh, đúng ngữ pháp:",
    "transform": "Viết lại câu sau sao cho nghĩa không đổi:",
    "translate-en-vi": "Dịch câu sau sang tiếng Việt:",
    "translate-vi-en": "Dịch câu sau sang tiếng Anh:"
  };
  function renderOpenEnded(it, s){
    var passageHtml = it.passage ? '<div class="passage">'+highlightPassage(it.passage,null)+'</div>' : "";
    var val = s.userAnswer!=null ? s.userAnswer : "";
    var instr = OPEN_INSTRUCTIONS[it.section];
    var body = passageHtml+
      (instr? '<div class="pill" style="margin-bottom:8px;">'+esc(instr)+'</div>' : "")+
      '<div class="qtext">'+esc(it.prompt)+'</div>'+
      '<textarea id="openInput" '+(s.revealed?"disabled":"")+' placeholder="Nhập câu trả lời của bạn">'+esc(val)+'</textarea>';
    if(!s.revealed){
      body += '<div class="row" style="margin-top:12px;">'+
        backButtonHtml(s)+
        '<button class="btn" id="revealBtn">Chấm bài & xem đáp án</button>'+
        '</div>';
    } else {
      var rec = s.answered[s.idx];
      var isCorrectNow = rec ? rec.correct : false;
      var scorePct = s.lastGrade ? Math.round(s.lastGrade.score*100) : null;
      body += '<div class="feedback '+(isCorrectNow?"ok":"bad")+'">'+
          (isCorrectNow? "Máy chấm: Đúng" : "Máy chấm: Chưa đúng")+
          (scorePct!=null? ' <span class="small" style="opacity:.75;">(khớp '+scorePct+'% từ khoá với đáp án mẫu)</span>' : "")+
        '</div>'+
        '<div class="feedback" style="background:var(--surface-2); color:var(--ink);">'+
        '<strong>Đáp án mẫu:</strong><br>'+esc(it.answer)+'</div>'+
        (it.explanation? '<div class="explain">'+esc(it.explanation)+'</div>' : "")+
        '<div class="row" style="margin-top:12px;">'+
          '<span class="small muted" style="margin-right:6px;">Máy chấm câu tự luận có thể chưa chính xác 100%. Nếu chấm sai, đổi lại:</span>'+
        '</div>'+
        '<div class="row" style="margin-top:6px;">'+
          '<button class="btn secondary" data-override-grade="correct"'+(isCorrectNow?" disabled":"")+'>Đổi thành Đúng</button>'+
          '<button class="btn secondary" data-override-grade="wrong"'+(!isCorrectNow?" disabled":"")+'>Đổi thành Sai</button>'+
        '</div>'+
        renderNavButtons(s, false, false);
    }
    return body;
  }

  function backButtonHtml(s){
    return s.idx>0 ? '<button class="btn secondary" id="backBtn">&larr; Câu trước</button>' : '';
  }
  function renderNavButtons(s, showCheck, checkDisabled, checkId){
    if(showCheck){
      return '<div class="row" style="margin-top:14px;">'+
        backButtonHtml(s)+
        '<button class="btn" id="'+(checkId||"checkBtn")+'" '+(checkDisabled?"disabled":"")+'>Kiểm tra</button>'+
        '</div>';
    }
    var isLast = s.idx >= s.queue.length-1;
    return '<div class="row" style="margin-top:14px;">'+
      backButtonHtml(s)+
      '<button class="btn" id="nextBtn">'+(isLast? "Xem kết quả" : "Câu tiếp theo →")+'</button>'+
      '</div>';
  }

  // ---------- summary ----------
  function renderSummary(){
    var s = state.session;
    var total = s.answered.length;
    var correct = s.correct;
    var bySection = {};
    s.answered.forEach(function(a){
      var k = a.section;
      bySection[k] = bySection[k] || {c:0,t:0};
      bySection[k].t++; if(a.correct) bySection[k].c++;
    });
    var rows = Object.keys(bySection).map(function(k){
      var v = bySection[k];
      return '<tr><td>'+esc(SECTION_LABEL[k]||k)+'</td><td class="num">'+v.c+'/'+v.t+'</td><td class="num">'+fmtPct(v.c,v.t)+'</td></tr>';
    }).join("");
    return '<div class="card center">'+
      '<h2>Kết quả</h2>'+
      '<div style="font-family:var(--font-display); font-size:40px; font-weight:600; margin:8px 0;">'+correct+' / '+total+'</div>'+
      '<div class="muted">Tỷ lệ đúng: '+fmtPct(correct,total)+'</div>'+
      '</div>'+
      '<div class="card">'+
        '<h3 style="margin-bottom:10px;">Theo dạng bài</h3>'+
        '<div class="tablewrap"><table><thead><tr><th>Dạng bài</th><th class="num">Đúng/Tổng</th><th class="num">Tỷ lệ</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
      '</div>'+
      '<div class="row" style="justify-content:center;">'+
        '<button class="btn secondary" data-action="goHome">Về trang chủ</button>'+
        '<button class="btn" data-action="goStats">Xem thống kê chi tiết</button>'+
      '</div>';
  }

  // ---------- stats ----------
  function renderStats(){
    var cache = state.statsCache;
    if(!cache) return '<div class="card center muted">Đang tải thống kê…</div>';
    var q = cache.questions || {};
    var ids = Object.keys(q);
    var totalAttempts=0, totalCorrect=0;
    var bySection = {};
    ids.forEach(function(id){
      var rec = q[id];
      totalAttempts += rec.attempts; totalCorrect += rec.correct;
      var sec = rec.section || "khac";
      bySection[sec] = bySection[sec] || {c:0,t:0};
      bySection[sec].c += rec.correct; bySection[sec].t += rec.attempts;
    });
    var barsHtml = SECTIONS.map(function(sdef){
      var v = bySection[sdef.key];
      if(!v || v.t===0) return "";
      var pct = Math.round(v.c/v.t*100);
      var color = pct>=75? "var(--success)" : pct>=50? "var(--warn)" : "var(--danger)";
      return '<div class="barrow"><div class="lbl">'+esc(sdef.label)+'</div>'+
        '<div class="track"><div class="fill" style="width:'+pct+'%; background:'+color+';"></div></div>'+
        '<div class="val">'+pct+'%</div></div>';
    }).join("");

    var mistakes = ids.map(function(id){ return Object.assign({id:id}, q[id]); })
      .filter(function(r){ return r.wrong>0; })
      .sort(function(a,b){ return (b.wrong-b.correct) - (a.wrong-a.correct) || b.wrong-a.wrong; })
      .slice(0,15);
    var mistakeRows = mistakes.map(function(r){
      var item = ALL_ITEMS.filter(function(it){ return it.id===r.id; })[0];
      var label = item ? (item.prompt || item.passage || "").slice(0,70) : r.id;
      var source = item ? (item.exam_label||"") : "";
      return '<tr><td>'+esc(label)+(label.length>=70?"…":"")+'</td><td class="small muted">'+esc(SECTION_LABEL[r.section]||r.section)+'</td>'+
        '<td class="small muted">'+esc(source)+'</td>'+
        '<td class="num">'+r.wrong+'</td><td class="num">'+r.attempts+'</td></tr>';
    }).join("");

    // Coverage: how many of the practiceable questions has this profile done
    // 0 / 1 / >=2 times -- makes the "everyone must cover everything >=2x" goal
    // (which buildQueueSmart works toward) visible and checkable, not just implicit.
    var practiceable = ALL_ITEMS.filter(function(it){ return !it.needs_review; });
    var totalPracticeable = practiceable.length;
    var doneTwicePlus = 0, doneOnce = 0, notDone = 0;
    practiceable.forEach(function(it){
      var att = (q[it.id] && q[it.id].attempts) || 0;
      if(att>=2) doneTwicePlus++;
      else if(att===1) doneOnce++;
      else notDone++;
    });
    var coverageHtml = '<div class="card"><h3 style="margin-bottom:10px;">Tiến độ ôn tập (đủ 2 lần/câu)</h3>'+
      '<div class="statgrid">'+
        statTile(doneTwicePlus+"/"+totalPracticeable, "Đã làm ≥2 lần")+
        statTile(doneOnce, "Mới làm 1 lần")+
        statTile(notDone, "Chưa làm lần nào")+
      '</div>'+
      '<p class="muted small" style="margin-top:8px;">Các chế độ luyện tập tự động ưu tiên đưa câu chưa làm hoặc mới làm 1 lần lên trước, nên chỉ cần luyện tiếp là số liệu này sẽ tăng dần.</p>'+
    '</div>';

    return '<div class="card">'+
      '<button class="backlink" data-action="goHome">&larr; Về trang chủ</button>'+
      '<h2 style="margin-top:10px;">Thống kê của '+esc(state.profile.name)+'</h2>'+
      '</div>'+
      '<div class="statgrid">'+
        statTile(totalAttempts,"Lượt làm bài")+
        statTile(totalCorrect,"Câu trả lời đúng")+
        statTile(fmtPct(totalCorrect,totalAttempts),"Tỷ lệ đúng chung")+
      '</div>'+
      coverageHtml+
      '<div class="card"><h3 style="margin-bottom:14px;">Tỷ lệ đúng theo dạng bài</h3>'+(barsHtml||'<p class="muted small">Chưa có dữ liệu.</p>')+'</div>'+
      '<div class="card"><h3 style="margin-bottom:10px;">Câu hay sai nhất</h3>'+
        (mistakes.length? '<div class="tablewrap"><table><thead><tr><th>Câu hỏi</th><th>Dạng</th><th>Nguồn (đề)</th><th class="num">Số lần sai</th><th class="num">Số lần làm</th></tr></thead><tbody>'+mistakeRows+'</tbody></table></div>'
          : '<p class="muted small">Chưa có câu nào bị làm sai — rất tốt!</p>')+
        (mistakes.length? '<div style="margin-top:14px;"><button class="btn" data-action="goReviewMistakes">Luyện lại các câu này</button></div>' : "")+
      '</div>';
  }
  function statTile(n,l){
    return '<div class="stattile"><div class="n">'+n+'</div><div class="l">'+esc(l)+'</div></div>';
  }

  // ---------- events ----------
  function bindEvents(){
    var app = el("app");

    var goBtn = el("profileGoBtn");
    if(goBtn){
      goBtn.addEventListener("click", function(){
        var phoneInput = el("profilePhoneInput");
        var raw = (phoneInput.value||"").trim();
        if(!raw){ phoneInput.focus(); return; }
        state._authBusy = true; state._authError = null; render();
        authenticateByPhone(raw).then(function(profile){
          state._authBusy = false;
          if(!profile){
            state._authError = "Số điện thoại này chưa được cấp quyền truy cập. Vui lòng liên hệ Manabox để được hỗ trợ.";
            render();
            return;
          }
          state._authError = null;
          state.profile = profile;
          setLocalProfile(profile);
          state.view = "home";
          render();
        });
      });
    }
    var phoneInputEl = el("profilePhoneInput");
    if(phoneInputEl){
      phoneInputEl.addEventListener("keydown", function(e){
        if(e.key==="Enter" && !state._authBusy){ el("profileGoBtn").click(); }
      });
    }

    app.querySelectorAll("[data-action]").forEach(function(b){
      b.addEventListener("click", function(){ handleAction(b.getAttribute("data-action")); });
    });

    app.querySelectorAll("[data-start-exam]").forEach(function(b){
      b.addEventListener("click", function(){
        var key = b.getAttribute("data-start-exam");
        var parts = key.split("-"); var year = parts[0], ver = parts[1];
        var items = ALL_ITEMS.filter(function(it){ return it.year===year && it.version===ver; });
        buildQueueSmart(items, function(queue){ startSession("exam:"+key, queue); });
      });
    });

    app.querySelectorAll("[data-toggle-section]").forEach(function(b){
      b.addEventListener("click", function(){
        state._chosenSections = state._chosenSections || {};
        var k = b.getAttribute("data-toggle-section");
        state._chosenSections[k] = !state._chosenSections[k];
        render();
      });
    });
    var startSecBtn = el("startSectionPractice");
    if(startSecBtn){
      startSecBtn.addEventListener("click", function(){
        var chosen = Object.keys(state._chosenSections||{}).filter(function(k){ return state._chosenSections[k]; });
        if(chosen.length===0){ return; }
        var n = parseInt(el("sectionCountSelect").value,10);
        var pool = ALL_ITEMS.filter(function(it){ return chosen.indexOf(it.section)!==-1; });
        buildQueueSmart(pool, function(queue){ startSession("sections:"+chosen.join(","), queue.slice(0,n)); });
      });
    }

    // MCQ option pick
    app.querySelectorAll("[data-mcq-opt]").forEach(function(o){
      o.addEventListener("click", function(){
        if(state.session.revealed) return;
        state.session.userAnswer = o.getAttribute("data-mcq-opt");
        render();
      });
    });
    var checkBtn = el("checkBtn");
    if(checkBtn) checkBtn.addEventListener("click", function(){ revealAndGrade(); });
    var checkFillBtn = el("checkFillBtn");
    if(checkFillBtn) checkFillBtn.addEventListener("click", function(){
      state.session.userAnswer = el("fillInput").value;
      revealAndGrade();
    });
    var fillInput = el("fillInput");
    if(fillInput){
      fillInput.addEventListener("keydown", function(e){
        if(e.key==="Enter" && !state.session.revealed){ state.session.userAnswer = fillInput.value; revealAndGrade(); }
      });
      fillInput.addEventListener("input", function(){ state.session.userAnswer = fillInput.value; });
      var cb = el("checkFillBtn"); if(cb) cb.disabled=false;
    }
    var openInput = el("openInput");
    if(openInput){ openInput.addEventListener("input", function(){ state.session.userAnswer = openInput.value; }); }
    var revealBtn = el("revealBtn");
    if(revealBtn) revealBtn.addEventListener("click", function(){ revealAndAutoGradeOpen(); });
    app.querySelectorAll("[data-override-grade]").forEach(function(b){
      b.addEventListener("click", function(){
        var g = b.getAttribute("data-override-grade");
        overrideGrade(g==="correct");
      });
    });
    var nextBtn = el("nextBtn");
    if(nextBtn) nextBtn.addEventListener("click", function(){ advance(); });
    var backBtn = el("backBtn");
    if(backBtn) backBtn.addEventListener("click", function(){ goBack(); });
  }

  function revealAndGrade(){
    var it = currentItem();
    var s = state.session;
    var ok;
    if(it.type==="mcq") ok = s.userAnswer===it.answer;
    else ok = fillBlankCorrect(s.userAnswer, it.answer);
    finalizeAnswer(ok);
  }

  function finalizeAnswer(isCorrect){
    var it = currentItem();
    var s = state.session;
    s.revealed = true;
    if(isCorrect) s.correct++;
    // s.answered is filled strictly in queue order (one push per idx, idx only ever
    // moves forward one step at a time), so s.answered[i] always corresponds to
    // s.queue[i] -- this lets goBack()/loadIdxState() and overrideGrade() look a
    // record up by idx safely even after the student has navigated back and forth.
    s.answered.push({id:it.id, section:it.section, correct:isCorrect, userAnswer:s.userAnswer, lastGrade:s.lastGrade});
    recordAttempt(it, isCorrect);
    render();
  }

  function revealAndAutoGradeOpen(){
    var it = currentItem();
    var s = state.session;
    var grade = autoGradeOpenEnded(s.userAnswer, it.answer, it.section);
    s.lastGrade = grade;
    finalizeAnswer(grade.isCorrect);
  }

  // Lets the student flip the auto-grader's verdict for the question just answered.
  // Adjusts the in-session tally and the persisted stats without double-counting the attempt.
  function overrideGrade(newCorrect){
    var it = currentItem();
    var s = state.session;
    var rec = s.answered[s.idx];
    if(!rec || rec.id!==it.id || rec.correct===newCorrect) return;
    s.correct += newCorrect ? 1 : -1;
    rec.correct = newCorrect;
    correctLastAttempt(it, newCorrect);
    render();
  }

  // Restores the UI state for s.idx: if that question was already answered
  // (navigating back, or forward again after going back), show its recorded
  // answer/grade in review mode; otherwise start it fresh.
  function loadIdxState(idx){
    var s = state.session;
    var rec = s.answered[idx];
    if(rec){
      s.revealed = true;
      s.userAnswer = rec.userAnswer!=null ? rec.userAnswer : null;
      s.lastGrade = rec.lastGrade || null;
    } else {
      s.revealed = false;
      s.userAnswer = null;
      s.lastGrade = null;
    }
  }

  function goBack(){
    var s = state.session;
    if(s.idx<=0) return;
    s.idx--;
    loadIdxState(s.idx);
    render();
  }

  function advance(){
    var s = state.session;
    if(s.idx < s.queue.length-1){
      s.idx++; loadIdxState(s.idx);
      render();
    } else {
      recordSession(s.mode, s.answered.length, s.correct);
      state.view = "summary";
      render();
    }
  }

  function handleAction(action){
    if(action==="goHome"){ state.view="home"; render(); }
    else if(action==="goPickYear"){ state.view="pickYear"; render(); }
    else if(action==="goPickSections"){ state._chosenSections={}; state.view="pickSections"; render(); }
    else if(action==="goRandomMix"){
      buildQueueSmart(ALL_ITEMS, function(queue){ startSession("random-mix", queue.slice(0,20)); });
    }
    else if(action==="goReviewMistakes"){ startReviewMistakes(); }
    else if(action==="goStats"){ loadStatsThenRender(); }
    else if(action==="goSwitchProfile"){ switchProfile(); }
    else if(action==="confirmExit"){
      if(confirm("Thoát khỏi bài luyện tập hiện tại?")){ state.view="home"; render(); }
    }
  }

  function startReviewMistakes(){
    loadStatsThenRender(true).then(function(){
      var cache = state.statsCache;
      var q = (cache && cache.questions) || {};
      var wrongIds = Object.keys(q).filter(function(id){ return q[id].wrong > 0; });
      if(wrongIds.length===0){
        alert("Bạn chưa có câu nào bị làm sai. Hãy luyện tập thêm!");
        state.view="home"; render();
        return;
      }
      var items = ALL_ITEMS.filter(function(it){ return wrongIds.indexOf(it.id)!==-1 && !it.needs_review; });
      startSession("review-mistakes", shuffle(items));
    });
  }

  function loadStatsThenRender(silent){
    state.view = silent? state.view : "stats";
    if(!silent) render();
    return getStatsDoc(state.profile.id).then(function(doc){
      state.statsCache = doc;
      if(!silent) render();
      return doc;
    });
  }

  // Clears the current profile and returns to the phone-verification screen
  // (used for "Đổi hồ sơ" -- switching to a different person on the same device).
  function switchProfile(){
    state.profile = null;
    setLocalProfile(null);
    state._authError = null;
    state.view = "chooseProfile";
    render();
  }

  // ---------- boot ----------
  function boot(){
    state.view = "loading"; render();
    loadData().then(function(){
      var local = loadLocalProfile();
      if(local){
        state.profile = local;
        state.view = "home";
        render();
      } else {
        state.view = "chooseProfile";
        render();
      }
    }).catch(function(err){
      el("app").innerHTML = renderTopbar() + '<div class="card"><p>Không tải được bộ câu hỏi. Vui lòng thử tải lại trang.</p><p class="small muted">'+esc(err&&err.message)+'</p></div>';
    });
  }

  if(window.claude && window.claude.hot){
    window.claude.hot.ready ? window.claude.hot.ready(boot) : boot();
  } else {
    boot();
  }
})();
</script>
